      <div style="height:36px;background:${vars.bg};display:flex;flex-direction:column;justify-content:space-between;padding:4px 5px;">

        <div style="display:flex;gap:3px;">

          <div style="width:20px;height:12px;border-radius:3px;background:${vars.accent};opacity:.85;"></div>

  });

function toggleBgPanel(){
  const p = document.getElementById('bg-panel');
  // Move to body so it's not clipped by topbar overflow
  if(p.parentElement !== document.body) document.body.appendChild(p);
  p.classList.toggle('open');
  if(p.classList.contains('open')){
    buildThemeGrid();
    // Position below the Design button, clamp within visible desktop area
    const btn = document.querySelector('[onclick="toggleBgPanel()"]');
    if(btn){
      const r = btn.getBoundingClientRect();
      const panelW = 260;
      const topbarH = document.getElementById('topbar').offsetHeight;
      const maxPanelH = window.innerHeight - topbarH - 16;
      p.style.maxHeight = maxPanelH + 'px';
      const left = Math.max(8, Math.min(r.left, window.innerWidth - panelW - 8));
      p.style.left = left + 'px';
      p.style.top  = Math.round(r.bottom + 8) + 'px';
      p.style.right = 'auto';
      p.style.bottom = 'auto';
    }
  }
}
// ── BG-PANEL RESIZE ──
(function(){
  let _sx,_sy,_sw,_sh,_active=false;
  function initBgPanelResize(){
    const p=document.getElementById('bg-panel');
    const h=document.getElementById('bg-panel-resize');
    if(!p||!h||h._bound) return;
    h._bound=true;
    const onDown=e=>{
      e.preventDefault(); e.stopPropagation();
      _active=true;
      _sx=e.clientX||e.touches?.[0]?.clientX;
      _sy=e.clientY||e.touches?.[0]?.clientY;
      _sw=p.offsetWidth; _sh=p.offsetHeight;
      document.addEventListener('mousemove',onMove);
      document.addEventListener('mouseup',onUp);
      document.addEventListener('touchmove',onMoveT,{passive:false});
      document.addEventListener('touchend',onUp);
    };
    const resize=(cx,cy)=>{
      const topbarH=document.getElementById('topbar').offsetHeight||68;
      const maxH=window.innerHeight-topbarH-16;
      const panelTop=parseInt(p.style.top)||0;
      const newW=Math.min(520,Math.max(200,_sw+(cx-_sx)));
      const newH=Math.min(maxH,Math.max(120,_sh+(cy-_sy)));
      p.style.width=newW+'px';
      p.style.maxHeight=newH+'px';
      // Rechten Rand nicht aus dem Viewport schieben
      const left=parseInt(p.style.left)||0;
      if(left+newW>window.innerWidth-8) p.style.left=Math.max(8,window.innerWidth-newW-8)+'px';
    };
    const onMove=e=>{ if(_active) resize(e.clientX,e.clientY); };
    const onMoveT=e=>{ if(_active){e.preventDefault();resize(e.touches[0].clientX,e.touches[0].clientY);} };
    const onUp=()=>{
      _active=false;
      document.removeEventListener('mousemove',onMove);
      document.removeEventListener('mouseup',onUp);
      document.removeEventListener('touchmove',onMoveT);
      document.removeEventListener('touchend',onUp);
    };
    h.addEventListener('mousedown',onDown);
    h.addEventListener('touchstart',e=>onDown(e),{passive:false});
  }
  // Init sobald Panel zum ersten Mal geöffnet wird
  const _orig=window.toggleBgPanel;
  window.toggleBgPanel=function(){
    _orig&&_orig();
    requestAnimationFrame(initBgPanelResize);
  };
})();

// ── Zentrale Hilfsfunktion: Desktop-Abmessungen zuverlässig ermitteln ──
function getDesktopBounds(){
  // desktop.clientWidth/Height sind die verlässlichsten Werte, aber nur wenn
  // das Element bereits gerendert ist. Falls nicht, Fallback auf visualViewport.
  const dw = desktop.clientWidth  > 0 ? desktop.clientWidth  : (window.visualViewport ? window.visualViewport.width  : window.innerWidth)  || 390;
  const dh = desktop.clientHeight > 0 ? desktop.clientHeight : (window.visualViewport ? window.visualViewport.height : window.innerHeight) - (document.getElementById('topbar')?.offsetHeight||116) || 500;
  return { dw: Math.max(200, dw), dh: Math.max(200, dh) };
}

// ── Widget in Desktop-Grenzen einklemmen (Position + Größe) ──
function clampWidget(el){
  const { dw, dh } = getDesktopBounds();
  const type = el.dataset.type;
  const GAP = (type === 'spiele') ? 0 : 4;
  let w = el.offsetWidth;
  let h = el.offsetHeight;
  // Breite/Höhe nie größer als Desktop
  if(w > dw - GAP){ w = dw - GAP; el.style.width  = w + 'px'; }
  if(h > dh - GAP){ h = dh - GAP; el.style.height = h + 'px'; }
  // Position: nie rechts oder unten raus, nie negativ
  let l = parseInt(el.style.left) || 0;
  let t = parseInt(el.style.top)  || 0;
  if(l + w > dw - GAP) l = Math.max(0, dw - w - GAP);
  if(t + h > dh - GAP) t = Math.max(0, dh - h - GAP);
  if(l < 0) l = 0;
  if(t < 0) t = 0;
  el.style.left = l + 'px';
  el.style.top  = t + 'px';
}

function getInitialWidgetSize(type, def){
  const { dw, dh } = getDesktopBounds();
  const isPhone = dw < 700;

  let w, h;
  if(isPhone){
    // Handy: immer fast Vollbild-Breite
    w = dw - 8;
    // Spiele-Widgets: fast volle Höhe; andere: 75%
    const bigTypes = ['spiele','slot','wheel','draw','was'];
    h = Math.round(dh * (bigTypes.includes(type) ? 0.92 : 0.75));
  } else {
    w = Math.min(def.w, dw - 24);
    // spiele: immer volle Höhe
    const fullHeightTypes = ['spiele'];
    h = fullHeightTypes.includes(type) ? dh : Math.min(def.h, dh - 24);
  }
  // Absolute Grenzen (spiele darf volle dh nutzen)
  const fullH = ['spiele'].includes(type);
  w = Math.max(parseInt(def.minw)||200, Math.min(w, dw - 8));
  h = Math.max(parseInt(def.minh)||180, Math.min(h, fullH ? dh : dh - 8));
  return {w, h};
}

function spawnWidget(type){
  const def=WIDGET_DEFS[type]; if(!def)return;
  const uid=++instanceCounter;
  const id='widget-'+uid;

  const el=document.createElement('div');
  el.className='widget'; el.id=id; el.dataset.type=type;
  el.dataset.basew=def.w;
  el.dataset.baseh=def.h;
  if(def.minw) el.dataset.minw=def.minw;
  if(def.minh) el.dataset.minh=def.minh;

  // apply current alpha
  const alpha=getComputedStyle(document.documentElement).getPropertyValue('--widget-alpha').trim()||'0.70';
  el.style.background=`rgba(${getComputedStyle(document.body).getPropertyValue('--card-rgb').trim()},${alpha})`;

  const { dw, dh } = getDesktopBounds();
  const isPhone = dw < 700;
  const startSize = getInitialWidgetSize(type, def);

  // Startposition: auf Handy immer oben links mit minimalem Abstand
  // auf Desktop gestaffelt
  const openCount = desktop.querySelectorAll('.widget').length;
  const stepX = isPhone ? 0 : 26;
  const stepY = isPhone ? 0 : 30;
  const baseLeft = isPhone ? Math.round((dw - startSize.w) / 2) : 28;
  const baseTop  = isPhone ? 2 : 28;
  const stackIdx = openCount % 7;
  let startLeft = baseLeft + stackIdx * stepX;
  let startTop  = baseTop  + stackIdx * stepY;
  // spiele: immer oben beginnen (volle Höhe), kein Clamping
  if(type === 'spiele'){
    startTop  = 0;
    startLeft = Math.max(0, Math.min(startLeft, dw - startSize.w - 4));
  } else {
    // Sicherstellen dass Widget in Desktop bleibt
    startLeft = Math.max(0, Math.min(startLeft, dw - startSize.w - 4));
    startTop  = Math.max(0, Math.min(startTop,  dh - startSize.h - 4));
  }

  el.style.left   = startLeft + 'px';
  el.style.top    = startTop  + 'px';
  el.style.width  = startSize.w + 'px';
  if(def.fitContent){
    el.classList.add('fit-content');
  } else {
    el.style.height = startSize.h + 'px';
  }
  el.style.zIndex=++zTop;

  // Header
  const hdr=document.createElement('div');
  hdr.className='widget-header';
  hdr.dataset.titleKey = def.titleKey;
  hdr.innerHTML=`<span class="widget-title">${T(def.titleKey)}</span>
    <div class="wh-btns">
      <button class="wh-btn" title="" data-i18n-title="ttMinimieren"  onclick="minimizeWidget('${id}')">−</button>
      <button class="wh-btn" title="" data-i18n-title="ttMaximieren"  onclick="maximizeWidget('${id}')">⛶</button>
      <button class="wh-btn" title="" data-i18n-title="ttSchliessen"   onclick="killWidget('${id}')">✕</button>
    </div>`;
  el.appendChild(hdr);

  // Body
  const body=document.createElement('div');
  body.className='widget-body'; body.id='body-'+uid;
  el.appendChild(body);

  // Resize handle
  const rh=document.createElement('div');
  rh.className='resize-handle';
  rh.innerHTML=`<svg viewBox="0 0 10 10" width="11" height="11" fill="none">
    <line x1="2" y1="9" x2="9" y2="2" stroke="rgba(255,255,255,.7)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="6" y1="9" x2="9" y2="6" stroke="rgba(255,255,255,.7)" stroke-width="1.5" stroke-linecap="round"/>
  </svg>`;
  el.appendChild(rh);

  desktop.appendChild(el);
  el.addEventListener('mousedown',()=>el.style.zIndex=++zTop);
  el.addEventListener('touchstart',()=>el.style.zIndex=++zTop, {passive:true});
  makeDraggable(el,hdr);
  makeResizable(el,rh);
  if(WIDGET_DEFS[type]?.build) WIDGET_DEFS[type].build(body, uid);
  applyI18n(body);
  updateWidgetScale(el);
  updateEmptyHint();
  // Final clamp after render (layout may have changed widget size)
  requestAnimationFrame(()=>{ requestAnimationFrame(()=>{
    clampWidget(el);
    WIDGET_DEFS[type]?.afterSpawn?.(uid);
  }); });
  return el;
}

function _afterSpawnSpiele(uid){
  const wuid = uid * 1000 + 1;
  const triggerWheelResize = () => {
    const cv = document.getElementById('wheel-canvas-'+wuid);
    if(!cv) return;
    const stage = cv.closest('.wheel-stage');
    if(stage && stage.clientWidth > 0){
      const size = Math.max(120, Math.min(stage.clientWidth, stage.clientHeight, 680));
      const dpr  = Math.max(1, Math.min(2, window.devicePixelRatio||1));
      cv.width  = Math.round(size*dpr);
      cv.height = Math.round(size*dpr);
      cv.style.width  = size+'px';
      cv.style.height = size+'px';
      try{ drawQuestionWheel(wuid); }catch(_){}
    }
  };
  setTimeout(triggerWheelResize, 50);
  setTimeout(triggerWheelResize, 200);
}

function killWidget(id){

function minimizeWidget(id){
  const el=document.getElementById(id); if(!el)return;
  const body=el.querySelector('.widget-body');
  const rh=el.querySelector('.resize-handle');
  const mini=body.style.display==='none';
  if(!mini){
    // Minimieren
    el._savedH   = el.style.height;
    el._savedTop = el.style.top;
    body.style.display='none';
    rh.style.display='none';
    el.classList.remove('fit-content');
    el.style.height='36px';
  } else {
    // Wiederherstellen
    rh.style.display='';
    const def=WIDGET_DEFS[el.dataset.type];
    if(def && def.fitContent){
      el.style.height='';
      el.classList.add('fit-content');
    } else {
      el.style.height=el._savedH||'';
    }
    // Top-Position wiederherstellen (wird beim Minimieren gespeichert)
    if(el._savedTop !== undefined) el.style.top = el._savedTop;
    const _uid = parseInt(id.replace('widget-',''));
    if(WIDGET_DEFS[el.dataset.type]?.onRestore){
      WIDGET_DEFS[el.dataset.type].onRestore(_uid, el, body);
    } else {
      body.style.display='';
    }
  }
}

function maximizeWidget(id){
  const el=document.getElementById(id); if(!el)return;
  const isMax=el._maximized;
  if(!isMax){
    el._savedMaxState={
      left:el.style.left, top:el.style.top,
      width:el.style.width, height:el.style.height,
      fitContent:el.classList.contains('fit-content')
    };
    el._maximized=true;
    el.classList.remove('fit-content');
    el.classList.add('_maximized-state');
    const { dw, dh } = getDesktopBounds();
    el.style.left='0px';
    el.style.top='0px';
    el.style.width=dw+'px';
    el.style.maxWidth='none';
    el.style.maxHeight='none';
    el.style.height=dh+'px';
    el.style.zIndex=++zTop;
    const body=el.querySelector('.widget-body');
    const rh=el.querySelector('.resize-handle');
    if(body && body.style.display==='none'){
      body.style.display='';
      if(rh) rh.style.display='';
    }
    const btn=el.querySelector('.wh-btn[title="Maximieren"]');
    if(btn){ btn.title=T('ttWiederherstellen'); btn.textContent='⧉'; }
  } else {
    el._maximized=false;
    el.classList.remove('_maximized-state');
    const s=el._savedMaxState||{};
    if(s.fitContent){
      el.classList.add('fit-content');
      el.style.height='';
    } else {
      el.style.height=s.height||'';
    }
    el.style.left=s.left||'0px';
    el.style.top=s.top||'0px';
    el.style.width=s.width||'';
    el.style.maxWidth='';
    el.style.maxHeight='';
    const btn=el.querySelector('.wh-btn[title="Wiederherstellen"]');
    if(btn){ btn.title=T('ttMaximieren'); btn.textContent='⛶'; }
    clampWidget(el);
  }
  updateWidgetScale(el);
  const _muid = parseInt(el.id.replace('widget-',''));
  WIDGET_DEFS[el.dataset.type]?.onResize?.(_muid, el);
}

function updateWidgetScale(el){
  // Version 9: ein gemeinsamer UI-Scale für Breite UND Höhe.
  // Dadurch wächst nicht nur Text, sondern die ganze Widget-Oberfläche gleichmäßiger.
  const baseW=parseFloat(el.dataset.basew)||260;
  const baseH=parseFloat(el.dataset.baseh)||260;
  const w=el.offsetWidth||parseInt(el.style.width)||baseW;
  const h=el.offsetHeight||parseInt(el.style.height)||baseH;
  const wScale=w/baseW;
  const hScale=h/baseH;
  const uiScale=Math.max(0.62,Math.min(2.35,Math.min(wScale,hScale)));
  el.style.setProperty('--wscale',wScale.toFixed(3));
  el.style.setProperty('--hscale',hScale.toFixed(3));
  el.style.setProperty('--uiscale',uiScale.toFixed(3));

  // Canvas-/SVG-Widgets nach dem Größenwechsel nachziehen.
  requestAnimationFrame(()=>{
    el.querySelectorAll('canvas.draw-canvas').forEach(cv=>{ try{ resizeDrawCanvas(cv); }catch(_){ } });
    el.querySelectorAll('[id^="aclock-"]').forEach(cv=>{ const uid=cv.id.replace('aclock-',''); try{ drawAnalogClock(uid); }catch(_){ } });
    // Namen-Widget: Schriftgröße bei Fensterwechsel neu berechnen (force recompute)
    if(el.dataset.type==='names'){
      const disp=el.querySelector('[id^="namedisp-"]');
      if(disp){ const uid=disp.id.replace('namedisp-',''); _nameFontCache[uid]=null; try{ calcNameFontSize(uid, true); }catch(_){} }
    }
    // Was?-Widget: Canvas nach Fenstergrößenänderung neu berechnen
    if(el.dataset.type==='was'){
      const wrap=el.querySelector('[id^="was-canvas-wrap-"]');
      if(wrap && wrap.style.display!=='none'){
        const cv=el.querySelector('[id^="was-canvas-"]');
        if(cv){
          const uid=cv.id.replace('was-canvas-','');
          const s=wasState&&wasState[uid];
          if(s&&s.imgs&&s.imgs.length) wasActivatePhoto(uid,s.imgIndex||0);
        }
      }
    }
  });
}

// DRAG
// ════════════════════════════════════════════════
function makeDraggable(el,handle){
  let ox,oy,sx,sy;

  function dragTo(cx, cy){
    const { dw, dh } = getDesktopBounds();
    const w = el.offsetWidth;
    const h = el.offsetHeight;
    // Allow header to always be reachable (40px visible minimum)
    const newL = Math.max(-(w-60), Math.min(dw-40, ox + cx - sx));
    const newT = Math.max(0,         Math.min(dh-36, oy + cy - sy));
    el.style.left = newL + 'px';
    el.style.top  = newT + 'px';
  }

  // Mouse
  handle.addEventListener('mousedown', e=>{
    if(e.button!==0 || e.target.classList.contains('wh-btn')) return;
    e.preventDefault();
    ox=parseInt(el.style.left)||0; oy=parseInt(el.style.top)||0;
    sx=e.clientX; sy=e.clientY;
    el.classList.add('dragging');
    const mv = e=>dragTo(e.clientX, e.clientY);
    const up = ()=>{ el.classList.remove('dragging'); document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up); };
    document.addEventListener('mousemove',mv);
    document.addEventListener('mouseup',up);
  });

  // Touch (Pointer Events preferred for better cancellation)
  if(window.PointerEvent){
    handle.addEventListener('pointerdown', e=>{
      if(e.pointerType==='mouse') return; // handled above
      if(e.target.classList.contains('wh-btn')) return;
      ox=parseInt(el.style.left)||0; oy=parseInt(el.style.top)||0;
      sx=e.clientX; sy=e.clientY;
      try{ handle.setPointerCapture(e.pointerId); }catch(_){}
      const mv = e=>{ e.preventDefault(); dragTo(e.clientX, e.clientY); };
      const up = ()=>{ document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up); document.removeEventListener('pointercancel',up); };
      document.addEventListener('pointermove',mv,{passive:false});
      document.addEventListener('pointerup',up);
      document.addEventListener('pointercancel',up);
    },{passive:true});
  } else {
    handle.addEventListener('touchstart', e=>{
      if(e.target.classList.contains('wh-btn')) return;
      const t=e.touches[0];
      ox=parseInt(el.style.left)||0; oy=parseInt(el.style.top)||0;
      sx=t.clientX; sy=t.clientY;
      const mv=e=>dragTo(e.touches[0].clientX, e.touches[0].clientY);
      const up=()=>{ handle.removeEventListener('touchmove',mv); handle.removeEventListener('touchend',up); };
      handle.addEventListener('touchmove',mv,{passive:true});
      handle.addEventListener('touchend',up);
    },{passive:true});
  }
}

// RESIZE
// ════════════════════════════════════════════════
function makeResizable(el,handle){
  const minW=()=> parseInt(el.dataset.minw)||200;
  const minH=()=> parseInt(el.dataset.minh)||120;

  const resizeTo=(clientX,clientY,start)=>{
    const { dw, dh } = getDesktopBounds();
    const left = parseInt(el.style.left)||0;
    const top  = parseInt(el.style.top) ||0;
    const mw=minW(), mh=minH();
    // Max size: never extend beyond desktop right/bottom edge
    const maxW = Math.max(mw, dw - left - 4);
    const maxH = Math.max(mh, dh - top  - 4);
    const newW = Math.min(maxW, Math.max(mw, start.sw + clientX - start.sx));
    const newH = Math.min(maxH, Math.max(mh, start.sh + clientY - start.sy));
    el.classList.remove('fit-content');
    el.style.width  = newW + 'px';
    el.style.height = newH + 'px';
    if(el._maximized){
      el._maximized=false;
      const btn=el.querySelector('.wh-btn[title="Wiederherstellen"]');
      if(btn){ btn.title=T('ttMaximieren'); btn.textContent='⛶'; }
    }
    updateWidgetScale(el);
    el.querySelectorAll('canvas.draw-canvas').forEach(cv=>requestAnimationFrame(()=>resizeDrawCanvas(cv)));
  };

  // Unified pointer/touch/mouse handler
  const onDown=(e, cx, cy, isTouch)=>{
    e.preventDefault(); e.stopPropagation();
    el.style.zIndex=++zTop;
    clampWidget(el); // snap into bounds before resizing
    const start={sw:el.offsetWidth,sh:el.offsetHeight,sx:cx,sy:cy};

    if(!isTouch && window.PointerEvent){
      try{ handle.setPointerCapture(e.pointerId); }catch(_){}
      const mv=ev=>{ ev.preventDefault(); resizeTo(ev.clientX,ev.clientY,start); };
      const up=ev=>{ try{handle.releasePointerCapture(ev.pointerId);}catch(_){} document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up); document.removeEventListener('pointercancel',up); clampWidget(el); };
      document.addEventListener('pointermove',mv,{passive:false});
      document.addEventListener('pointerup',up);
      document.addEventListener('pointercancel',up);
    } else {
      const mv=ev=>{ if(ev.touches){ ev.preventDefault(); resizeTo(ev.touches[0].clientX,ev.touches[0].clientY,start); } else resizeTo(ev.clientX,ev.clientY,start); };
      const up=()=>{ document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up); document.removeEventListener('touchmove',mv); document.removeEventListener('touchend',up); document.removeEventListener('touchcancel',up); clampWidget(el); };
      document.addEventListener(isTouch?'touchmove':'mousemove',mv,{passive:false});
      document.addEventListener(isTouch?'touchend':'mouseup',up);
      if(isTouch) document.addEventListener('touchcancel',up);
    }
  };

  if(window.PointerEvent){
    handle.addEventListener('pointerdown',e=>{
      if(e.pointerType==='mouse' && e.button!==0) return;
      onDown(e, e.clientX, e.clientY, e.pointerType!=='mouse');
    },{passive:false});
  } else {
    handle.addEventListener('mousedown',e=>{ if(e.button!==0)return; onDown(e,e.clientX,e.clientY,false); });
    handle.addEventListener('touchstart',e=>{ const t=e.touches[0]; if(!t)return; onDown(e,t.clientX,t.clientY,true); },{passive:false});
  }
}

const clockOverrides = {}; // uid -> {h,m,s} or null for real time

function buildClock(body, uid){
  body.style.textAlign='center'; body.style.padding='12px 10px';
  body.style.display='flex'; body.style.flexDirection='column'; body.style.alignItems='center';
  body.innerHTML=`
<div id="aclock-wrap-${uid}" style="width:100%;flex:1;display:flex;align-items:center;justify-content:center;min-height:80px;">

</div>
<div id="wctime-txt-${uid}" style="font-size:1.8em;font-weight:400;text-align:center;margin-top:8px;color:var(--accent);min-height:1.3em;font-variant-numeric:tabular-nums;letter-spacing:.04em;"></div>
<div class="wclock-date" id="wcdate-${uid}" style="margin-top:3px;font-size:.82em;"></div>

  <button class="wbtn" style="font-size:.78em;padding:.3em .7em;" onclick="resetClockTime(${uid})" data-i18n="clockReset"></button>
</div>`;
  clockOverrides[uid] = null;

  function resizeClock(){
    const wrap = document.getElementById('aclock-wrap-'+uid);
    const cv   = document.getElementById('aclock-'+uid);
    if(!wrap || !cv) return;
    const sz = Math.max(80, Math.min(wrap.clientWidth, wrap.clientHeight) - 4);
    cv.width  = sz;
    cv.height = sz;
    drawAnalogClock(uid);
  }

  // Set initial size after layout
  setTimeout(resizeClock, 0);

  // Resize when widget is dragged/resized
  if(window.ResizeObserver){
    const ro = new ResizeObserver(resizeClock);
    const wrap = document.getElementById('aclock-wrap-'+uid);
    if(wrap) ro.observe(wrap);
  }
}

function drawAnalogClock(uid){
  const cv = document.getElementById('aclock-'+uid);
  if(!cv) return;
  const W=cv.width, H=cv.height;
  if(!W || !H) return;                // canvas not yet sized
  const ctx = cv.getContext('2d');
  const cx=W/2, cy=H/2, R=W/2-4;
  const isRandom = !!clockOverrides[uid];

  let now;
  if(isRandom){
    const o=clockOverrides[uid];
    now={h:o.h,m:o.m,s:0};
  } else {
    const d=new Date();
    now={h:d.getHours(),m:d.getMinutes(),s:d.getSeconds()};
  }

  ctx.clearRect(0,0,W,H);

  const isLight = document.body.classList.contains('light-mode');

  // Face
  const grad=ctx.createRadialGradient(cx,cy,R*0.1,cx,cy,R);
  if(isLight){
    grad.addColorStop(0,'#f4f6ff'); grad.addColorStop(1,'#e0e4f5');
  } else {
    const _cardCol=getComputedStyle(document.body).getPropertyValue('--card').trim();
  const _card2Col=getComputedStyle(document.body).getPropertyValue('--card2').trim();
  grad.addColorStop(0,_card2Col); grad.addColorStop(1,_cardCol);
  }
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.fillStyle=grad; ctx.fill();
  ctx.strokeStyle=isLight?_accentRgb(0.35):_accentRgb(0.5);
  ctx.lineWidth=Math.max(1.5,R*0.025); ctx.stroke();

  // Hour ticks
  for(let i=0;i<12;i++){
    const a=i*Math.PI/6;
    const big=(i%3===0);
    const r1=R*(big?0.80:0.86), r2=R*0.95;
    ctx.beginPath();
    ctx.moveTo(cx+Math.sin(a)*r1, cy-Math.cos(a)*r1);
    ctx.lineTo(cx+Math.sin(a)*r2, cy-Math.cos(a)*r2);
    ctx.strokeStyle=isLight?(big?'rgba(0,0,0,0.6)':'rgba(0,0,0,0.25)'):(big?'rgba(255,255,255,0.7)':'rgba(255,255,255,0.3)');
    ctx.lineWidth=big?Math.max(1.5,R*0.022):Math.max(1,R*0.012); ctx.stroke();
  }

  // Hour numbers – font scales with radius
  const fontSize = Math.max(9, Math.round(R*0.13));
  ctx.font=`bold ${fontSize}px Arial,sans-serif`;
  ctx.fillStyle=isLight?'rgba(30,40,80,0.8)':'rgba(255,255,255,0.7)';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(let i=1;i<=12;i++){
    const a=(i-3)*Math.PI/6;
    const nr=R*0.70;
    ctx.fillText(String(i), cx+Math.cos(a)*nr, cy+Math.sin(a)*nr);
  }

  // Hands
  const drawHand=(angle,len,width,color,shadow=false)=>{
    if(shadow){ctx.shadowColor=isLight?'rgba(0,0,0,0.2)':'rgba(0,0,0,0.5)';ctx.shadowBlur=4;}
    ctx.beginPath();
    ctx.moveTo(cx - Math.sin(angle)*len*0.18, cy + Math.cos(angle)*len*0.18);
    ctx.lineTo(cx + Math.sin(angle)*len, cy - Math.cos(angle)*len);
    ctx.strokeStyle=color; ctx.lineWidth=width; ctx.lineCap='round'; ctx.stroke();
    ctx.shadowBlur=0;
  };

  const hAngle=(now.h%12+now.m/60)*Math.PI/6;
  const mAngle=(now.m+now.s/60)*Math.PI/30;
  const sAngle=now.s*Math.PI/30;

  drawHand(hAngle, R*0.54, Math.max(3,R*0.055), getComputedStyle(document.body).getPropertyValue('--text').trim(), true);
  drawHand(mAngle, R*0.75, Math.max(2,R*0.035), _accentHex(), true);
  if(!isRandom) drawHand(sAngle, R*0.82, Math.max(1,R*0.018), '#f87171', true);

  // Center dot
  const dotR = Math.max(3, R*0.05);
  ctx.beginPath(); ctx.arc(cx,cy,dotR,0,Math.PI*2);
  ctx.fillStyle=_accentHex();
  ctx.shadowColor=isLight?_accentRgb(0.4):'rgba(0,0,0,0.4)';
  ctx.shadowBlur=4; ctx.fill();
  ctx.shadowBlur=0;

  // Update text label
  const txt=document.getElementById('wctime-txt-'+uid);
  if(txt){
    if(isRandom){
      txt.textContent=pad(now.h)+':'+pad(now.m);
      txt.style.color='var(--yellow)';
    } else {
      txt.textContent=pad(now.h)+':'+pad(now.m)+':'+pad(now.s);
      txt.style.color='var(--accent)';
    }
  }
  const dtEl=document.getElementById('wcdate-'+uid);
  if(dtEl && !isRandom){
    const d=new Date();
    if(currentLanguage==='ja'){
      dtEl.textContent=d.getFullYear()+'年'+MONTHS_JA[d.getMonth()]+d.getDate()+'日（'+DAYS_JA[d.getDay()]+'）';
    } else {
      dtEl.textContent=DAYS[d.getDay()]+', '+d.getDate()+'. '+MONTHS[d.getMonth()]+' '+d.getFullYear();
    }
  } else if(dtEl && isRandom){
    dtEl.textContent=T('clockRandomLabel');
  }
}

function randomClockTime(uid){
  const h=Math.floor(Math.random()*24);
  const m=Math.floor(Math.random()*12)*5; // 5-min steps: 0,5,10,...,55
  clockOverrides[uid]={h,m,s:0};
  drawAnalogClock(uid);

  playSound('Glocke'); // 🔔 Sound
}

function resetClockTime(uid){
  clockOverrides[uid]=null;
  drawAnalogClock(uid);
}

  document.querySelectorAll('[id^="aclock-"]').forEach(cv=>{
    const uid=cv.id.replace('aclock-','');
    if(!clockOverrides[uid]) drawAnalogClock(uid);
  });
},1000);

  document.getElementById('tbtn-ring-'+uid).classList.toggle('active-tmode', mode==='ring');
  document.getElementById('tbtn-digi-'+uid).classList.toggle('active-tmode', mode==='digital');
  document.getElementById('tbtn-lauf-'+uid).classList.toggle('active-tmode', mode==='laufer');
}

function timerColor(sec, total){
  // ratio 1.0 = full/start (green), 0.0 = empty/end (red)
  const ratio = total > 0 ? Math.max(0, Math.min(1, sec/total)) : 0;
  if(ratio > 0.5){
    // green → yellow  (ratio 1→0.5, t goes 1→0)
    const t = (1-ratio)*2;
    const r=Math.round(74 +t*(251-74)),  g=Math.round(222+t*(191-222)), b=Math.round(128+t*(36-128));
    return `rgb(${r},${g},${b})`;
  } else {
    // yellow → red   (ratio 0.5→0, t goes 1→0)
    const t = ratio*2;
    const r=Math.round(248+t*(251-248)), g=Math.round(113+t*(191-113)), b=Math.round(113+t*(36-113));
    return `rgb(${r},${g},${b})`;
  }
}

function allTimerDisplays(){return document.querySelectorAll('[id^="td-"]');}
function updateAllTimerDisplays(){
  const CIRC=427;
  document.querySelectorAll('[id^="td-"]').forEach(el=>{
    if(el.id.startsWith('td-digi-')) return;
    if(el.id.startsWith('td-svg-')) return;
    const uid=el.id.replace('td-','');
    el.textContent=fmtTime(timerSec);
    const total=timerTotalMap[uid]||300;
    const col=timerColor(timerSec,total);
    el.style.color=timerSec<=10?'#f87171':col;
    const arc=document.getElementById('sw-arc-'+uid);
    if(arc){arc.style.stroke=col;arc.style.strokeDashoffset=String(timerTotalMap[uid] ? CIRC*(1-timerSec/total) : 0);}
    const svgTxt=document.getElementById('td-svg-'+uid);
    if(svgTxt){svgTxt.textContent=fmtTime(timerSec);svgTxt.style.fill=timerSec<=10?'#f87171':col;}
    const digi=document.getElementById('td-digi-'+uid);
    if(digi){digi.textContent=fmtTime(timerSec);digi.style.color=el.style.color;}
    updateLaufer(uid, timerSec, total);
  });
}
function setTimer(min,sec,uid){
  clearInterval(timerInterval);timerRunning=false;
  timerSec=min*60+sec;
  timerTotalMap[uid]=timerSec;
  if(uid){const a=document.getElementById('tmin-'+uid),b=document.getElementById('tsec-'+uid);if(a)a.value=min;if(b)b.value=sec;}
  updateAllTimerDisplays();
}
function startTimer(uid){
  if(timerRunning){pauseTimer();return;}
  const wasPaused = (timerSec > 0 && timerTotalMap[uid] && timerSec < timerTotalMap[uid]);
  const lauferMode = !!document.querySelector('.timer-mode-btn.active-tmode[id^="tbtn-lauf-"]');
  // Läufer: bei jedem frischen Start (nicht Fortsetzen nach Pause) Reset
  if(lauferMode && !wasPaused) resetTimer(uid);
  if(uid && !wasPaused){
    const minEl=document.getElementById('tmin-'+uid),secEl=document.getElementById('tsec-'+uid);
    timerSec=(parseInt(minEl?.value)||0)*60+(parseInt(secEl?.value)||0);
    timerTotalMap[uid]=timerSec;
  }
  if(timerSec<=0)return;
  if(!wasPaused && lauferMode) playSound('Knall',0.85);
  timerRunning=true;
  // Start smooth runner animation – nur im Läufer-Modus
  if(lauferMode){
    document.querySelectorAll('[id^="td-"]').forEach(el=>{
      if(!el.id.startsWith('td-') || el.id.startsWith('td-digi-') || el.id.startsWith('td-svg-')) return;
      const u=el.id.replace('td-','');
      if(document.getElementById('lauf-runner-'+u)) lauferStartRaf(u);
    });
  }
  timerInterval=setInterval(()=>{
    timerSec--;if(timerSec<=0){timerSec=0;clearInterval(timerInterval);timerRunning=false;playTimerEnd();}
    updateAllTimerDisplays();
  },1000);
}
function pauseTimer(){clearInterval(timerInterval);timerRunning=false;}
function resetTimer(uid){
  clearInterval(timerInterval);timerRunning=false;
  timerSec=(parseInt(document.getElementById('tmin-'+uid)?.value)||5)*60+(parseInt(document.getElementById('tsec-'+uid)?.value)||0);
  timerTotalMap[uid]=timerSec;
  if(lauferRaf[uid]){cancelAnimationFrame(lauferRaf[uid]);lauferRaf[uid]=null;}
  lauferPos[uid]=0;
  lauferPhase[uid]=0;
  lauferLastTick[uid]=0;
  lauferDt[uid]=0.016;
  if(typeof lauferDogPlayed!=='undefined') lauferDogPlayed[uid]=false;
  if(typeof lauferDogActive!=='undefined') lauferDogActive[uid]=false;
  if(typeof lauferDogX!=='undefined') lauferDogX[uid]=0;
  if(typeof lauferDoorAngle!=='undefined') lauferDoorAngle[uid]=0;
  if(typeof lauferDoorClosing!=='undefined') lauferDoorClosing[uid]=false;
  const dog=document.getElementById('lauf-dog-'+uid);
  if(dog){ dog.setAttribute('visibility','hidden'); dog.setAttribute('transform','translate(0,0)'); }
  const bird=document.getElementById('lauf-bird-'+uid);
  if(bird){ bird.setAttribute('visibility','hidden'); bird.setAttribute('transform','translate(0,0)'); }
  const nest=document.getElementById('lauf-nest-'+uid);
  if(nest){ nest.setAttribute('visibility','hidden'); }
  const cat=document.getElementById('lauf-cat-'+uid);
  if(cat){ cat.setAttribute('visibility','hidden'); }
  const cat2=document.getElementById('lauf-cat2-'+uid);
  if(cat2){ cat2.setAttribute('visibility','hidden'); }
  if(typeof lauferCat2Shown!=='undefined') lauferCat2Shown[uid]=false;
  lauferVariant[uid]=0; // reset → new variant chosen at next half-time
  // Neue Variante sofort wählen (verhindert wiederholtes gleiche Tier)
  const _prevVariant = lauferVariant[uid] || 0;
  let _newVariant;
  do { _newVariant = Math.floor(Math.random()*3)+1; } while(_newVariant === _prevVariant);
  lauferVariant[uid] = _newVariant;
  lauferBirdY[uid]=0;
  if(lauferCatTimer[uid]){ clearTimeout(lauferCatTimer[uid]); lauferCatTimer[uid]=null; }
  const mouse=document.getElementById('lauf-mouse-'+uid);
  if(mouse){ mouse.setAttribute('visibility','hidden'); mouse.setAttribute('transform','translate(0,0)'); }
  if(typeof lauferMouseX!=='undefined') lauferMouseX[uid]=0;
  if(typeof lauferMouseActive!=='undefined') lauferMouseActive[uid]=false;
  const door=document.getElementById('lauf-door-'+uid);
  if(door){ door.setAttribute('transform',''); }
  const doorInner=document.getElementById('lauf-door-inner-'+uid);
  if(doorInner){ doorInner.setAttribute('opacity','0'); }
  const doorFrame=document.getElementById('lauf-door-frame-'+uid);
  if(doorFrame){ doorFrame.setAttribute('opacity','0'); }
  updateAllTimerDisplays();
}

// ── LÄUFER: flüssige Animation via requestAnimationFrame ──
const lauferRaf={};   // uid → raf id
const lauferPos={};   // uid → current x offset (0‥750)
const lauferPhase={}; // uid → animation time accumulator
const lauferLastTick={}; // uid → performance.now() of last 1s timer tick
const lauferDt={};    // uid → last frame delta time in seconds
const lauferVariant={}; // uid → 1=Hund, 2=Vogel, 3=Katze (chosen at half-time)
const lauferBirdY={};   // uid → bird flight Y offset (animation)
const lauferBirdDir={}; // uid → +1=rechts, -1=links (Flugrichtung)
const lauferCatTimer={}; // uid → cat disappear timeout id
const lauferCloudOff={}; // uid → {c1,c2,c3,c4} cloud x offsets in px

function updateLaufer(uid, sec, total){
  const timeTxt=document.getElementById('lauf-time-'+uid);
  if(timeTxt) timeTxt.textContent=fmtTime(sec);
  // Position wird vom RAF-Loop kontinuierlich interpoliert.
  // Hier nur die Ziel-Position aktualisieren (1× pro Sekunde).
  const target = total>0 ? (1-sec/total)*750 : 0;
  lauferPos[uid] = target;
  // Zeitstempel des letzten Sekunden-Ticks merken (für Sub-Sekunden-Interpolation)
  lauferLastTick[uid] = performance.now();
  if(!timerRunning) lauferDrawFrame(uid); // static update when paused/reset
}

function lauferStartRaf(uid){
  if(lauferRaf[uid]) cancelAnimationFrame(lauferRaf[uid]);
  if(!lauferPhase[uid]) lauferPhase[uid]=0;
  lauferLastTick[uid] = performance.now();
  let last=performance.now();
  function frame(now){
    if(!timerRunning){lauferRaf[uid]=null;return;}
    const dt=now-last; last=now;
    lauferPhase[uid]=(lauferPhase[uid]||0)+dt;
    lauferDt[uid] = dt / 1000; // in Sekunden für Physik-Berechnungen

    // ── Wolken-Drift: langsame Bewegung, Wrap-Around ──
    if(!lauferCloudOff[uid]) lauferCloudOff[uid]={c1:0,c2:0,c3:0,c4:0};
    const co = lauferCloudOff[uid];
    const dtS = dt/1000;
    co.c1 = ((co.c1 - dtS * 7)  % 900) ; // nach links, ~7px/s
    co.c2 = ((co.c2 + dtS * 4)  % 900) ; // nach rechts, ~4px/s
    co.c3 = ((co.c3 - dtS * 11) % 900) ; // nach links schneller
    co.c4 = ((co.c4 + dtS * 6)  % 900) ; // nach rechts
    const c1el = document.getElementById('lauf-cloud1-'+uid);
    const c2el = document.getElementById('lauf-cloud2-'+uid);
    const c3el = document.getElementById('lauf-cloud3-'+uid);
    const c4el = document.getElementById('lauf-cloud4-'+uid);
    if(c1el) c1el.setAttribute('transform', `translate(${co.c1.toFixed(1)},0)`);
    if(c2el) c2el.setAttribute('transform', `translate(${co.c2.toFixed(1)},0)`);
    if(c3el) c3el.setAttribute('transform', `translate(${co.c3.toFixed(1)},0)`);
    if(c4el) c4el.setAttribute('transform', `translate(${co.c4.toFixed(1)},0)`);

    // ── Echtzeit-X-Position: Sub-Sekunden-Interpolation ──
    // Zwischen dem letzten Sekunden-Tick und dem nächsten fließend interpolieren.
    const total = timerTotalMap[uid]||300;
    if(total > 0){
      // Wie viel ms ist seit dem letzten Sekunden-Tick vergangen?
      const msSinceTick = now - (lauferLastTick[uid]||now);
      // Geschwindigkeit: 750px / total Sekunden
      const pxPerMs = 750 / (total * 1000);
      // Aktuelle Position = gespeicherter Tick-Wert + kontinuierlicher Fortschritt
      lauferPos[uid] = Math.min(750, (lauferPos[uid]||0) + pxPerMs * dt);
    }

    lauferDrawFrame(uid);
    lauferRaf[uid]=requestAnimationFrame(frame);
  }
  lauferRaf[uid]=requestAnimationFrame(frame);
}

const lauferDogPlayed={};   // uid → true when bark was played this run
const lauferDogActive={};   // uid → true once dog has been revealed
const lauferDogX={};        // uid → current dog x offset (follows runner after halfpoint)
const lauferDoorAngle={};   // uid → current door open angle 0..1
const lauferDoorClosing={}; // uid → true once door starts closing again
const lauferMouseX={};      // uid → current mouse x offset (Katze-Variante)
const lauferMouseActive={}; // uid → true once mouse has appeared
const lauferCat2Shown={};   // uid → true once black cat has appeared

function lauferDrawFrame(uid){
  const runner=document.getElementById('lauf-runner-'+uid);
  if(!runner) return;
  const total=timerTotalMap[uid]||300;
  const tx=lauferPos[uid]||0;
  const ratio = total>0 ? (1 - (lauferPos[uid]||0)/750) : 1; // 1=start, 0=end
  const elapsed = total * (1-ratio); // seconds elapsed (approx via position)

  // ── Halbzeit-Schwelle: tx ≥ 375 (Mitte der 750px-Strecke) ──
  const halfPassed = (tx >= 375);

  // Tür-Animation: öffnet sich wenn Läufer die Halbzeit erreicht
  const doorEl = document.getElementById('lauf-door-'+uid);
  if(doorEl){
    const variant_for_door = lauferVariant[uid] || 0;
    const doorShouldOpen = halfPassed && variant_for_door !== 2;

    if(!doorShouldOpen){
      // Kein Öffnen (Vogel oder vor Halbzeit): sofort geschlossen
      lauferDoorAngle[uid] = 0;
      lauferDoorClosing[uid] = false;
    } else {
      const dtS2 = lauferDt[uid] || 0.016;
      const prev = lauferDoorAngle[uid] || 0;

      // Tür schließt sich wieder, sobald Hund/Maus >35px vom Türrahmen entfernt sind
      const animalOffset = (variant_for_door === 1)
        ? (lauferDogX[uid] || 0)     // Hund-Offset
        : (lauferMouseX[uid] || 0);  // Maus-Offset
      if(animalOffset > 35 && prev >= 0.99){
        lauferDoorClosing[uid] = true; // Tier hat Tür verlassen → Tür schließt
      }

      if(lauferDoorClosing[uid]){
        lauferDoorAngle[uid] = Math.max(0, prev - dtS2 * 0.6); // etwas langsamer schließen
      } else {
        lauferDoorAngle[uid] = Math.min(1, prev + dtS2 * 0.8);
      }
    }
    const ang = lauferDoorAngle[uid] || 0;
    const scaleX = 1 - ang * 0.85;
    doorEl.setAttribute('transform', `translate(378,96) scale(${scaleX.toFixed(3)},1) translate(-378,-96)`);
    const inner = document.getElementById('lauf-door-inner-'+uid);
    const frame = document.getElementById('lauf-door-frame-'+uid);
    if(inner) inner.setAttribute('opacity', (ang * 0.9).toFixed(2));
    if(frame) frame.setAttribute('opacity', (ang * 0.7).toFixed(2));
  }

  // ── Variante: wird beim Reset zufällig gewählt, hier nur Fallback ──
  if(!lauferVariant[uid]){
    lauferVariant[uid] = Math.floor(Math.random()*3)+1; // 1=Hund, 2=Vogel, 3=Katze
  }
  const variant = lauferVariant[uid] || 1;

  const dog  = document.getElementById('lauf-dog-'+uid);
  const bird = document.getElementById('lauf-bird-'+uid);
  const cat  = document.getElementById('lauf-cat-'+uid);

  // Tür-Öffnungsgrad: Hund/Maus erscheinen erst wenn Tür halb offen (ang >= 0.5)
  const doorAng = lauferDoorAngle[uid] || 0;
  const doorOpen = doorAng >= 0.5;
  // Tier bleibt sichtbar sobald es einmal aktiviert wurde (auch wenn Tür sich wieder schließt)
  // Für Hund: lauferDogActive; für Maus: lauferMouseActive
  const dogExited   = !!(lauferDogActive[uid])  && variant===1;
  const mouseExited = !!(lauferMouseActive[uid]) && variant===3;

  // Nur das aktive Tier zeigen — erscheinen bei Türöffnung, bleiben dann dauerhaft sichtbar
  if(dog)  dog.setAttribute('visibility',  (halfPassed && variant===1 && (doorOpen || dogExited))   ? 'visible' : 'hidden');
  // Vogel: vor Halbzeit auf Dach sitzend sichtbar, nach Halbzeit fliegend
  if(bird) bird.setAttribute('visibility', (variant===2) ? 'visible' : 'hidden');
  if(cat)  cat.setAttribute('visibility',  (halfPassed && variant===3) ? 'visible' : 'hidden');
  const mouseEl = document.getElementById('lauf-mouse-'+uid);
  if(mouseEl) mouseEl.setAttribute('visibility', (halfPassed && variant===3 && (doorOpen || mouseExited)) ? 'visible' : 'hidden');

  // Schwarze Katze (cat2) — Variante 3, erscheint 1s nach der braunen Katze
  const cat2 = document.getElementById('lauf-cat2-'+uid);
  if(cat2){
    if(halfPassed && variant===3){
      if(!lauferCat2Shown[uid]){
        // Sichtbarkeit per setTimeout nach 1000ms setzen
        lauferCat2Shown[uid] = true;
        setTimeout(()=>{
          const c2=document.getElementById('lauf-cat2-'+uid);
          if(c2) c2.setAttribute('visibility','visible');
        }, 1000);
      }
    } else {
      cat2.setAttribute('visibility','hidden');
      lauferCat2Shown[uid] = false;
    }
  }

  // ── Variante 1: Hund kommt aus der Tür ──
  if(halfPassed && variant===1 && dog){
    if(doorOpen && !lauferDogActive[uid]){
      lauferDogActive[uid] = true;
      if(!lauferDogPlayed[uid]){
        lauferDogPlayed[uid] = true;
        setTimeout(()=>{ playFadeinDouble('Hundebellen', 0.85); }, 300);
      }
      // Hund startet an der Türposition (x=378, relativ zu dogBaseX=362 → offset=16)
      lauferDogX[uid] = 16;
    }
    const runnerAbsX = 20 + tx;
    const dogBaseX   = 362;
    const targetDogOffset = Math.max(16, runnerAbsX - dogBaseX - 25);
    const prevDogX = lauferDogX[uid] || 16;
    const dtS = lauferDt[uid] || 0.016;
    const lerpF = timerRunning ? (1 - Math.exp(-5 * dtS)) : 1;
    lauferDogX[uid] = prevDogX + (targetDogOffset - prevDogX) * lerpF;
    dog.setAttribute('transform', `translate(${lauferDogX[uid].toFixed(1)},0)`);
  } else if(!halfPassed){
    lauferDogActive[uid] = false;
    lauferDogX[uid] = 0;
  }

  // ── Variante 2: Vogel sitzt bis Halbzeit im Nest, fliegt danach ──
  const nestEl = document.getElementById('lauf-nest-'+uid);
  if(variant===2 && bird){
    if(!halfPassed){
      // Nest anzeigen, Vogel sitzt darin (leicht nach unten versetzt ins Nest)
      if(nestEl) nestEl.setAttribute('visibility','visible');
      bird.setAttribute('visibility','visible');
      bird.setAttribute('transform', 'translate(0,7)'); // Vogel sitzt tief im Nest
      // Flügel in Ruheposition, leicht angelegt
      const wingEl  = document.getElementById('lauf-bird-wing-'+uid);
      const wingEl2 = document.getElementById('lauf-bird-wing2-'+uid);
      if(wingEl)  wingEl.setAttribute('d',  'M390,50 Q388,45 396,48');
      if(wingEl2) wingEl2.setAttribute('d', 'M390,53 Q388,58 396,55');
      // Kleines Nicken im Nest
      const nestBob = timerRunning ? Math.sin((lauferPhase[uid]||0)/1000 * Math.PI * 0.8) * 1.2 : 0;
      bird.setAttribute('transform', `translate(0,${(7+nestBob).toFixed(2)})`);
    } else {
      // Nest ausblenden wenn Vogel fliegt
      if(nestEl) nestEl.setAttribute('visibility','hidden');
    if(!lauferDogActive[uid]){
      lauferDogActive[uid] = true;
      if(!lauferDogPlayed[uid]){
        lauferDogPlayed[uid] = true;
        setTimeout(()=>{ playFadeinDouble('Vogel', 0.85); }, 300);
      }
    }
    const t2=(lauferPhase[uid]||0)/1000;
    const runnerAbsX = 20 + tx;
    // X: Vogel kreist sanft links/rechts um den Läufer
    const orbitRaw = Math.sin(t2 * Math.PI * 0.9); // -1..+1
    const birdOrbitX = orbitRaw * 40;
    // Flugrichtung anhand der Ableitung des Sinus bestimmen
    // d/dt sin(t·π·0.9) = cos(t·π·0.9)·π·0.9 — positiv = nach rechts
    const orbitVel = Math.cos(t2 * Math.PI * 0.9);
    // Gesamtbewegung = Orbit + Runner-Follow; Vorzeichen der Gesamtgeschwindigkeit
    const followVel = 0.55; // runner-follow ist immer nach rechts (positiv)
    const totalVelSign = orbitVel * 0.9 + followVel; // grob die Richtung
    lauferBirdDir[uid] = totalVelSign >= 0 ? 1 : -1;
    const dir = lauferBirdDir[uid];

    // Y: Wellenbewegung
    const birdWaveOffset = 15 + Math.sin(t2 * Math.PI * 1.8) * 10;
    lauferBirdY[uid] = birdWaveOffset;
    const birdFollowX = (runnerAbsX - 395) * 0.55 + birdOrbitX;

    // Flügel flattern — oben/unten schlagen
    const wingFlap = Math.sin(t2 * Math.PI * 9) * 6;
    const wingEl  = document.getElementById('lauf-bird-wing-'+uid);
    const wingEl2 = document.getElementById('lauf-bird-wing2-'+uid);
    // Flügel oben: schlägt nach oben (y sinkt) und unten
    if(wingEl)  wingEl.setAttribute('d',  `M390,50 Q388,${43-wingFlap} 396,${47-wingFlap*0.4}`);
    // Flügel unten: gegenläufig
    if(wingEl2) wingEl2.setAttribute('d', `M390,53 Q388,${60+wingFlap} 396,${56+wingFlap*0.4}`);

    // Vogel spiegeln wenn er nach links fliegt:
    // Spiegelachse = lokaler Mittelpunkt des Vogels (cx=395, cy=52 in SVG-Koordinaten)
    // translate(birdFollowX, birdWaveOffset) dann ggf. scale(-1,1) um lokalen Mittelpunkt
    if(dir < 0){
      bird.setAttribute('transform',
        `translate(${(birdFollowX + 790).toFixed(1)},${birdWaveOffset.toFixed(1)}) scale(-1,1)`);
    } else {
      bird.setAttribute('transform',
        `translate(${birdFollowX.toFixed(1)},${birdWaveOffset.toFixed(1)})`);
    }
    } // end else (halfPassed)
  } // end variant===2

  // ── Variante 3: Katze schaut aus Fenster + Maus läuft heraus und überholt den Läufer ──
  const mouse = mouseEl; // already fetched above
  if(halfPassed && variant===3){
    if(cat) cat.setAttribute('visibility','visible');
    // ── Katzen-Wackeln im Fenster ──
    const tCat = (lauferPhase[uid]||0)/1000;
    // Braune Katze: leichtes Kopfwiegen links/rechts
    if(cat){
      const catSway = Math.sin(tCat * Math.PI * 1.1) * 1.4; // langsam, ±1.4px
      const catNod  = Math.abs(Math.sin(tCat * Math.PI * 0.7)) * 0.8; // leichtes Nicken
      cat.setAttribute('transform', `translate(${catSway.toFixed(2)},${catNod.toFixed(2)})`);
    }
    // Schwarze Katze: etwas anderen Rhythmus
    const cat2El = document.getElementById('lauf-cat2-'+uid);
    if(cat2El && cat2El.getAttribute('visibility')==='visible'){
      const cat2Sway = Math.sin(tCat * Math.PI * 0.9 + 1.2) * 1.2;
      const cat2Nod  = Math.abs(Math.sin(tCat * Math.PI * 0.6 + 0.5)) * 0.9;
      cat2El.setAttribute('transform', `translate(${cat2Sway.toFixed(2)},${cat2Nod.toFixed(2)})`);
    }
    if(doorOpen && !lauferDogActive[uid]){
      lauferDogActive[uid] = true;
      if(!lauferDogPlayed[uid]){
        lauferDogPlayed[uid] = true;
        setTimeout(()=>{ playFadeinDouble('Miau', 0.85); }, 300);
      }
    }
    // Maus erscheint erst wenn Tür halb offen, läuft dann dauerhaft (auch wenn Tür wieder zu)
    if(mouse && (doorOpen || lauferMouseActive[uid])){
      if(!lauferMouseActive[uid]){
        lauferMouseActive[uid] = true;
        lauferMouseX[uid] = 0; // startet an Türposition
      }
      const runnerAbsX = 20 + tx;
      const mouseBaseX = 385;
      const mouseTargetX = Math.max(0, runnerAbsX - mouseBaseX + 35);
      const prevMX = lauferMouseX[uid] || 0;
      const dtSm = lauferDt[uid] || 0.016;
      const mouseLerpF = timerRunning ? (1 - Math.exp(-7 * dtSm)) : 1;
      lauferMouseX[uid] = prevMX + (mouseTargetX - prevMX) * mouseLerpF;
      const mx = lauferMouseX[uid];
      // Maus-Bein-Animation
      const tM = (lauferPhase[uid]||0)/1000;
      const mousePhase = Math.sin(tM * Math.PI * 8); // schnelle Beinbewegung
      const mLeg = timerRunning ? mousePhase * 2.5 : 0;
      const ml1 = document.getElementById('lauf-mouse-leg1-'+uid);
      const ml2 = document.getElementById('lauf-mouse-leg2-'+uid);
      const ml3 = document.getElementById('lauf-mouse-leg3-'+uid);
      if(ml1) ml1.setAttribute('x2', (381 + mLeg).toFixed(1));
      if(ml2) ml2.setAttribute('x2', (384 - mLeg).toFixed(1));
      if(ml3) ml3.setAttribute('x2', (387 + mLeg).toFixed(1));
      // Schwanz-Wackeln
      const tailM = document.getElementById('lauf-mouse-tail-'+uid);
      if(tailM){
        const tw = timerRunning ? Math.sin(tM * Math.PI * 6) * 3 : 0;
        tailM.setAttribute('d',`M380,126 Q${376+tw},${122+tw*0.5} ${379+tw*0.3},119`);
      }
      // Kleines Hüpfen
      const mouseBob = timerRunning ? Math.sin(tM * Math.PI * 8) * 1.5 : 0;
      mouse.setAttribute('transform', `translate(${mx.toFixed(1)},${mouseBob.toFixed(2)})`);
    }
  } else if(!halfPassed){
    if(lauferCatTimer[uid]){ clearTimeout(lauferCatTimer[uid]); lauferCatTimer[uid]=null; }
    if(mouse){ mouse.setAttribute('visibility','hidden'); mouse.setAttribute('transform','translate(0,0)'); }
    lauferMouseX[uid] = 0;
    lauferMouseActive[uid] = false;
  }

  // Bounce: smooth vertical sine based on accumulated time
  const t=(lauferPhase[uid]||0)/1000; // seconds
  // Lauf-Bounce: nur beim echten Laufen, sanft absorbiert
  const ty=timerRunning ? Math.abs(Math.sin(t*Math.PI*4))*-2.5 : 0;
  runner.setAttribute('transform',`translate(${tx.toFixed(1)},${ty.toFixed(2)})`);

  // ── Detaillierte Gelenk-Animation: Knie + Ellbogen (ohne sichtbare Punkte) ──
  // Laufzyklus: phase läuft von -1 bis +1 (links vs. rechts voraus)
  const phase = Math.sin(t * Math.PI * 4);
  const s = timerRunning ? phase : 0;

  // === BEINE: anatomisch korrekte Laufbewegung ===
  // Beim Laufen: ein Bein schwingt nach vorn (Knie hoch, Unterschenkel nach vorn),
  // das andere schiebt nach hinten (Knie gestreckt, Unterschenkel schwingt zurück).
  const thigh1=document.getElementById('lauf-thigh1-'+uid);
  const shin1 =document.getElementById('lauf-shin1-'+uid);
  const thigh2=document.getElementById('lauf-thigh2-'+uid);
  const shin2 =document.getElementById('lauf-shin2-'+uid);

  if(thigh1 && shin1){
    // Linkes Bein: schwingt vorwärts wenn phase > 0
    const thighAngle1 = s * 30; // Grad der Oberschenkelneigung
    const kneeFlexion1 = timerRunning ? Math.max(0, s) * 18 : 0; // Kniebeugewinkel
    // Knieposition: Hüfte + Oberschenkel-Vektor
    const kx1 = 20 + Math.sin((thighAngle1) * Math.PI/180) * 7;
    const ky1 = 124 + Math.cos((thighAngle1) * Math.PI/180) * 7;
    // Fußposition: Knie + Unterschenkel-Vektor (Knie beugt nach hinten beim Schwung)
    const shankAngle1 = thighAngle1 - kneeFlexion1;
    const fx1 = kx1 + Math.sin(shankAngle1 * Math.PI/180) * 7;
    const fy1 = ky1 + Math.cos(shankAngle1 * Math.PI/180) * 7;
    thigh1.setAttribute('d',`M20,124 L${kx1.toFixed(1)},${ky1.toFixed(1)}`);
    shin1.setAttribute('d',`M${kx1.toFixed(1)},${ky1.toFixed(1)} L${fx1.toFixed(1)},${fy1.toFixed(1)}`);
  }
  if(thigh2 && shin2){
    // Rechtes Bein: gegenläufig
    const thighAngle2 = -s * 30;
    const kneeFlexion2 = timerRunning ? Math.max(0, -s) * 18 : 0;
    const kx2 = 20 + Math.sin((thighAngle2) * Math.PI/180) * 7;
    const ky2 = 124 + Math.cos((thighAngle2) * Math.PI/180) * 7;
    const shankAngle2 = thighAngle2 - kneeFlexion2;
    const fx2 = kx2 + Math.sin(shankAngle2 * Math.PI/180) * 7;
    const fy2 = ky2 + Math.cos(shankAngle2 * Math.PI/180) * 7;
    thigh2.setAttribute('d',`M20,124 L${kx2.toFixed(1)},${ky2.toFixed(1)}`);
    shin2.setAttribute('d',`M${kx2.toFixed(1)},${ky2.toFixed(1)} L${fx2.toFixed(1)},${fy2.toFixed(1)}`);
  }

  // === ARME: gegenseitig zum Bein, Ellbogen gebeugt ===
  const uarm1=document.getElementById('lauf-uarm1-'+uid);
  const larm1=document.getElementById('lauf-larm1-'+uid);
  const uarm2=document.getElementById('lauf-uarm2-'+uid);
  const larm2=document.getElementById('lauf-larm2-'+uid);

  if(uarm1 && larm1){
    // Linker Arm: gegenläufig zum linken Bein (= mit rechtem Bein)
    const armAngle1 = -s * 22; // Schulter-Schwingwinkel
    const elbowFlex1 = 30 + Math.abs(s) * 15; // Ellbogen immer etwas gebeugt
    const ex1 = 20 + Math.sin(armAngle1 * Math.PI/180) * 5.5;
    const ey1 = 115 + Math.cos(armAngle1 * Math.PI/180) * 5.5;
    const foreAngle1 = armAngle1 + elbowFlex1;
    const hx1 = ex1 + Math.sin(foreAngle1 * Math.PI/180) * 5;
    const hy1 = ey1 + Math.cos(foreAngle1 * Math.PI/180) * 5;
    uarm1.setAttribute('d',`M20,115 L${ex1.toFixed(1)},${ey1.toFixed(1)}`);
    larm1.setAttribute('d',`M${ex1.toFixed(1)},${ey1.toFixed(1)} L${hx1.toFixed(1)},${hy1.toFixed(1)}`);
  }
  if(uarm2 && larm2){
    // Rechter Arm: gegenläufig
    const armAngle2 = s * 22;
    const elbowFlex2 = 30 + Math.abs(s) * 15;
    const ex2 = 20 + Math.sin(armAngle2 * Math.PI/180) * 5.5;
    const ey2 = 115 + Math.cos(armAngle2 * Math.PI/180) * 5.5;
    const foreAngle2 = armAngle2 + elbowFlex2;
    const hx2 = ex2 + Math.sin(foreAngle2 * Math.PI/180) * 5;
    const hy2 = ey2 + Math.cos(foreAngle2 * Math.PI/180) * 5;
    uarm2.setAttribute('d',`M20,115 L${ex2.toFixed(1)},${ey2.toFixed(1)}`);
    larm2.setAttribute('d',`M${ex2.toFixed(1)},${ey2.toFixed(1)} L${hx2.toFixed(1)},${hy2.toFixed(1)}`);
  }

  // ── Hund-Bein/Schwanz-Animation (nur Variante 1) ──
  if(dog && halfPassed && variant===1){
    const running = timerRunning;
    const dogT = t * (running ? 1 : 0);
    const dogExcited = true; // Hund ist immer aufgeregt wenn er folgt
    const dogFreq = 10;
    const dogPhase = Math.sin(dogT * Math.PI * dogFreq);
    const dogBob   = running ? Math.sin(dogT * Math.PI * dogFreq) * 2 : 0;

    // Vertikaler Bounce des Hundes (zusätzlich zur translate-Y durch dog.transform)
    // Kombiniere mit x-offset: transform enthält bereits x-translate
    const curDogX = lauferDogX[uid] || 0;
    dog.setAttribute('transform', `translate(${curDogX.toFixed(1)},${dogBob.toFixed(2)})`);

    const dLeg = dogPhase * 3.5;
    const dLegY = Math.abs(dogPhase) * 2; // auch Y für Galoppeffekt
    const dl1 = document.getElementById('lauf-dog-leg1-'+uid);
    const dl2 = document.getElementById('lauf-dog-leg2-'+uid);
    const dl3 = document.getElementById('lauf-dog-leg3-'+uid);
    const dl4 = document.getElementById('lauf-dog-leg4-'+uid);
    if(dl1){ dl1.setAttribute('x2', (354 + dLeg).toFixed(1)); dl1.setAttribute('y2', (132 - dLegY).toFixed(1)); }
    if(dl2){ dl2.setAttribute('x2', (358 - dLeg).toFixed(1)); dl2.setAttribute('y2', (132 - dLegY*0.5).toFixed(1)); }
    if(dl3){ dl3.setAttribute('x2', (363 + dLeg).toFixed(1)); dl3.setAttribute('y2', (132 - dLegY*0.5).toFixed(1)); }
    if(dl4){ dl4.setAttribute('x2', (367 - dLeg).toFixed(1)); dl4.setAttribute('y2', (132 - dLegY).toFixed(1)); }

    const tailWag = running ? Math.sin(dogT * Math.PI * 14) * 12 : 0;
    const tailEl = document.getElementById('lauf-dog-tail-'+uid);
    if(tailEl){
      tailEl.setAttribute('d', `M353,120 Q347,${(112+tailWag*0.5).toFixed(1)} 350,${(108+tailWag).toFixed(1)}`);
    }
    const earEl = document.getElementById('lauf-dog-ear-'+uid);
    if(earEl){
      const earRot = -15 + dogPhase * 8;
      earEl.setAttribute('transform', `rotate(${earRot.toFixed(1)},369,113)`);
    }
  }

  // ── Sonne: parabolischer Bogen von links nach rechts ──
  const sunEl  = document.getElementById('lauf-sun-'+uid);
  const skyEl  = document.getElementById('lauf-sky-'+uid);
  if(sunEl){
    // p = 0 (Start) … 1 (Ziel), basierend auf Läufer-Position
    const p = Math.min(1, Math.max(0, tx / 750));

    // Parabolischer Bogen: x von 55 (hinter linkem Hügel) bis 735 (hinter rechtem Hügel)
    // y: Parabel mit Scheitelpunkt bei p=0.5 → y_min=10 (oben), y_start=y_end=148 (hinter Hügeln)
    const sunX = 55 + p * (735 - 55);
    const sunY = 148 - 4 * 138 * p * (1 - p);  // Parabel: y=148 bei p=0 und p=1, y=10 bei p=0.5

    sunEl.setAttribute('transform', `translate(${sunX.toFixed(1)},${sunY.toFixed(1)})`);

    // Sonne verstecken wenn hinter Hügeln (am Anfang und Ende)
    // Linker Hügel verdeckt bis ca. x=80, rechter ab ca. x=710
    const sunVisible = p > 0.04 && p < 0.96;
    sunEl.setAttribute('opacity', sunVisible ? '1' : '0');

    // Sonnenfarbe: orange bei Aufgang/Untergang, gelb in der Mitte
    const sunBody = document.getElementById('lauf-sunbody-'+uid) || sunEl.querySelector('circle:last-child');
    if(sunBody){
      // Farbübergang: p=0..0.15 orange→gelb, p=0.85..1 gelb→orange
      const midFactor = Math.min(1, Math.min(p, 1-p) / 0.15);
      const r = Math.round(255);
      const g = Math.round(165 + midFactor * (215 - 165));  // 165→215
      const b = Math.round(0   + midFactor * (0));
      sunBody.setAttribute('fill', `rgb(${r},${g},${b})`);
    }

    // Himmelfarbe: Morgenrot → Tagesblau → Abendrot
    if(skyEl){
      let skyColor;
      if(p < 0.12){
        // Morgendämmerung: orangerot → hellblau
        const f = p / 0.12;
        const sr=Math.round(249 + f*(135-249)), sg=Math.round(194+f*(206-194)), sb=Math.round(122+f*(235-122));
        skyColor = `rgb(${sr},${sg},${sb})`;
      } else if(p < 0.85){
        // Tagesblau
        skyColor = '#87CEEB';
      } else {
        // Abenddämmerung: hellblau → orangerot
        const f = (p - 0.85) / 0.15;
        const er=Math.round(135+f*(249-135)), eg=Math.round(206+f*(140-206)), eb=Math.round(235+f*(80-235));
        skyColor = `rgb(${er},${eg},${eb})`;
      }
      skyEl.setAttribute('fill', skyColor);
    }
  }
}

// Zufall-aus (bag shuffle) state
const diceZufallOff = {}; // uid -> true if "Zufall aus" mode active
const diceBag = {};       // uid -> {sides: [...remaining values]}
// Euro-Modus: Geldstück-Zähler und aktuelle Münzliste
const euroCount = {};     // uid -> current count of items shown (1..8)
const euroItems = {};     // uid -> [{type:'note'|'coin', val:number}, ...]

function toggleDiceZufall(uid){
  try{const ac=new (window.AudioContext||window.webkitAudioContext)();playPop(ac,0.8);}catch(e){}
  diceZufallOff[uid] = !diceZufallOff[uid];
  // Reset bag when toggling
  if(diceBag[uid]) diceBag[uid]={};
  const btn=document.getElementById('dtbtn-zufall-'+uid);
  if(btn){
    if(diceZufallOff[uid]){
      btn.textContent=T('diceZufallAus');
      btn.style.background=_accentRgb(0.25);
      btn.style.borderColor='var(--accent)';
      btn.style.color='var(--accent)';
    } else {
      btn.textContent=T('diceZufallAn');
      btn.style.background='';
      btn.style.borderColor='';
      btn.style.color='';
    }
  }
}

function selectDiceType(sides, uid){
  try{const ac=new (window.AudioContext||window.webkitAudioContext)();playPop(ac,0.8);}catch(e){}
  document.getElementById('dicetype-'+uid).value=sides;

  // Update active states
  [6,12,20,100,'euro'].forEach(s=>{
    const b=document.getElementById('dtbtn-'+s+'-'+uid);
    if(b) b.classList.toggle('active-dice', s===sides);
  });
  // Reset Euro counter when (re-)entering Euro mode
  if(sides==='euro'){ euroCount[uid]=0; euroItems[uid]=[]; }
  ['text','smiley','janken','color'].forEach(m=>{
    const b=document.getElementById('dtbtn-jein-'+m+'-'+uid);
    if(b) b.classList.toggle('active-jmode', sides==='jein-'+m);
  });
  // Satzbau button
  const sbBtn=document.getElementById('dtbtn-satzbau-'+uid);
  if(sbBtn) sbBtn.classList.toggle('active-jmode', sides==='satzbau');

  const wrap=document.getElementById('dicewrap-'+uid);
  const res =document.getElementById('diceres-'+uid);

  if(sides==='satzbau'){
    // Stop other modes
    if(ampelTimers[uid]){clearTimeout(ampelTimers[uid]);delete ampelTimers[uid];}
    stopSmileyAutoRotate(uid);
    if(!satzbauWords[uid] || ![1,2,3,4].some(i=>satzbauWords[uid][i]&&satzbauWords[uid][i].length>0)){
      const _defaultSb = '1\nich\ndu\nSie\n\n2\nheißen\nwohnen\nkommen';
      satzbauWords[uid] = parseSatzbauText(_defaultSb);
      satzbauWords[uid]._draftText = _defaultSb;
    }
    const _sbData=satzbauWords[uid];
    const _sbHas=_sbData&&[1,2,3,4].some(i=>_sbData[i]&&_sbData[i].length>0);
    if(_sbHas) showSatzbauIdle(uid); else showSatzbauSetup(uid);
    if(res) res.textContent='';

  } else if(typeof sides==='string' && sides.startsWith('jein-')){
    const mode=sides.replace('jein-','');
    if(!jeinState[uid]) jeinState[uid]={mode,result:null};
    else jeinState[uid].mode=mode;

    // Stop ampel timer if switching away
    if(ampelTimers[uid]){clearTimeout(ampelTimers[uid]);delete ampelTimers[uid];}
    // Stop smiley timer if switching away
    stopSmileyAutoRotate(uid);

    // Show mode-specific idle display immediately
    stopSmileyAutoRotate(uid);
    if(wrap){
      if(mode==='text'){
        wrap.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:16px;background:rgba(255,255,255,0.06);border:2px dashed rgba(255,255,255,0.2);"><span style="font-size:clamp(1.6em,6vw,3em);font-weight:900;color:var(--text2);opacity:.5;" data-i18n="diceJaNein"></span></div>`;
      } else if(mode==='smiley'){
        wrap.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;"><span style="font-size:clamp(6em,24vw,13em);opacity:.35;">😊</span></div>`;
        startSmileyAutoRotate(uid);
      } else if(mode==='janken'){
        wrap.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;gap:.5em;width:100%;height:100%;border-radius:16px;background:rgba(255,255,255,0.06);border:2px dashed rgba(255,255,255,0.2);"><span style="font-size:clamp(2em,8vw,4em);opacity:.4;">✂️</span><span style="font-size:clamp(2em,8vw,4em);opacity:.4;">🪨</span><span style="font-size:clamp(2em,8vw,4em);opacity:.4;">📄</span></div>`;
      } else if(mode==='color'){
        wrap.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:16px;background:rgba(255,255,255,0.06);border:2px dashed rgba(255,255,255,0.2);"><span style="font-size:clamp(2.5em,10vw,5em);opacity:.5;">🎨</span></div>`;
      }
    }
    if(res) res.textContent=T('diceClickHint');

  } else {
    // Normal dice mode — stop any ampel, show dice graphic
    if(ampelTimers[uid]){clearTimeout(ampelTimers[uid]);delete ampelTimers[uid];}
    stopSmileyAutoRotate(uid);
    updateDiceGraphic(uid);
    if(res) res.textContent=T('diceClickHint');
  }
}

function updateDiceGraphic(uid){
  const t=document.getElementById('dicetype-'+uid)?.value;

    // Idle-Anzeige: 2 Scheine (neues Design) + 3 Münzen darunter, gedimmt
    // Hilfsfunktion für Sterne-Kreis (12 Sterne, goldgelb)
    function idleStars(cx, cy, r, fs){
      return Array.from({length:12},(_,i)=>{
        const a=i*(Math.PI*2/12)-Math.PI/2;
        return `<text x="${(cx+Math.cos(a)*r).toFixed(1)}" y="${(cy+Math.sin(a)*r).toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="${fs}" fill="#f5c800">★</text>`;
      }).join('');
    }
    // Schein-Hilfsfunktion für Idle-Vorschau (neues Layout)
    function idleNote(x, y, w, h, val, base, mid, dark, label){
      const whiteW=Math.round(w*0.25);
      const colorX=x+whiteW;
      const colorW=w-whiteW;
      const midRX=colorX+Math.round(colorW*0.18), midRY=y+Math.round(h*0.12);
      const midRW=Math.round(colorW*0.64), midRH=Math.round(h*0.76);
      const starCX=colorX+Math.round(colorW*0.50), starCY=y+Math.round(h*0.50);
      const starR=Math.min(colorW,h)*0.24, starFS=Math.max(3,Math.round(h*0.11));
      const bigFS=Math.max(8,Math.round(h*0.38));
      const eFS=Math.max(5,Math.round(h*0.20));
      const snFS=Math.max(4,Math.round(h*0.16));

        <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${base}" stroke="${dark}" stroke-width="0.8"/>
        <rect x="${x}" y="${y}" width="${whiteW}" height="${h}" rx="4" fill="#f8f8f6" clip-path="url(#icp${nid})"/>
        <rect x="${x+whiteW-4}" y="${y}" width="4" height="${h}" fill="#f8f8f6" clip-path="url(#icp${nid})"/>
        <line x1="${colorX}" y1="${y+1}" x2="${colorX}" y2="${y+h-1}" stroke="${dark}" stroke-width="0.5" stroke-opacity="0.3"/>
        <rect x="${midRX}" y="${midRY}" width="${midRW}" height="${midRH}" rx="2" fill="${mid}" opacity="0.7" clip-path="url(#icp${nid})"/>
        ${idleStars(starCX, starCY, starR, starFS)}
        <text x="${x+4}" y="${y+Math.round(h*0.22)}" font-family="Arial,sans-serif" font-size="${eFS}" font-weight="700" fill="${label}">€</text>
        <text x="${x+3}" y="${y+Math.round(h*0.80)}" font-family="Arial Black,sans-serif" font-weight="900" font-size="${snFS}" fill="${label}">${val}</text>
        <text x="${x+3+snFS*(val>=10?1.6:1.1)+1}" y="${y+Math.round(h*0.80)}" font-family="Arial,sans-serif" font-size="${euFS}" fill="${label}" dominant-baseline="central">Euro</text>
        <text x="${x+w-4}" y="${y+Math.round(h*0.30)}" text-anchor="end" font-family="Arial Black,sans-serif" font-weight="900" font-size="${bigFS}" fill="${dark}" clip-path="url(#icp${nid})">${val}</text>`;
    }
    wrap.innerHTML=`<svg viewBox="0 0 300 168" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;opacity:0.55;">
      <defs>
        <!-- Gold: 10/20/50ct -->
        <radialGradient id="idleGold" cx="36%" cy="30%" r="70%"><stop offset="0%" stop-color="#f0be18"/><stop offset="100%" stop-color="#9a7000"/></radialGradient>
        <!-- Silber: 2€ äußerer Ring -->
        <radialGradient id="idleSilv" cx="36%" cy="30%" r="70%"><stop offset="0%" stop-color="#d8d8d8"/><stop offset="100%" stop-color="#808080"/></radialGradient>
        <!-- Kupfer: 1/2/5ct -->
        <radialGradient id="idleCop" cx="36%" cy="30%" r="70%"><stop offset="0%" stop-color="#e06830"/><stop offset="100%" stop-color="#9a4412"/></radialGradient>
      </defs>
      <!-- Schein 1: 5€ (grau) links -->
      ${idleNote(6, 14, 130, 68, 5, '#dde0d8', '#b0b8a8', '#5a6a52', '#3a4a32')}
      <!-- Schein 2: 20€ (blau) rechts -->
      ${idleNote(164, 14, 130, 68, 20, '#c8daf0', '#8aaed8', '#2a5a9a', '#1a3a72')}
      <!-- Münze 1: 50ct Gold (rechts versetzt) -->
      <ellipse cx="70" cy="145" rx="28" ry="4" fill="rgba(0,0,0,0.18)"/>
      <circle cx="70" cy="138" r="29" fill="url(#idleGold)"/>
      <circle cx="70" cy="138" r="29" fill="none" stroke="#9a7000" stroke-width="0.8"/>
      <circle cx="70" cy="138" r="19" fill="url(#idleGold)"/>
      <circle cx="70" cy="138" r="19" fill="none" stroke="#9a7000" stroke-width="0.8"/>
      <text x="${70+2}" y="135" text-anchor="middle" dominant-baseline="central" font-family="Arial Black,sans-serif" font-weight="900" font-size="14" fill="#6b4800">50</text>
      <text x="70" y="151" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#6b4800">Cent</text>
      <!-- Münze 2: 1€ bicolor (Gold außen, Silber innen; Zahl links + "Euro") -->
      <ellipse cx="150" cy="145" rx="28" ry="4" fill="rgba(0,0,0,0.18)"/>
      <circle cx="150" cy="138" r="29" fill="url(#idleGold)"/>
