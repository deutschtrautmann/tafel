<div id="bg-panel">
  <button class="bg-panel-close" onclick="toggleBgPanel()">✕</button>
  <h3>🖼 Hintergrund</h3>

  <div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--text2);margin-bottom:4px;">Hintergrundfarbe</div>
  
  <!-- KOMPAKTER FARBBEREICH -->
  <div style="display:flex;gap:8px;align-items:center;margin-bottom:4px;">
    
    <!-- kleiner Color Picker -->
    <input type="color" id="bg-color-picker" value="#1a1f3a"
      style="width:36px;height:36px;border:2px solid rgba(255,255,255,0.2);border-radius:8px;cursor:pointer;background:none;padding:2px;"
      oninput="applyBgColor(this.value)">

    <!-- GRID statt Text + Listen -->
    <div style="flex:1;padding-top:2px;">
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;" id="bg-swatches"></div>
    </div>

  </div>

  <div class="sound-divider"></div>

  <div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--text2);margin-bottom:4px;">Foto hochladen</div>
  <div class="bg-upload-zone" id="bg-dropzone" onclick="document.getElementById('bg-file-input').click()" ondragover="event.preventDefault()" ondrop="handleBgDrop(event)">
    <input type="file" id="bg-file-input" accept="image/*" onchange="handleBgFile(this.files[0])">
    <div style="font-size:28px;margin-bottom:6px;">📁</div>
    <div style="font-weight:700;">Klicken oder Foto hierher ziehen</div>
    <div style="font-size:11px;margin-top:3px;">JPG, PNG, WEBP, GIF</div>
  </div>

  <div id="bg-photo-controls" style="display:none;">
    <div class="bg-dim-row">
      <label>Abdunkeln: <span id="dim-val">30</span>%</label>
      <input type="range" min="0" max="85" value="30" id="dim-slider" oninput="setBgDim(this.value)">
    </div>
    <div class="bg-dim-row" style="margin-top:8px;">
      <label>Unschärfe: <span id="blur-val">0</span>px</label>
      <input type="range" min="0" max="20" value="0" id="blur-slider" oninput="setBgBlur(this.value)">
    </div>
    <button class="wbtn" style="margin-top:8px;width:100%;" onclick="removeBgPhoto()">✕ Foto entfernen</button>
  </div>

  <div class="sound-divider"></div>

  <div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--text2);margin-bottom:4px;">Widget-Transparenz</div>
  <div class="bg-dim-row">
    <label>Fenster-Transparenz: <span id="widget-alpha-val">88</span>%</label>
    <input type="range" min="40" max="100" value="88" id="widget-alpha-slider" oninput="setWidgetAlpha(this.value)">
  </div>
</div>


<!-- CSS ANPASSUNG -->
<style>
#bg-panel{
  width:240px;
  gap:8px;
}
</style>
