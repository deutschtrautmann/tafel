      <circle cx="230" cy="135" r="22" fill="url(#idleCop)"/>
      <circle cx="230" cy="135" r="22" fill="none" stroke="#9a4412" stroke-width="0.8"/>
      <circle cx="230" cy="135" r="13" fill="#7a2e08"/>
      <text x="${230-8}" y="132" text-anchor="middle" dominant-baseline="central" font-family="Arial Black,sans-serif" font-weight="900" font-size="12" fill="#f0c090">1</text>
      <text x="${230+2}" y="132" text-anchor="start" dominant-baseline="central" font-family="Arial,sans-serif" font-weight="700" font-size="7" fill="#f0c090">Cent</text>
      <!-- Hinweis-Text -->
      <text x="150" y="6" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="rgba(255,255,255,0.40)" data-i18n="diceClickHint"></text>
    </svg>`;
  } else {
    const tnum=parseInt(t||6);
    wrap.innerHTML=tnum===6?diceD6svg(6):dicePolySvg(tnum,'?');
  }
}

function rollDice(uid){
  const type=document.getElementById('dicetype-'+uid)?.value;
  // Satzbau-Modus
  if(type==='satzbau'){
    rollSatzbau(uid);
    return;
  }
  // Jein-Modus: delegate to rollJein using dice widget's display
  if(typeof type==='string' && type.startsWith('jein-')){
    if(!jeinState[uid]) jeinState[uid]={mode:type.replace('jein-',''),result:null};
    else jeinState[uid].mode=type.replace('jein-','');
    rollJeinInDice(uid);
    return;
  }
  if(type==='euro'){
    playSound('Glocke',0.7);
  } else if(parseInt(type||6)===100){
    playBallImpact();
  } else {
    playSound('Wuerfel',0.8);
    try{const ac=new (window.AudioContext||window.webkitAudioContext)();playDiceRoll(ac,0.6);}catch(e){}
  }
  const wrap=document.getElementById('dicewrap-'+uid);
  const res=document.getElementById('diceres-'+uid);
  if(type==='euro'){
    // ══════════════════════════════════════════════════════════
    // EURO-MODUS: Progressiv 1→8 Geldstücke, getreu dem Vorbild
    // ══════════════════════════════════════════════════════════

    // ── Alle Geldwerte (Scheine + Münzen) ──
    // Scheine bis 100€ bevorzugt (200€/500€ selten)
    const noteValues = [5,5,5,10,10,10,20,20,20,50,50,50,100,100,200,500]; // gewichtet: 5/10/20/50/100 häufiger, 200/500 selten
    const coinValues = [1,2,5,10,20,50,100,200]; // ct=1..50, Euro=100(=1€),200(=2€)

    // Echte Euro-Schein-Farben: hell mit passendem Farbton
    // base = heller Hauptton, mid = dunkleres Rechteck in der Mitte, dark = Textfarbe/Rand
    const noteColors = {
      5:   { base:'#dde0d8', mid:'#b0b8a8', dark:'#5a6a52', label:'#3a4a32' },  // grau
      10:  { base:'#f0c8b8', mid:'#d4947a', dark:'#8a3a20', label:'#6a2010' },  // rot
      20:  { base:'#c8daf0', mid:'#8aaed8', dark:'#2a5a9a', label:'#1a3a72' },  // blau
      50:  { base:'#f8dfa0', mid:'#e8b040', dark:'#a87010', label:'#7a4a00' },  // orange
      100: { base:'#d0ecc0', mid:'#8acc70', dark:'#2a7a18', label:'#1a5010' },  // grün
      200: { base:'#f4edb0', mid:'#d4c040', dark:'#8a7000', label:'#5a4800' },  // gelb
      500: { base:'#e8d0f0', mid:'#c090d8', dark:'#6a3090', label:'#4a1870' },  // lila
    };
    // Münzmetall: Kupfer(1,2,5ct), Gold(10,20,50ct), Bimetall(1€,2€)
    // type: 'copper'=1/2/5ct, 'gold'=10/20/50ct, 'bi-gold'=1€(gold außen/silber innen), 'bi-silver'=2€(silber außen/gold innen)
    const coinMetal = {
      1:   { body:'#e06830', bodyDark:'#9a4412', innerRing:'#7a2e08', label:'1',  sub:'', labelColor:'#f0c090', numLeft:true,  euroText:true,  euroLabel:'Cent', type:'copper' },
      2:   { body:'#e06830', bodyDark:'#9a4412', innerRing:'#7a2e08', label:'2',  sub:'', labelColor:'#f0c090', numLeft:true,  euroText:true,  euroLabel:'Cent', type:'copper' },
      5:   { body:'#e06830', bodyDark:'#9a4412', innerRing:'#7a2e08', label:'5',  sub:'', labelColor:'#f0c090', numLeft:true,  euroText:true,  euroLabel:'Cent', type:'copper' },
      10:  { body:'#f0be18', bodyDark:'#9a7000', innerRing:'#b08800', label:'10', sub:'Cent', labelColor:'#6b4800', numLeft:false, euroText:false, euroLabel:'', type:'gold'   },
      20:  { body:'#f0be18', bodyDark:'#9a7000', innerRing:'#b08800', label:'20', sub:'Cent', labelColor:'#6b4800', numLeft:false, euroText:false, euroLabel:'', type:'gold'   },
      50:  { body:'#f0be18', bodyDark:'#9a7000', innerRing:'#b08800', label:'50', sub:'Cent', labelColor:'#6b4800', numLeft:false, euroText:false, euroLabel:'', type:'gold'   },
      100: { body:'#f0be18', bodyDark:'#9a7000', innerRing:'#d0d0d0', label:'1',  sub:'',   labelColor:'#5a6a6a', numLeft:true,  euroText:true,  euroLabel:'Euro', type:'bi-gold'   },
      200: { body:'#d8d8d8', bodyDark:'#808080', innerRing:'#e0aa10', label:'2',  sub:'',   labelColor:'#6a5000', numLeft:true,  euroText:true,  euroLabel:'Euro', type:'bi-silver' },
    };
    const coinSize = { 1:22, 2:25, 5:28, 10:25, 20:29, 50:33, 100:33, 200:37 };

    // ── SVG-Hilfsfunktion: Schein (getreu echten Euro-Scheinen) ──
    // Layout: linkes ~25% weiß | Rest farbig | dunkles Rechteck in der Mitte
    // Texte: € oben links (weiß), kleine Zahl+Euro unten links (weiß),
    //        große Zahl oben rechts (dunkel), 12 Sterne kreisförmig in der Mitte
    function noteSVG(val, x, y, w, h){
      const nc = noteColors[val];
      const nid = 'n'+Math.random().toString(36).slice(2,7);
      const r = 5;

      // Weißer linker Streifen: ~25% der Breite
      const whiteW = Math.round(w * 0.25);
      const colorX = x + whiteW;
      const colorW = w - whiteW;

      // Dunkleres Rechteck in der Mitte des farbigen Bereichs
      const midRectX = colorX + Math.round(colorW * 0.18);
      const midRectY = y + Math.round(h * 0.12);
      const midRectW = Math.round(colorW * 0.64);
      const midRectH = Math.round(h * 0.76);

      // Textfarben
      const darkText  = nc.dark;
      const labelText = nc.label;

      // Schriftgrößen
      const bigNumSize   = Math.max(10, Math.round(h * 0.36)); // große Zahl oben rechts
      const eSize        = Math.max(6,  Math.round(h * 0.20)); // € oben links (weiß)
      const smallNumSize = Math.max(5,  Math.round(h * 0.16)); // kleine Zahl unten links
      const euroTxtSize  = Math.max(4,  Math.round(h * 0.12)); // "Euro" neben kleiner Zahl

      // Positionen
      // € oben links im weißen Bereich
      const eX = x + 5;
      const eY = y + Math.round(h * 0.22);
      // Kleine Zahl unten links im weißen Bereich
      const snX = x + 4;
      const snY = y + Math.round(h * 0.80);
      // "Euro" rechts neben kleiner Zahl (ebenfalls unten links)
      const euTxtX = snX + smallNumSize * (val >= 100 ? 2.0 : (val >= 10 ? 1.5 : 1.0)) + 2;
      const euTxtY = snY;
      // Große Zahl oben rechts
      const bigNumX = x + w - 6;
      const bigNumY = y + Math.round(h * 0.32);

      // 12 Sterne kreisförmig in der Mitte des Scheins
      const starCX = colorX + Math.round(colorW * 0.50);
      const starCY = y + Math.round(h * 0.50);
      const starR  = Math.min(colorW, h) * 0.24;
      const starFS = Math.max(4, Math.round(h * 0.11));
      const stars12 = Array.from({length:12}, (_,i) => {
        const a = i * (Math.PI*2/12) - Math.PI/2;
        const sx = (starCX + Math.cos(a)*starR).toFixed(1);
        const sy = (starCY + Math.sin(a)*starR).toFixed(1);
        return `<text x="${sx}" y="${sy}" text-anchor="middle" dominant-baseline="central" font-size="${starFS}" fill="#f5c800">★</text>`;
      }).join('');

      return `
        <defs>
          <clipPath id="nc${nid}">
            <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}"/>
          </clipPath>
        </defs>

        <!-- Heller farbiger Hintergrund (gesamte Fläche) -->
        <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${nc.base}" stroke="${nc.dark}" stroke-width="1.0"/>

        <!-- Weißer linker Streifen (~25%) -->
        <rect x="${x}" y="${y}" width="${whiteW}" height="${h}" rx="${r}" fill="#f8f8f6" clip-path="url(#nc${nid})"/>
        <!-- Abrundung rechts vom weißen Bereich begradigen -->
        <rect x="${x + whiteW - r}" y="${y}" width="${r}" height="${h}" fill="#f8f8f6" clip-path="url(#nc${nid})"/>

        <!-- Trennlinie weißer Bereich / farbiger Bereich -->
        <line x1="${colorX}" y1="${y+2}" x2="${colorX}" y2="${y+h-2}" stroke="${nc.dark}" stroke-width="0.6" stroke-opacity="0.3" clip-path="url(#nc${nid})"/>

        <!-- Dunkleres Rechteck in der Mitte (Architektur-/Muster-Feld) -->
        <rect x="${midRectX}" y="${midRectY}" width="${midRectW}" height="${midRectH}" rx="3" fill="${nc.mid}" opacity="0.7" clip-path="url(#nc${nid})"/>

        <!-- Stilisiertes Architekturfenster im dunklen Rechteck -->
        <rect x="${midRectX + Math.round(midRectW*0.15)}" y="${midRectY + Math.round(midRectH*0.15)}" width="${Math.round(midRectW*0.70)}" height="${Math.round(midRectH*0.60)}" rx="2" fill="none" stroke="${nc.dark}" stroke-width="0.8" stroke-opacity="0.35" clip-path="url(#nc${nid})"/>
        <line x1="${(midRectX + midRectW*0.50).toFixed(1)}" y1="${(midRectY + midRectH*0.15).toFixed(1)}" x2="${(midRectX + midRectW*0.50).toFixed(1)}" y2="${(midRectY + midRectH*0.75).toFixed(1)}" stroke="${nc.dark}" stroke-width="0.6" stroke-opacity="0.25" clip-path="url(#nc${nid})"/>
        <line x1="${(midRectX + midRectW*0.15).toFixed(1)}" y1="${(midRectY + midRectH*0.45).toFixed(1)}" x2="${(midRectX + midRectW*0.85).toFixed(1)}" y2="${(midRectY + midRectH*0.45).toFixed(1)}" stroke="${nc.dark}" stroke-width="0.6" stroke-opacity="0.25" clip-path="url(#nc${nid})"/>

        <!-- 12 Sterne kreisförmig in der Mitte -->
        ${stars12}

        <!-- Äußerer Rahmen -->
        <rect x="${x+1}" y="${y+1}" width="${w-2}" height="${h-2}" rx="${r-0.5}" fill="none" stroke="${nc.dark}" stroke-width="0.5" stroke-opacity="0.3" clip-path="url(#nc${nid})"/>

        <!-- € oben links im weißen Bereich (dunkel) -->
        <text x="${eX}" y="${eY}" text-anchor="start" dominant-baseline="central"
          font-family="Arial,sans-serif" font-size="${eSize}" font-weight="700"
          fill="${labelText}">€</text>

        <!-- Kleine Zahl unten links im weißen Bereich -->
        <text x="${snX}" y="${snY}" text-anchor="start" dominant-baseline="central"
          font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="${smallNumSize}"
          fill="${labelText}">${val}</text>

        <!-- "Euro" klein rechts neben der kleinen Zahl -->
        <text x="${euTxtX.toFixed(1)}" y="${euTxtY}" text-anchor="start" dominant-baseline="central"
          font-family="Arial,sans-serif" font-weight="400" font-size="${euroTxtSize}"
          fill="${labelText}">Euro</text>

        <!-- Große Hauptzahl oben rechts -->
        <text x="${bigNumX}" y="${bigNumY.toFixed(1)}" text-anchor="end" dominant-baseline="central"
          font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="${bigNumSize}"
          fill="${darkText}" clip-path="url(#nc${nid})">${val}</text>`;
    }

    // ── SVG-Hilfsfunktion: Münze (simpel, an Vorlage angelehnt) ──
    function coinSVG(val, cx, cy){
      const R  = coinSize[val];
      const m  = coinMetal[val];
      const cid = 'c'+Math.random().toString(36).slice(2,7);

      // Innenkreis-Radius
      const Ri = (m.type==='copper') ? Math.round(R*0.58) : Math.round(R*0.62);

      // Schatten
      const shadow = `<ellipse cx="${cx+1.5}" cy="${cy+R-1}" rx="${R-2}" ry="${Math.round(R*0.11)}" fill="rgba(0,0,0,0.20)"/>`;

      const outerFill   = m.body;
      const outerStroke = m.bodyDark;

      // Innenkreis-Farbe
      let innerFill;
      if(m.type==='copper')       innerFill = m.innerRing;
      else if(m.type==='gold')    innerFill = m.body;
      else if(m.type==='bi-gold') innerFill = '#d8d8d8';   // 1€: silberner Innenkreis (heller)
      else                        innerFill = '#f0be18';   // 2€: goldener Innenkreis (heller)

      // Zahlenposition:
      // 1/2/5ct: deutlich links (Platz für "Cent"); 10/20/50ct: leicht rechts; 1€/2€: deutlich links (Platz für "Euro")
      const isEuroVal = (m.type==='bi-gold' || m.type==='bi-silver');
      const isCopperVal = (m.type==='copper');
      const labelSize = Math.round(R * (m.label.length > 1 ? 0.62 : 0.72));
      const subSize   = Math.max(4, Math.round(R * 0.28));
      const euroTextSize = Math.max(3, Math.round(R * 0.22));

      // X-Offset für Zahl: Kupfer + Euro-Münzen deutlich links, Gold leicht rechts
      const offX = (isEuroVal || isCopperVal) ? -Math.round(R*0.30) : Math.round(R*0.10);
      const labelX = cx + offX;
      const labelY = cy - Math.round(R*0.05);

      // Nebentext ("Cent" / "Euro") rechts neben der Zahl
      const euroLabelX = labelX + Math.round(labelSize * 0.55) + 2;
      const euroLabel = m.euroText
        ? `<text x="${euroLabelX}" y="${labelY}" text-anchor="start" dominant-baseline="central"
            font-family="Arial,sans-serif" font-weight="700" font-size="${euroTextSize}"
            fill="${m.labelColor}">${m.euroLabel}</text>`
        : '';

      // Glanzfleck
      const shine = `<ellipse cx="${cx-Math.round(R*0.22)}" cy="${cy-Math.round(R*0.28)}" rx="${Math.round(R*0.18)}" ry="${Math.round(R*0.09)}" fill="rgba(255,255,255,0.22)" transform="rotate(-30,${cx-Math.round(R*0.22)},${cy-Math.round(R*0.28)})"/>`;

      // Ring-Kontur: dünn (0.8px) bei allen Münzen
      const ringStroke = (m.type==='gold' || m.type==='bi-gold' || m.type==='bi-silver')
        ? `<circle cx="${cx}" cy="${cy}" r="${Ri}" fill="none" stroke="${m.bodyDark}" stroke-width="0.8"/>`
        : '';
      // Äußere Kontur ebenfalls dünn
      const outerContour = `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${outerStroke}" stroke-width="0.8"/>`;

      // "ct"-Subtext nur für Cent-Münzen
      const subText = m.sub
        ? `<text x="${cx}" y="${cy+Math.round(R*0.46)}" text-anchor="middle" dominant-baseline="central"
            font-family="Arial,sans-serif" font-weight="700" font-size="${subSize}"
            fill="${m.labelColor}">${m.sub}</text>`
        : '';

      return `
        <defs>
          <radialGradient id="cg${cid}" cx="36%" cy="30%" r="70%">
            <stop offset="0%" stop-color="${outerFill}" stop-opacity="1"/>
            <stop offset="100%" stop-color="${outerStroke}" stop-opacity="1"/>
          </radialGradient>
          <radialGradient id="ci${cid}" cx="38%" cy="32%" r="65%">
            <stop offset="0%" stop-color="${innerFill}" stop-opacity="1"/>
            <stop offset="100%" stop-color="${m.innerRing}" stop-opacity="1"/>
          </radialGradient>
        </defs>
        ${shadow}
        <circle cx="${cx}" cy="${cy}" r="${R}" fill="url(#cg${cid})"/>
        ${outerContour}
        <circle cx="${cx}" cy="${cy}" r="${Ri}" fill="url(#ci${cid})"/>
        ${ringStroke}
        ${shine}
        <text x="${labelX}" y="${labelY}" text-anchor="middle" dominant-baseline="central"
          font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="${labelSize}"
          fill="${m.labelColor}">${m.label}</text>
        ${euroLabel}
        ${subText}`;
    }

    // ── Progressiv 1→8, jedes Mal neue zufällige Kombination gleicher Länge ──
    if(!euroCount[uid]){ euroCount[uid] = 0; }
    if(euroCount[uid] < 8) euroCount[uid]++;
    const n = euroCount[uid]; // 1..8

    // Kombination aufbauen: höchstens 3 Scheine, Rest Münzen
    const items = [];
    const maxNotes = Math.min(3, n);
    // Wie viele Scheine? 0 bis maxNotes, aber mindestens 1 wenn n>=2
    let nNotesTarget = 0;
    for(let i=0;i<n;i++){
      if(Math.random() < 0.40 && nNotesTarget < maxNotes) nNotesTarget++;
    }
    if(n >= 2 && nNotesTarget === 0) nNotesTarget = 1; // mindestens 1 Schein ab 2 Items
    nNotesTarget = Math.min(nNotesTarget, maxNotes);

    // Scheine füllen (gewichtete Auswahl aus noteValues)
    for(let i=0;i<nNotesTarget;i++){
      items.push({type:'note', val: noteValues[Math.floor(Math.random()*noteValues.length)]});
    }
    // Münzen für den Rest
    for(let i=nNotesTarget;i<n;i++){
      items.push({type:'coin', val: coinValues[Math.floor(Math.random()*coinValues.length)]});
    }

    // ── Render-Strategie: Scheine hinten, Münzen vorne ──
    // Scheine und Münzen separat sammeln, dann Scheine zuerst rendern,
    // Münzen danach → Münzen liegen immer oben und sind nie verdeckt
    const noteItems = items.map((it,i)=>({...it,origIdx:i})).filter(it=>it.type==='note');
    const coinItems = items.map((it,i)=>({...it,origIdx:i})).filter(it=>it.type==='coin');

    const VW = 320, VH = 180;

    // Rotationen & Y-Versätze (leicht variiert per Math.random für echte Zufälligkeit)
    function randRot(base){ return base + (Math.random()-0.5)*4; }
    function randOffY(base){ return base + (Math.random()-0.5)*6; }
    const rotPool  = [-13,-6, 3,10,-8, 1, 8,-15, 5,-3, 12,-10];
    const offYPool = [  0,-9, 6,-3, 9,-5, 2,-11, 4,-7,  8, -2];

    // Schein-Größe: immer groß und gut lesbar, leicht skaliert mit Anzahl
    const nNotes = noteItems.length;
    const noteW = nNotes <= 1 ? 240 : (nNotes <= 2 ? 210 : (nNotes <= 4 ? 185 : 160));
    const noteH = Math.round(noteW / 2.0);
    // Münz-Radius: immer gut ablesbar
    const nCoins = coinItems.length;
    const coinR  = nCoins <= 2 ? 52 : (nCoins <= 4 ? 45 : (nCoins <= 6 ? 38 : 33));

    // X-Positionen für Scheine: gestaffelt überlappend über die ganze Breite
    function spreadCenters(count, margin, spread){
      if(count === 1) return [VW/2];
      const step = spread / (count - 1);
      return Array.from({length:count},(_,i) => margin + step * i);
    }

    const noteCentersX = spreadCenters(noteItems.length, 50, VW-100);
    const coinCentersX = spreadCenters(coinItems.length, 35, VW-70);

    // Höhe des SVG: Scheine oben, Münzen darunter in eigener Zone
    const nCoinsRows = coinItems.length > 0 ? 1 : 0;
    const coinZoneH = nCoinsRows > 0 ? coinR * 2 + 16 : 0;
    const noteZoneH = 180;
    const VH2 = noteZoneH + coinZoneH;

    let svgContent = '';

    // 1. Scheine im oberen Bereich (noteZone)
    noteItems.forEach((item, i) => {
      const cx = noteCentersX[i];
      const cy = noteZoneH/2 + offYPool[(item.origIdx * 3) % offYPool.length] * 0.7;
      const rot = rotPool[(item.origIdx * 5) % rotPool.length];
      const nx = cx - noteW/2, ny = cy - noteH/2;
      svgContent += `<g transform="rotate(${rot.toFixed(1)},${cx},${cy})">${noteSVG(item.val, nx, ny, noteW, noteH)}</g>`;
    });

    // 2. Münzen in eigener Zeile unterhalb der Scheine
    if(coinItems.length > 0){
      const coinY = noteZoneH + coinR + 8;
      coinItems.forEach((item, i) => {
        const cx = coinCentersX[i];
        const cy = coinY + offYPool[(item.origIdx * 7 + 2) % offYPool.length] * 0.4;
        const R = Math.min(coinSize[item.val], coinR);
        const origSize = coinSize[item.val];
        coinSize[item.val] = R;
        svgContent += coinSVG(item.val, cx, cy);
        coinSize[item.val] = origSize;
      });
    }

    if(wrap){
      wrap.style.transform='scale(0.80) rotate(12deg)';
      wrap.style.transition='transform .08s ease-in';
      setTimeout(()=>{
        wrap.style.transition='transform .25s cubic-bezier(.34,1.45,.64,1)';
        wrap.style.transform='scale(1) rotate(-2deg)';
        wrap.innerHTML=`<svg viewBox="0 0 ${VW} ${VH2}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;">${svgContent}</svg>`;
        if(res) res.textContent='';
        setTimeout(()=>{wrap.style.transform='';},160);
      },100);
    }
    return;
  }
  const tnum=parseInt(type||6);
  // Zufall-aus (bag) mode: ensure all values appear before repeating
  let rolledVal;
  if([6,12,20].includes(tnum) && diceZufallOff[uid]){
    if(!diceBag[uid]) diceBag[uid]={};
    if(!diceBag[uid][tnum] || diceBag[uid][tnum].length===0){
      // Refill bag with all values 1..tnum in shuffled order
      const arr=Array.from({length:tnum},(_,i)=>i+1);
      for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
      diceBag[uid][tnum]=arr;
    }
    rolledVal=diceBag[uid][tnum].pop();
  } else {
    rolledVal=Math.floor(Math.random()*tnum)+1;
  }
  const results=[rolledVal];
  if(wrap){
    if(tnum===100){
      // W100: CSS animation plays for 2.3s, show result text after ball settles
      wrap.style.transform='';
      wrap.style.transition='';
      wrap.innerHTML=dicePolySvg(100,results[0]);
      if(res) res.textContent='…';
      setTimeout(()=>{
        if(res) res.textContent=`${T('diceErgebnis')}: ${results[0]}`;
      }, 2500);
    } else if([6,12,20].includes(tnum)){
      // Flicker animation: show random values briefly before final result
      wrap.style.transform='scale(0.75) rotate(20deg)';
      wrap.style.transition='transform .1s ease-in';
      const flickerCount = 7;
      const flickerInterval = 60; // ms between flickers
      const totalFlickerTime = flickerCount * flickerInterval;
      let flickerStep = 0;
      function showFlicker(){
        if(flickerStep < flickerCount){
          const fakeVal = Math.floor(Math.random()*tnum)+1;
          if(tnum===6) wrap.innerHTML=diceD6svg(fakeVal);
          else wrap.innerHTML=dicePolySvg(tnum,fakeVal);
          flickerStep++;
          setTimeout(showFlicker, flickerInterval);
        } else {
          // Show final result
          wrap.style.transition='transform .28s cubic-bezier(.34,1.56,.64,1)';
          wrap.style.transform='scale(1) rotate(-5deg)';
          if(tnum===6) wrap.innerHTML=diceD6svg(results[0]);
          else wrap.innerHTML=dicePolySvg(tnum,results[0]);
          if(res) res.textContent=`${T('diceErgebnis')}: ${results[0]}`;
          setTimeout(()=>{wrap.style.transform='';},180);
        }
      }
      setTimeout(()=>{
        wrap.style.transition='transform .28s cubic-bezier(.34,1.56,.64,1)';
        wrap.style.transform='scale(1) rotate(-5deg)';
        showFlicker();
      },130);
    } else {
      wrap.style.transform='scale(0.75) rotate(20deg)';
      wrap.style.transition='transform .1s ease-in';
      setTimeout(()=>{
        wrap.style.transition='transform .28s cubic-bezier(.34,1.56,.64,1)';
        wrap.style.transform='scale(1) rotate(-5deg)';
        if(tnum===6) wrap.innerHTML=diceD6svg(results[0]);
        else wrap.innerHTML=dicePolySvg(tnum,results[0]);
        setTimeout(()=>{wrap.style.transform='';},180);
      },130);
    }
  }
  if(tnum!==100 && ![6,12,20].includes(tnum) && res) res.textContent=`${T('diceErgebnis')}: ${results[0]}`;
}

// Roll Jein-mode result and show it in the dice widget's display area
function rollJeinInDice(uid){
  const mode=jeinState[uid]?.mode||'text';
  const wrap=document.getElementById('dicewrap-'+uid);
  const res =document.getElementById('diceres-'+uid);
  if(!wrap) return;

  wrap.style.transition='transform .12s ease-in';
  wrap.style.transform='scale(0.82)';
  setTimeout(()=>{
    wrap.style.transition='transform .25s cubic-bezier(.34,1.56,.64,1)';
    wrap.style.transform='scale(1)';
  },130);

  if(mode==='text'){
    // Ja/Nein: kein Ton
    const ja=Math.random()<0.5;
    const jaLabel = currentLanguage==='ja' ? 'はい' : 'JA';
    const neinLabel = currentLanguage==='ja' ? 'いいえ' : 'NEIN';
    const txt=ja?jaLabel:neinLabel;
    const col=ja?'#4ade80':'#f87171';
    wrap.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:16px;background:${col}20;border:3px solid ${col};"><span style="font-size:clamp(2em,8vw,4em);font-weight:900;color:${col};">${txt}</span></div>`;
    if(res) res.textContent=txt;

  } else if(mode==='smiley'){
    // Kein Ton, kein Label
    const s=BEFINDEN_SMILEYS[Math.floor(Math.random()*BEFINDEN_SMILEYS.length)];
    wrap.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;"><span data-smiley-active="1" style="font-size:clamp(6em,24vw,13em);line-height:1;">${s.emoji}</span></div>`;
    if(res) res.textContent='';
    // Restart auto-rotate timer so next change is 5s after manual roll
    startSmileyAutoRotate(uid);

  } else if(mode==='color'){
    // Kein Ton
    const COLOR_DE=[{name:'Rot',hex:'#ef4444'},{name:'Grün',hex:'#22c55e'},{name:'Blau',hex:'#3b82f6'},{name:'Gelb',hex:'#eab308'},{name:'Orange',hex:'#f97316'},{name:'Lila',hex:'#a855f7'},{name:'Rosa',hex:'#ec4899'},{name:'Türkis',hex:'#06b6d4'},{name:'Weiß',hex:'#f8fafc'},{name:'Schwarz',hex:'#1e293b'},{name:'Grau',hex:'#6b7280'},{name:'Braun',hex:'#92400e'}];
    const COLOR_JA=[{name:'赤',hex:'#ef4444'},{name:'緑',hex:'#22c55e'},{name:'青',hex:'#3b82f6'},{name:'黄',hex:'#eab308'},{name:'橙',hex:'#f97316'},{name:'紫',hex:'#a855f7'},{name:'ピンク',hex:'#ec4899'},{name:'水色',hex:'#06b6d4'},{name:'白',hex:'#f8fafc'},{name:'黒',hex:'#1e293b'},{name:'灰色',hex:'#6b7280'},{name:'茶色',hex:'#92400e'}];
    const COLORS=currentLanguage==='ja'?COLOR_JA:COLOR_DE;
    // Bag shuffle: always show each color once before repeating
    if(!jeinState[uid]) jeinState[uid]={};
    if(!jeinState[uid].colorBag || jeinState[uid].colorBag.length===0){
      const arr=COLORS.map((_,i)=>i);
      for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
      jeinState[uid].colorBag=arr;
    }
    const cIdx=jeinState[uid].colorBag.pop();
    const c=COLORS[cIdx];
    // Play plop sound
    try{const ac=new (window.AudioContext||window.webkitAudioContext)();playPop(ac,0.8);}catch(e){}
    const showName=jeinState[uid]?.colorShowName===true; // default: versteckt
    const textColor=c.hex==='#f8fafc'||c.hex==='#eab308'?'#1e293b':'#fff';
    wrap.innerHTML=`<div id="dice-color-box-${uid}" style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:16px;background:${c.hex};position:relative;">
      <span id="dice-color-label-${uid}" style="font-size:clamp(1.4em,6vw,3em);font-weight:900;color:${textColor};text-shadow:0 1px 6px rgba(0,0,0,0.35);display:${showName?'block':'none'};">${c.name}</span>
    </div>`;
    if(res) res.textContent=c.name;

  } else if(mode==='janken'){
    // Computer wählt zufällig Schere, Stein oder Papier
    const choices = SSP_CHOICES || [{id:'schere',icon:'✂️',label:'Schere'},{id:'stein',icon:'🪨',label:'Stein'},{id:'papier',icon:'📄',label:'Papier'}];
    const pick = choices[Math.floor(Math.random() * choices.length)];
    try{const ac=new (window.AudioContext||window.webkitAudioContext)();playPop(ac,0.8);}catch(e){}
    wrap.innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;border-radius:16px;background:rgba(255,255,255,0.06);border:2px dashed rgba(255,255,255,0.2);gap:.2em;">
      <span style="font-size:clamp(4em,18vw,9em);line-height:1;">${pick.icon}</span>
      <span style="font-size:clamp(.9em,3vw,1.4em);font-weight:700;color:var(--text2);">${pick.label}</span>
    </div>`;
    if(res) res.textContent=pick.label;

  } else if(mode==='ampel'){
    rollJeinAmpelInDice(uid);
  }
}

function rollJeinAmpelInDice(uid){

function parseSatzbauText(text){
  // Parse text format: lines starting with "1", "2", "3", "4" as section headers
  const cols = {1:[],2:[],3:[],4:[]};
  let cur = null;
  text.split(/\r?\n/).forEach(line=>{
    const trimmed = line.trim();
    if(!trimmed) return;
    if(/^[1234]$/.test(trimmed)){
      cur = parseInt(trimmed);
    } else if(cur !== null){
      cols[cur].push(trimmed);
    }
  });
  return cols;
}

  const r1 = new FileReader();
  r1.onload = e => {

    if(text.includes('\uFFFD')){ const r2=new FileReader(); r2.onload=e2=>apply(e2.target.result||''); r2.readAsText(file,'windows-1252'); }
    else apply(text);
  };

}

function rollSatzbau(uid){
  const wrap = document.getElementById('dicewrap-'+uid);
  const data = satzbauWords[uid] || {1:[],2:[],3:[],4:[]};
  const hasCols = [1,2,3,4].some(i=>data[i]&&data[i].length>0);
  if(!hasCols){
    // Just toggle setup
    showSatzbauIdle(uid);
    return;
  }
  // Play plop sound
  try{const ac=new (window.AudioContext||window.webkitAudioContext)();playPop(ac,0.8);}catch(e){}
  // Animate
  if(wrap){
    wrap.style.transition='transform .12s ease-in';
    wrap.style.transform='scale(0.88)';
    setTimeout(()=>{
      wrap.style.transition='transform .22s cubic-bezier(.34,1.56,.64,1)';
      wrap.style.transform='scale(1)';
    },120);
  }
  // Bag shuffle per column: pick from bag, refill when empty
  if(!satzbauWords[uid]._bags) satzbauWords[uid]._bags={};
  const picked = [1,2,3,4].map(i=>{
    const arr = data[i]||[];
    if(!arr.length) return '';
    const bags = satzbauWords[uid]._bags;
    if(!bags[i] || bags[i].length===0){
      // Refill and shuffle
      const a=[...arr.keys()];
      for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]];}
      bags[i]=a;
    }
    return arr[bags[i].pop()];
  });
  // Render columns + keep Bearbeiten button
  const colsHtml = [0,1,2,3].filter(i=>picked[i]!=='').map((i,idx)=>{
    const val = picked[i];
    const delay = idx * 60;
    return `<div class="satzbau-col animate has-value" style="animation-delay:${delay}ms">${escHtml(val)}</div>`;
  }).join('');
  if(wrap) setTimeout(()=>{
    wrap.innerHTML = `<div style="display:flex;flex-direction:column;width:100%;height:100%;gap:.3em;"><div class="satzbau-cols" style="flex:1;">${colsHtml}</div><div style="display:flex;justify-content:flex-start;padding:0 2px;"><button id="satzbau-edit-${uid}" class="pz-file-label" style="margin-bottom:0;" data-i18n="satzbauBearbeiten">${T('satzbauBearbeiten')}</button></div></div>`;
    const _edit = document.getElementById('satzbau-edit-'+uid);
    if(_edit) _edit.addEventListener('click', e=>{ e.stopPropagation(); showSatzbauSetup(uid); });
  },120);
  // Clear result text below widget
  const res = document.getElementById('diceres-'+uid);
  if(res) res.textContent = '';
}

function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function playDiceRoll(ac, vol){
  if(!soundEnabled) return;
  // Only the final thud/settle sound
  const o=ac.createOscillator(),g2=ac.createGain();
  o.connect(g2);g2.connect(ac.destination);
  o.type='sine'; o.frequency.setValueAtTime(180,ac.currentTime);
  o.frequency.exponentialRampToValueAtTime(60,ac.currentTime+0.14);
  g2.gain.setValueAtTime(vol*0.45,ac.currentTime);
  g2.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+0.22);
  o.start(ac.currentTime); o.stop(ac.currentTime+0.25);
}

    picked=[];
    rem=[...list];
    if(left) left.textContent=T('namesNeuRunde');
  }
  const name=rem[Math.floor(Math.random()*rem.length)];
  (pickedMap[uid]=pickedMap[uid]||[]).push(name);
  if(disp){
    disp.style.color='#1e1a0e';
    disp.style.boxShadow='4px 6px 18px rgba(0,0,0,0.55), inset 0 -2px 0 rgba(0,0,0,0.08)';
    disp.style.transform='rotate(-1deg) scale(.8)';disp.style.opacity='0';
    setTimeout(()=>{
      disp.textContent=name;
      calcNameFontSize(uid, true);
      disp.style.opacity='1';disp.style.transform='rotate(-1deg) scale(1)';
    },150);
    disp.style.transition='all .2s';
  }
  const remAfter=list.filter(n=>!(pickedMap[uid]||[]).includes(n));
  if(left && left.textContent!==T('namesNeuRunde')) left.textContent=`${T('namesVerbleibend')} ${remAfter.length} ${T('namesVerbleibend2')} ${list.length}`;
  else if(left && left.textContent===T('namesNeuRunde')) setTimeout(()=>{if(left) left.textContent=`${T('namesVerbleibend')} ${remAfter.length} ${T('namesVerbleibend2')} ${list.length}`;},1200);
}
function resetNames(uid){
  pickedMap[uid]=[];
  const d=document.getElementById('namedisp-'+uid);
  if(d){ d.textContent=T('namesHierKlicken'); d.style.color='rgba(30,26,14,0.75)'; d.style.boxShadow='3px 5px 14px rgba(0,0,0,0.45), inset 0 -2px 0 rgba(0,0,0,0.06)'; _nameFontCache[uid]=null; requestAnimationFrame(()=>calcNameFontSize(uid,true)); }

}

// ── Gruppen-Anzeige für das Namen-Widget ──────────────────────────────────
function showNamenGruppen(uid, names, numGroups){

  if(existing){ existing.remove(); return; }

  // Pastel colors for groups — light backgrounds, black text

    '#fef08a','#bbf7d0','#bfdbfe','#fecaca','#e9d5ff',
    '#fed7aa','#a7f3d0','#fde68a','#c7d2fe','#fbcfe8',

  hdrTitle.textContent = `👥 ${numGroups} Gruppen — ${names.length} Namen`;
  const reshuffleBtn = document.createElement('button');
  reshuffleBtn.textContent = '🔀 Neu mischen';
  reshuffleBtn.style.cssText = 'background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.22);border-radius:10px;color:#fff;font-size:14px;font-weight:700;padding:.4em 1.1em;cursor:pointer;transition:background .15s;';

  closeBtn.onmouseleave=()=>{closeBtn.style.background='none';closeBtn.style.color='rgba(255,255,255,0.6)';};
  closeBtn.onclick=()=>overlay.remove();
  hdr.appendChild(hdrLeft);
  hdr.appendChild(closeBtn);

  const grid = document.createElement('div');
  grid.style.cssText = `display:flex;flex-wrap:wrap;gap:22px;justify-content:center;width:100%;max-width:1400px;`;

    const badge = document.createElement('div');

// Recalculates the font size of the name display to fit the longest name in the list
// Uses canvas text measurement for pixel-accurate fitting.
// The computed size is cached per uid; it is only recomputed when the widget is resized.
const _nameFontCache = {};  // uid → px size
function calcNameFontSize(uid, forceRecompute){
  const disp = document.getElementById('namedisp-' + uid);
  if(!disp) return;
  const widget = disp.closest('.widget');
  if(!widget) return;

  // Determine the longest text to fit: only real names, NOT the placeholder
  const ta = document.getElementById('namelist-' + uid);
  const names = ta ? ta.value.split('\n').map(s=>s.trim()).filter(Boolean) : [];
  const placeholder = T('namesHierKlicken');
  const curText = disp.textContent;
  const isPlaceholder = !curText || curText === placeholder || curText === '–';
  if(!isPlaceholder) names.push(curText);

  if(isPlaceholder){
    // Placeholder: fixed smaller size, no cache needed
    disp.style.fontSize = '22px';
  } else {
    // Real name: compute best fit from names list
    if(forceRecompute || _nameFontCache[uid] == null){
      const headerH = widget.querySelector('.widget-header')?.offsetHeight || 38;
      const bodyPad = 24;
      const reservedH = 80;
      const availW = (widget.offsetWidth || 290) - 40;
      const availH = Math.max(60, (widget.offsetHeight || 330) - headerH - bodyPad - reservedH);
      const cvs = document.createElement('canvas');
      const ctx = cvs.getContext('2d');
      const fontWeight = '700';
      const fontFamily = 'Caveat, cursive';
      const targetW = availW * 0.85;
      const candidates = names.length ? names : [placeholder];
      let lo = 10, hi = Math.min(availW, availH * 1.5);
      for(let i = 0; i < 18; i++){
        const mid = (lo + hi) / 2;
        ctx.font = `${fontWeight} ${mid}px ${fontFamily}`;
        const maxW = candidates.reduce((m, n) => Math.max(m, ctx.measureText(n).width), 0);
        if(maxW <= targetW && mid <= availH){ lo = mid; } else { hi = mid; }
      }
      _nameFontCache[uid] = Math.max(14, Math.floor(lo));
    }
    disp.style.fontSize = _nameFontCache[uid] + 'px';
  }
  const fs = isPlaceholder ? 22 : _nameFontCache[uid];
  void fs; // used above
  disp.style.whiteSpace = 'nowrap';
  disp.style.overflow = 'hidden';
  disp.style.textOverflow = 'clip';
  disp.style.width = '100%';
  disp.style.maxWidth = '100%';
  disp.style.minWidth = '80px';
}

// ── Interactive photo overlay for draw canvas ─────────────────────────────
const _drawPhotoState = {}; // uid → {img,x,y,w,h,dragging,resizing,...}

function insertDrawPhoto(uid, file){
  if(!file) return;
  const cv=document.getElementById('dcanvas-'+uid); if(!cv) return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{ _startDrawPhotoOverlay(uid, img); };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function _startDrawPhotoOverlay(uid, img){
  const cv=document.getElementById('dcanvas-'+uid); if(!cv) return;
  // Remove any existing overlay for this uid
  _endDrawPhotoOverlay(uid, false);

  const cvRect=cv.getBoundingClientRect();
  // Scale image to fit ~60% of canvas, centered
  const _cvR0=cv.getBoundingClientRect();
  const maxW=_cvR0.width*0.6, maxH=_cvR0.height*0.6;
  const scale=Math.min(maxW/img.naturalWidth, maxH/img.naturalHeight, 1);
  const w=Math.round(img.naturalWidth*scale);
  const h=Math.round(img.naturalHeight*scale);
  const x=Math.round((_cvR0.width-w)/2);
  const y=Math.round((_cvR0.height-h)/2);

  const ps=_drawPhotoState[uid]={img,x,y,w,h,dragging:false,resizing:false,dx:0,dy:0};

  // Overlay div — covers exactly the canvas area using fixed positioning
  const ov=document.createElement('div');
  ov.id='draw-photo-ov-'+uid;
  const _cvR=cv.getBoundingClientRect();
  ov.style.cssText=`position:fixed;left:${_cvR.left}px;top:${_cvR.top}px;width:${_cvR.width}px;height:${_cvR.height}px;z-index:20;touch-action:none;cursor:default;`;

  // Photo frame div
  const frame=document.createElement('div');
  frame.id='draw-photo-frame-'+uid;
  frame.style.cssText=`position:absolute;border:2px dashed ${_accentRgb(0.85)};border-radius:3px;box-sizing:border-box;cursor:move;user-select:none;`;

  // Resize handle (bottom-right corner)
  const rh=document.createElement('div');
  rh.style.cssText=`position:absolute;right:-6px;bottom:-6px;width:16px;height:16px;background:${_accentRgb(0.9)};border-radius:3px;cursor:nwse-resize;z-index:2;`;
  frame.appendChild(rh);

  // Commit button
  const commitBtn=document.createElement('button');
  commitBtn.textContent=T('drawEinbetten');
  commitBtn.style.cssText=`position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:${_accentHex()};color:#fff;border:none;border-radius:7px;padding:2px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.4);`;
  commitBtn.onmousedown=e=>e.stopPropagation();
  commitBtn.onclick=e=>{ e.stopPropagation(); _endDrawPhotoOverlay(uid, true); };

  // Cancel button
  const cancelBtn=document.createElement('button');
  cancelBtn.textContent='✕';
  cancelBtn.style.cssText='position:absolute;top:-30px;right:-4px;background:rgba(248,113,113,0.9);color:#fff;border:none;border-radius:7px;padding:2px 8px;font-size:12px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.3);';
  cancelBtn.onmousedown=e=>e.stopPropagation();
  cancelBtn.onclick=e=>{ e.stopPropagation(); _endDrawPhotoOverlay(uid, false); };

  frame.appendChild(commitBtn);
  frame.appendChild(cancelBtn);

  ov.appendChild(frame);

  // Append overlay to body (fixed positioning, covers canvas exactly)
  document.body.appendChild(ov);

  // Draw preview on canvas and position frame
  function syncFrame(){
    const s=_drawPhotoState[uid]; if(!s) return;
    frame.style.left=s.x+'px';
    frame.style.top=s.y+'px';
    frame.style.width=s.w+'px';
    frame.style.height=s.h+'px';
    // Draw preview — scale from CSS pixels to canvas pixels
    const ctx=cv.getContext('2d');
    const cvR=cv.getBoundingClientRect();
    const scaleX=cv.width/cvR.width, scaleY=cv.height/cvR.height;
    if(ps.snapshot) ctx.putImageData(ps.snapshot,0,0);
    ctx.globalAlpha=0.82;
    ctx.drawImage(s.img, s.x*scaleX, s.y*scaleY, s.w*scaleX, s.h*scaleY);
    ctx.globalAlpha=1;
  }

  // Reposition overlay if window resizes while overlay is open
  function repositionOverlay(){
    const r=cv.getBoundingClientRect();
    ov.style.left=r.left+'px'; ov.style.top=r.top+'px';
    ov.style.width=r.width+'px'; ov.style.height=r.height+'px';
  }
  window.addEventListener('resize', repositionOverlay);
  ps._removeReposition=()=>window.removeEventListener('resize', repositionOverlay);

  // Save canvas snapshot before touching it
  ps.snapshot=cv.getContext('2d').getImageData(0,0,cv.width,cv.height);
  syncFrame();

  // ── Drag (frame / overlay) ──
  function onDragStart(e){
    const t=e.target;
    if(t===rh||t===commitBtn||t===cancelBtn) return;
    e.preventDefault(); e.stopPropagation();
    const s=_drawPhotoState[uid]; if(!s) return;
    s.dragging=true;
    const clientX=e.touches?e.touches[0].clientX:e.clientX;
    const clientY=e.touches?e.touches[0].clientY:e.clientY;
    const ovRect=ov.getBoundingClientRect();
    s.dx=clientX-ovRect.left-s.x;
    s.dy=clientY-ovRect.top-s.y;
  }
  function onDragMove(e){
    const s=_drawPhotoState[uid]; if(!s||!s.dragging) return;
    e.preventDefault();
    const clientX=e.touches?e.touches[0].clientX:e.clientX;
    const clientY=e.touches?e.touches[0].clientY:e.clientY;
    const ovRect=ov.getBoundingClientRect();
    s.x=Math.max(0,Math.min(ov.clientWidth-s.w, clientX-ovRect.left-s.dx));
    s.y=Math.max(0,Math.min(ov.clientHeight-s.h, clientY-ovRect.top-s.dy));
    syncFrame();
  }
  function onDragEnd(){ const s=_drawPhotoState[uid]; if(s) s.dragging=false; }

  ov.addEventListener('mousedown',onDragStart);
  ov.addEventListener('touchstart',onDragStart,{passive:false});
  document.addEventListener('mousemove',onDragMove);
  document.addEventListener('touchmove',onDragMove,{passive:false});
  document.addEventListener('mouseup',onDragEnd);
  document.addEventListener('touchend',onDragEnd);
  ps._removeDrag=()=>{
    document.removeEventListener('mousemove',onDragMove);
    document.removeEventListener('touchmove',onDragMove);
    document.removeEventListener('mouseup',onDragEnd);
    document.removeEventListener('touchend',onDragEnd);
  };

  // ── Resize handle ──
  function onResizeStart(e){
    e.preventDefault(); e.stopPropagation();
    const s=_drawPhotoState[uid]; if(!s) return;
    s.resizing=true;
    const clientX=e.touches?e.touches[0].clientX:e.clientX;
    const clientY=e.touches?e.touches[0].clientY:e.clientY;
    const ovRect=ov.getBoundingClientRect();
    s._rx0=clientX; s._ry0=clientY; s._rw0=s.w; s._rh0=s.h;
  }
  function onResizeMove(e){
    const s=_drawPhotoState[uid]; if(!s||!s.resizing) return;
    e.preventDefault();
    const clientX=e.touches?e.touches[0].clientX:e.clientX;
    const clientY=e.touches?e.touches[0].clientY:e.clientY;
    const dw=clientX-s._rx0; const dh=clientY-s._ry0;
    // Keep aspect ratio
    const aspect=s.img.naturalWidth/s.img.naturalHeight;
    let newW=Math.max(40, s._rw0+dw);
    let newH=Math.round(newW/aspect);
    if(newH<30){newH=30; newW=Math.round(newH*aspect);}
    s.w=newW; s.h=newH;
    syncFrame();
  }
  function onResizeEnd(){ const s=_drawPhotoState[uid]; if(s) s.resizing=false; }

  rh.addEventListener('mousedown',onResizeStart);
  rh.addEventListener('touchstart',onResizeStart,{passive:false});
  document.addEventListener('mousemove',onResizeMove);
  document.addEventListener('touchmove',onResizeMove,{passive:false});
  document.addEventListener('mouseup',onResizeEnd);
  document.addEventListener('touchend',onResizeEnd);
  ps._removeResize=()=>{
    document.removeEventListener('mousemove',onResizeMove);
    document.removeEventListener('touchmove',onResizeMove);
    document.removeEventListener('mouseup',onResizeEnd);
    document.removeEventListener('touchend',onResizeEnd);
  };
}

function _endDrawPhotoOverlay(uid, commit){
  const ps=_drawPhotoState[uid];
  const ov=document.getElementById('draw-photo-ov-'+uid);
  if(ps){
    if(ps._removeDrag) ps._removeDrag();
    if(ps._removeResize) ps._removeResize();
    if(ps._removeReposition) ps._removeReposition();
  }
  if(ov) ov.remove();
  if(commit && ps){
    const cv=document.getElementById('dcanvas-'+uid); if(!cv) return;
    const ctx=cv.getContext('2d');
    // Restore clean snapshot first
    if(ps.snapshot) ctx.putImageData(ps.snapshot,0,0);
    // Commit with full opacity
    pushDrawUndo(uid,cv);
    const _cR=cv.getBoundingClientRect();
    const scaleX=cv.width/_cR.width, scaleY=cv.height/_cR.height;
    ctx.globalAlpha=1;
    ctx.drawImage(ps.img, ps.x*scaleX, ps.y*scaleY, ps.w*scaleX, ps.h*scaleY);
    ctx.globalAlpha=1;
  } else if(!commit && ps && ps.snapshot){
    // Restore canvas as it was before
    const cv=document.getElementById('dcanvas-'+uid);
    if(cv) cv.getContext('2d').putImageData(ps.snapshot,0,0);
  }
  delete _drawPhotoState[uid];
}
function initDraw(uid){
  const cv=document.getElementById('dcanvas-'+uid); if(!cv)return;
  const body=cv.parentElement;
  cv.width=Math.max(200,body.clientWidth-16);
  cv.height=Math.max(150,body.clientHeight-70);
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
  const st=drawStates[uid];
  // ── text state ──
  st.textActive=false; st.textX=0; st.textY=0; st.textStr='';
  st.textSnapshot=null; st.cursorVis=true; st.cursorTimer=null;

  const getP=e=>{const r=cv.getBoundingClientRect(),sx=cv.width/r.width,sy=cv.height/r.height;
    if(e.touches)return{x:(e.touches[0].clientX-r.left)*sx,y:(e.touches[0].clientY-r.top)*sy};
    return{x:(e.clientX-r.left)*sx,y:(e.clientY-r.top)*sy};};

  const stroke=(x1,y1,x2,y2)=>{ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
    if(st.tool==='eraser'){ctx.globalAlpha=1;ctx.strokeStyle='#fff';ctx.lineWidth=st.sz*3;}
    else if(st.tool==='marker'){ctx.globalAlpha=0.35;ctx.strokeStyle=st.color;ctx.lineWidth=st.sz*3.5;}
    else{ctx.globalAlpha=1;ctx.strokeStyle=st.color;ctx.lineWidth=st.sz;}
    ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();ctx.globalAlpha=1;};

  // Draw the active text + blinking cursor onto the canvas (restoring snapshot first)
  function renderTextCursor(){
    if(!st.textSnapshot) return;
    ctx.putImageData(st.textSnapshot,0,0);
    const fontEl=document.getElementById('dtextfont-'+uid);
    const sizeEl=document.getElementById('dtextsize-'+uid);
    const font=fontEl?fontEl.value:'Arial';
    const size=sizeEl?parseInt(sizeEl.value):20;
    ctx.globalAlpha=1;
    ctx.fillStyle=st.color;
    ctx.font=`${size}px ${font},sans-serif`;
    ctx.textBaseline='alphabetic';
    ctx.fillText(st.textStr, st.textX, st.textY);
    if(st.cursorVis){
      const tw=ctx.measureText(st.textStr).width;
      ctx.beginPath();
      ctx.moveTo(st.textX+tw+1, st.textY-size*0.85);
      ctx.lineTo(st.textX+tw+1, st.textY+size*0.2);
      ctx.strokeStyle=st.color; ctx.lineWidth=1.5; ctx.globalAlpha=0.85;
      ctx.stroke(); ctx.globalAlpha=1;
    }
  }
  function startCursorBlink(){
    stopCursorBlink();
    st.cursorVis=true;
    st.cursorTimer=setInterval(()=>{st.cursorVis=!st.cursorVis; renderTextCursor();},530);
  }
  function stopCursorBlink(){
    if(st.cursorTimer){clearInterval(st.cursorTimer);st.cursorTimer=null;}
  }
  // Commit text to canvas permanently
  function commitText(){
    if(!st.textActive) return;
    stopCursorBlink();
    pushDrawUndo(uid,cv);
    if(st.textStr.trim()!==''){
      // Draw final text without cursor onto snapshot, then apply
      ctx.putImageData(st.textSnapshot,0,0);
      const fontEl=document.getElementById('dtextfont-'+uid);
      const sizeEl=document.getElementById('dtextsize-'+uid);
      const font=fontEl?fontEl.value:'Arial';
      const size=sizeEl?parseInt(sizeEl.value):20;
      ctx.globalAlpha=1; ctx.fillStyle=st.color;
      ctx.font=`${size}px ${font},sans-serif`;
      ctx.textBaseline='alphabetic';
      ctx.fillText(st.textStr, st.textX, st.textY);
    } else {
      // Nothing typed – restore snapshot
      ctx.putImageData(st.textSnapshot,0,0);
    }
    st.textActive=false; st.textStr=''; st.textSnapshot=null;
  }
  // expose for setDrawTool
  drawStates[uid]._commitText=commitText;

  // ── mouse / touch ──
  cv.addEventListener('mousedown',e=>{
    const p=getP(e);
    if(st.tool==='text'){
      // Commit previous text first
      commitText();
      // Start new text at click position
      st.textSnapshot=ctx.getImageData(0,0,cv.width,cv.height);
      st.textX=p.x; st.textY=p.y; st.textStr=''; st.textActive=true;
      st.cursorVis=true;
      renderTextCursor();
      startCursorBlink();
      cv.focus();
      return;
    }
    pushDrawUndo(uid,cv);
    st.drawing=true;st.lx=p.x;st.ly=p.y;
  });
  cv.addEventListener('mousemove',e=>{if(!st.drawing)return;const p=getP(e);stroke(st.lx,st.ly,p.x,p.y);st.lx=p.x;st.ly=p.y;});
  cv.addEventListener('mouseup',()=>st.drawing=false);
  cv.addEventListener('mouseleave',()=>st.drawing=false);
  cv.addEventListener('touchstart',e=>{
    e.preventDefault();
    const p=getP(e);
    if(st.tool==='text'){
      commitText();
      st.textSnapshot=ctx.getImageData(0,0,cv.width,cv.height);
      st.textX=p.x; st.textY=p.y; st.textStr=''; st.textActive=true;
      st.cursorVis=true; renderTextCursor(); startCursorBlink();
      cv.focus(); return;
    }
    pushDrawUndo(uid,cv);
    st.drawing=true;st.lx=p.x;st.ly=p.y;
  },{passive:false});
  cv.addEventListener('touchmove',e=>{e.preventDefault();if(!st.drawing)return;const p=getP(e);stroke(st.lx,st.ly,p.x,p.y);st.lx=p.x;st.ly=p.y;},{passive:false});
  cv.addEventListener('touchend',()=>st.drawing=false);

  // ── keyboard for text tool ──
  cv.setAttribute('tabindex','0');
  cv.style.outline='none';
  cv.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&(e.key==='z'||e.key==='Z')){e.preventDefault();undoDraw(uid);return;}
    if(!st.textActive) return;
    e.preventDefault();
    if(e.key==='Escape'||e.key==='Enter'){
      commitText(); return;
    }
    if(e.key==='Backspace'){
      if(st.textStr.length>0) st.textStr=st.textStr.slice(0,-1);
    } else if(e.key.length===1){
      st.textStr+=e.key;
    }
    renderTextCursor();
  });
}
function pushDrawUndo(uid,cv){
  const st=drawStates[uid]; if(!st||!cv)return;
  const ctx=cv.getContext('2d');
  const snap=ctx.getImageData(0,0,cv.width,cv.height);
  st.undoStack.push(snap);
  if(st.undoStack.length>40) st.undoStack.shift(); // limit memory
  const btn=document.getElementById('dbtn-undo-'+uid);
  if(btn) btn.style.opacity='1';
}
function undoDraw(uid){
  const st=drawStates[uid]; if(!st)return;
  const cv=document.getElementById('dcanvas-'+uid); if(!cv)return;
  if(st.undoStack.length===0)return;
  const snap=st.undoStack.pop();
  const ctx=cv.getContext('2d');
  ctx.putImageData(snap,0,0);
  const btn=document.getElementById('dbtn-undo-'+uid);
  if(btn) btn.style.opacity=st.undoStack.length===0?'0.4':'1';
}
function resizeDrawCanvas(cv){
  if(!cv)return;
  // Save current content at original pixel size (no stretching)
  const offscreen=document.createElement('canvas');
  offscreen.width=cv.width; offscreen.height=cv.height;
  if(offscreen.width>0&&offscreen.height>0){
    offscreen.getContext('2d').drawImage(cv,0,0);
  }
  const body=cv.parentElement;
  const newW=Math.max(100,body.clientWidth-16);
  const newH=Math.max(100,body.clientHeight-70);
  cv.width=newW; cv.height=newH;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,newW,newH);
  // Restore at original size — no stretching, content stays exactly where it was
  if(offscreen.width>0&&offscreen.height>0){
    try{ ctx.drawImage(offscreen,0,0,offscreen.width,offscreen.height); }catch(e){}
  }
}
function setDrawTool(uid,tool,btn){
  if(drawStates[uid]) drawStates[uid].tool=tool;
  btn.closest('.widget-body').querySelectorAll('.draw-tool-btn').forEach(b=>b.classList.remove('active-tool'));
  btn.classList.add('active-tool');
  const textOpts=document.getElementById('dtool-text-opts-'+uid);
  const szSel=document.getElementById('dtool-sz-'+uid);
  if(textOpts) textOpts.style.display=(tool==='text')?'flex':'none';
  if(szSel) szSel.style.display=(tool==='text')?'none':'';
  // If switching away from text tool, commit any active text
  if(tool!=='text' && drawStates[uid]){
    commitDrawText(uid);
    const cv=document.getElementById('dcanvas-'+uid);
    if(cv) cv.style.cursor=(tool==='eraser')?'cell':'crosshair';
  } else if(tool==='text'){
    const cv=document.getElementById('dcanvas-'+uid);
    if(cv) cv.style.cursor='text';
  }
}
function setDColor(uid,color,el){
  if(drawStates[uid])drawStates[uid].color=color;
  el.closest('.widget-body').querySelectorAll('.color-dot').forEach(d=>d.classList.remove('selected'));
  el.classList.add('selected');
}
function commitDrawText(uid){
  const st=drawStates[uid]; if(!st) return;
  if(st._commitText) st._commitText();
}
function updateDrawTextCursor(uid){
  // Re-render cursor when font/size changes while text is active
  const st=drawStates[uid]; if(!st||!st.textActive) return;
  const cv=document.getElementById('dcanvas-'+uid); if(!cv) return;
  const ctx=cv.getContext('2d');
  const fontEl=document.getElementById('dtextfont-'+uid);
  const sizeEl=document.getElementById('dtextsize-'+uid);
  const font=fontEl?fontEl.value:'Arial';
  const size=sizeEl?parseInt(sizeEl.value):20;
  if(st.textSnapshot) ctx.putImageData(st.textSnapshot,0,0);
  ctx.globalAlpha=1; ctx.fillStyle=st.color;
  ctx.font=`${size}px ${font},sans-serif`;
  ctx.textBaseline='alphabetic';
  ctx.fillText(st.textStr, st.textX, st.textY);
  const tw=ctx.measureText(st.textStr).width;
  ctx.beginPath();
  ctx.moveTo(st.textX+tw+1, st.textY-size*0.85);
  ctx.lineTo(st.textX+tw+1, st.textY+size*0.2);
  ctx.strokeStyle=st.color; ctx.lineWidth=1.5; ctx.stroke();
}
function clearDraw(uid){const cv=document.getElementById('dcanvas-'+uid);if(!cv)return;commitDrawText(uid);const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);}
function saveDraw(uid){commitDrawText(uid);const cv=document.getElementById('dcanvas-'+uid);if(!cv)return;const a=document.createElement('a');a.download='zeichnung.png';a.href=cv.toDataURL('image/png');a.click();}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, function(ch){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[ch];
  });
}
const CARD_MIXER_NAMES = [
  'Ken','Maria','Yuki','Tom','Sara','Leo','Anna','Ben','Emma','Daichi',
  'Clara','Finn','Hana','Jonas','Mika','Nora','Sofia','Alex','Julia','Marco'
];
const cardMixerStates = {};

function cardMixerBindButtons(uid){

  bind("cardmixer-full", showCardMixerFullscreen);
}
function cardMixerCards(count){
  return CARD_MIXER_NAMES.slice(0,count).map((name,i)=>({num:i+1,name}));
}
function cardMixerCardHtml(c){
  return `<span class="cardmixer-card"><span class="cardmixer-num">${c.num}</span><span class="cardmixer-name">${escapeHtml(c.name)}</span></span>`;
}
function cardMixerSetCount(uid){
  const st=cardMixerStates[uid]; const inp=document.getElementById('cardmixer-count-'+uid); if(!st||!inp)return;
  let n=parseInt(inp.value,10); if(!Number.isFinite(n)) n=1; n=Math.max(1,Math.min(20,n));
  st.count=n; inp.value=n; st.groups=[]; cardMixerRender(uid);
}
function cardMixerMinus(uid){ const inp=document.getElementById('cardmixer-count-'+uid); if(inp){ inp.value=Math.max(1,(parseInt(inp.value,10)||1)-1); cardMixerSetCount(uid); } }
function cardMixerPlus(uid){ const inp=document.getElementById('cardmixer-count-'+uid); if(inp){ inp.value=Math.min(20,(parseInt(inp.value,10)||1)+1); cardMixerSetCount(uid); } }
function cardMixerShuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function cardMixerPairs(uid){
  const st=cardMixerStates[uid]; if(!st)return; st.mode='pairs';
  const a=cardMixerShuffle(cardMixerCards(st.count)); st.groups=[];
  for(let i=0;i<a.length;i+=2) st.groups.push(a.slice(i,i+2));
  if(st.groups.length>1 && st.groups[st.groups.length-1].length===1){ st.groups[st.groups.length-2].push(st.groups.pop()[0]); }
  cardMixerRender(uid);
  cardMixerScrollToResult(uid);
}
function cardMixerGroups3(uid){
  const st=cardMixerStates[uid]; if(!st)return; st.mode='groups3';
  const a=cardMixerShuffle(cardMixerCards(st.count)); st.groups=[];
  for(let i=0;i<a.length;i+=3) st.groups.push(a.slice(i,i+3));
  cardMixerRender(uid);
  cardMixerScrollToResult(uid);
}
function cardMixerRepeat(uid){ const st=cardMixerStates[uid]; if(!st)return; if(st.mode==='groups3') cardMixerGroups3(uid); else cardMixerPairs(uid); }
function cardMixerScrollToResult(uid){
  const r=document.getElementById('cardmixer-result-'+uid);
  if(r){ try{ r.scrollIntoView({block:'nearest',behavior:'smooth'}); }catch(_){ r.scrollIntoView(); } }
}
function cardMixerEnsureSession(uid){
  const st=cardMixerStates[uid]; if(!st)return 'demo';

  return st.sessionId;
}
function cardMixerBaseUrl(){

}
function cardMixerRoomId(uid,idx){

}
function cardMixerRoomUrl(uid,idx){
  return cardMixerBaseUrl()+'?room='+encodeURIComponent(cardMixerRoomId(uid,idx));
}
function cardMixerRenderQrs(uid){
  if(!window.QRious){ loadQRious(()=>cardMixerRenderQrs(uid)); return; }
  const box=document.getElementById('cardmixer-result-'+uid); if(!box)return;
  box.querySelectorAll('canvas[data-room-url]').forEach(cv=>{
    try{ new QRious({element:cv,value:cv.dataset.roomUrl,size:190,background:'white',foreground:'#000'}); }catch(_){ }
  });
}
function cardMixerRender(uid){
  const st=cardMixerStates[uid]; if(!st)return;
  const activeMax=document.getElementById('cardmixer-active-max-'+uid); if(activeMax) activeMax.textContent=st.count;

// LIVE-SCHREIBRAUM (Firebase-ready)
// Firebase-Konfiguration hier einsetzen. Ohne diese Daten läuft nur lokale Demo.
// Beispiel:
// window.KLASSEN_FIREBASE_CONFIG = { apiKey:"...", authDomain:"...", databaseURL:"...", projectId:"..." };
// ════════════════════════════════════════════════
window.KLASSEN_FIREBASE_CONFIG = window.KLASSEN_FIREBASE_CONFIG || null;
let liveRoomId=null, liveRoomDb=null, liveRoomIgnore=false;
function liveRoomBackToBoard(){ location.href=location.href.split('?')[0]; }
function liveRoomHasFirebaseConfig(){
  const c=window.KLASSEN_FIREBASE_CONFIG;
  return c && c.apiKey && c.databaseURL && String(c.apiKey).indexOf('DEIN_')<0;
}
function liveRoomSetStatus(txt){ const el=document.getElementById('live-room-status'); if(el)el.textContent=txt; }
function liveRoomLoadScript(src){ return new Promise((resolve,reject)=>{ const s=document.createElement('script'); s.src=src; s.onload=resolve; s.onerror=reject; document.head.appendChild(s); }); }
async function liveRoomInitFirebase(){
  if(!liveRoomHasFirebaseConfig()) return false;
  if(!window.firebase){
    await liveRoomLoadScript('https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js');
    await liveRoomLoadScript('https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js');
  }
  if(!firebase.apps.length) firebase.initializeApp(window.KLASSEN_FIREBASE_CONFIG);
  liveRoomDb=firebase.database();
  return true;
}
async function liveRoomStart(){
  const params=new URLSearchParams(location.search);
  liveRoomId=params.get('room');
  if(!liveRoomId) return;
  const page=document.getElementById('live-room-page');
  const title=document.getElementById('live-room-title');
  const txt=document.getElementById('live-room-text');
  if(page) page.style.display='flex';
  if(title) title.textContent='✏️ Schreibraum: '+liveRoomId;
  try{
    const ok=await liveRoomInitFirebase();
    if(!ok){
      liveRoomSetStatus('Lokale Demo: Firebase ist noch nicht verbunden. Auf zwei Handys nicht synchron.');
      const saved=localStorage.getItem('live-room-'+liveRoomId)||'';
      if(txt) txt.value=saved;
      return;
    }
    liveRoomSetStatus('Live verbunden. Beide Schüler schreiben im selben Raum.');
    liveRoomDb.ref('rooms/'+liveRoomId+'/text').on('value',snap=>{
      if(!txt)return; liveRoomIgnore=true; txt.value=snap.val()||''; setTimeout(()=>liveRoomIgnore=false,0);
    });
  }catch(e){
    liveRoomSetStatus('Firebase-Verbindung fehlgeschlagen. Prüfe die Firebase-Daten.');
  }
}
function liveRoomSend(){
  if(!liveRoomId || liveRoomIgnore) return;
  const txt=document.getElementById('live-room-text'); if(!txt)return;
  if(liveRoomDb){ liveRoomDb.ref('rooms/'+liveRoomId+'/text').set(txt.value); }
  else{ localStorage.setItem('live-room-'+liveRoomId,txt.value); }
}
setTimeout(liveRoomStart,100);

function tpFormat(e, uid, cmd){

function updateTPBtnStates(uid){
  const boldBtn=document.getElementById('tp-bold-'+uid);
  const italicBtn=document.getElementById('tp-italic-'+uid);
  const underlineBtn=document.getElementById('tp-underline-'+uid);
  const isBold=document.queryCommandState('bold');
  const isItalic=document.queryCommandState('italic');
  const isUnderline=document.queryCommandState('underline');
  if(boldBtn){boldBtn.style.background=isBold?_accentRgb(0.35):'var(--bg3)';boldBtn.style.borderColor=isBold?'var(--accent)':'rgba(255,255,255,0.15)';}

  if(underlineBtn){underlineBtn.style.background=isUnderline?_accentRgb(0.35):'var(--bg3)';underlineBtn.style.borderColor=isUnderline?'var(--accent)':'rgba(255,255,255,0.15)';}
  // Highlight link button when cursor is inside a link
  const linkBtn=document.getElementById('tp-link-'+uid);
  if(linkBtn){
    const sel=window.getSelection();
    const inLink=sel&&sel.rangeCount&&(sel.anchorNode)&&(sel.anchorNode.nodeType===3?sel.anchorNode.parentElement:sel.anchorNode).closest('a');
    linkBtn.style.background=inLink?_accentRgb(0.35):'var(--bg3)';

    try{
      const sel2=window.getSelection();
      if(sel2&&sel2.rangeCount){
        const node=sel2.anchorNode;
        const el2=node?(node.nodeType===3?node.parentElement:node):null;
        if(el2){
          const ff=window.getComputedStyle(el2).fontFamily||'';
          const name=ff.split(',')[0].replace(/['"]/g,'').trim();
          // Match to an option
          for(const opt of fontSel.options){
            if(opt.value.toLowerCase()===name.toLowerCase()){fontSel.value=opt.value;break;}
          }
        }
      }
    }catch(_){}
  }
}
function updateTPLines(uid){
  const el=document.getElementById('textpad-'+uid);

  if(!el||!ln) return;
  // Count lines by splitting innerText on newlines; always at least 1
  const lines=(el.innerText||'').split('\n');
  // The last element from split is often '' due to trailing newline – still counts as a line if non-empty or only one
  const count=Math.max(1, lines[lines.length-1]==='' ? lines.length-1 : lines.length);
  const lh=parseFloat(getComputedStyle(el).lineHeight)||25.6;
  ln.style.fontSize=getComputedStyle(el).fontSize;
  let nums='';
  for(let i=1;i<=count;i++) nums+=(i<count?i+'\n':i);
  ln.textContent=nums;
  // Keep line gutter same scroll position
  ln.scrollTop=el.scrollTop;
}

// ── Hyperlink helpers ──────────────────────────────────────────────────────
// Saved selection for link dialog (focus leaves editor when dialog opens)
const _tpLinkSel={};

function tpLinkClick(e, uid){
  e.preventDefault();
  const el=document.getElementById('textpad-'+uid);
  if(!el) return;
  // Check if cursor is inside an existing link → offer to remove
  const sel=window.getSelection();
  if(sel && sel.rangeCount){
    const anc=sel.anchorNode;
    const linkEl=anc && (anc.nodeType===3 ? anc.parentElement : anc).closest('a');
    if(linkEl){
      // toggle: remove the link
      tpUnlink(uid, linkEl);
      updateTPBtnStates(uid);
      return;
    }
  }
  // Save selection before dialog steals focus
  if(sel && sel.rangeCount) _tpLinkSel[uid]=sel.getRangeAt(0).cloneRange();
  // Pre-fill URL field with selected text if it looks like a URL
  const selText=(sel&&!sel.isCollapsed) ? sel.toString().trim() : '';
  const prefill=/^https?:\/\//i.test(selText) ? selText : 'https://';
  tpShowLinkDialog(uid, prefill);
}

function tpShowLinkDialog(uid, prefill){
  // Remove any existing dialog
  document.getElementById('tp-link-dialog-'+uid)?.remove();
  const dlg=document.createElement('div');
  dlg.id='tp-link-dialog-'+uid;
  dlg.style.cssText='position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.55);';
  dlg.innerHTML=`
    <div style="background:var(--card);border:1px solid rgba(255,255,255,0.15);border-radius:14px;padding:20px 22px;min-width:300px;max-width:420px;width:90%;box-shadow:0 8px 40px rgba(0,0,0,0.6);display:flex;flex-direction:column;gap:12px;">
      <div style="font-weight:700;font-size:1em;color:var(--text);">${T('tpLinkDialogTitel')}</div>
      <input id="tp-link-url-${uid}" type="text" value="${prefill.replace(/"/g,'&quot;')}"
        style="background:var(--bg3);border:1px solid rgba(255,255,255,0.15);border-radius:8px;padding:.45em .7em;color:var(--text);font-size:.95em;outline:none;width:100%;box-sizing:border-box;"
        placeholder="${T('tpLinkDialogPlaceholder')}"
        onkeydown="if(event.key==='Enter'){event.preventDefault();tpInsertLink(${uid});}if(event.key==='Escape'){document.getElementById('tp-link-dialog-${uid}')?.remove();}">
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button onmousedown="event.preventDefault();document.getElementById('tp-link-dialog-${uid}')?.remove();"
          style="background:var(--bg3);border:1px solid rgba(255,255,255,0.12);color:var(--text2);border-radius:8px;padding:.4em 1em;cursor:pointer;font-size:.88em;">${T('tpLinkDialogAbbrechen')}</button>
        <button onmousedown="event.preventDefault();tpInsertLink(${uid});"
          style="background:var(--accent);border:none;color:#fff;border-radius:8px;padding:.4em 1.1em;cursor:pointer;font-size:.88em;font-weight:700;">${T('tpLinkDialogEinfuegen')}</button>
      </div>
    </div>`;
  document.body.appendChild(dlg);
  // Select all text in input for easy replacement
  setTimeout(()=>{
    const inp=document.getElementById('tp-link-url-'+uid);
    if(inp){inp.focus();inp.select();}
  },30);
}

function tpInsertLink(uid){
  const dlg=document.getElementById('tp-link-dialog-'+uid);
  const inp=document.getElementById('tp-link-url-'+uid);
  if(!inp) return;
  let url=inp.value.trim();
  dlg?.remove();
  if(!url) return;
  // Auto-prepend https:// if no protocol given
  if(!/^[a-z][a-z0-9+\-.]*:\/\//i.test(url)) url='https://'+url;

  const el=document.getElementById('textpad-'+uid);
  if(!el) return;
  el.focus();
  // Restore saved selection
  const saved=_tpLinkSel[uid];
  if(saved){
    const sel=window.getSelection();
    sel.removeAllRanges();
    sel.addRange(saved);
    delete _tpLinkSel[uid];
  }
  const sel=window.getSelection();
  if(!sel||!sel.rangeCount) return;
  const range=sel.getRangeAt(0);
  const a=document.createElement('a');
  a.href=url;
  a.title=url;
  a.style.color='#4a8fff';
  a.style.cursor='pointer';
  a.target='_blank';
  a.rel='noopener noreferrer';
  if(!range.collapsed){
    try{ range.surroundContents(a); }
    catch(err){
      // Fallback: wrap via execCommand then fix up
      document.execCommand('createLink', false, url);
      el.querySelectorAll('a[href="'+url+'"]').forEach(lnk=>{
        lnk.style.color='#4a8fff';
        lnk.target='_blank';
        lnk.rel='noopener noreferrer';
      });
    }
  } else {
    // No selection → insert link with URL as text
    a.textContent=url;
    range.insertNode(a);
    // Move caret after link
    const r2=document.createRange();
    r2.setStartAfter(a); r2.collapse(true);
    sel.removeAllRanges(); sel.addRange(r2);
  }
  updateTPCounter(uid);
  updateTPLines(uid);
}

function tpUnlink(uid, linkEl){
  // Replace <a> with its text content
  const el=document.getElementById('textpad-'+uid);
  if(!el) return;
  const parent=linkEl.parentNode;
  while(linkEl.firstChild) parent.insertBefore(linkEl.firstChild, linkEl);
  parent.removeChild(linkEl);
}

// Ctrl+click opens link in new tab; regular click just positions cursor
function _tpEditorClick(e, uid){
  if(e.ctrlKey||e.metaKey){
    const a=(e.target).closest('a[href]');
    if(a){ e.preventDefault(); window.open(a.href,'_blank','noopener'); }
  }
}
function tpFontSelectHandler(uid, sel){
  const font=sel.value;
  if(!font) return;
  tpInlineFont(uid, font);
}
function tpInlineFont(uid, font){
  const el=document.getElementById('textpad-'+uid);
  if(!el) return;
  el.focus();
  // Restore saved selection
  const saved=_tpSavedSel[uid];
  if(saved){
    const s=window.getSelection();
    s.removeAllRanges();
    s.addRange(saved);
    delete _tpSavedSel[uid];
  }
  const sel=window.getSelection();
  if(!sel||!sel.rangeCount) return;
  const range=sel.getRangeAt(0);
  if(!range.collapsed){
    // Wrap selection in a span with font-family
    const span=document.createElement('span');
    span.style.fontFamily=font+',sans-serif';

        f.parentNode.replaceChild(s,f);
      });

    // Collapse to end
    const r2=document.createRange();
    r2.selectNodeContents(span);
    r2.collapse(false);
    sel.removeAllRanges();
    sel.addRange(r2);
  } else {
    // No selection: set font for subsequent typing via a zero-width span
    const span=document.createElement('span');
    span.style.fontFamily=font+',sans-serif';
    span.appendChild(document.createTextNode('​'));
    range.insertNode(span);
    const r2=document.createRange();

function tpInlineSize(uid,px){
  const el=document.getElementById('textpad-'+uid);
  if(!el) return;

  // Restore saved selection if any
  const saved=_tpSavedSel[uid];
  if(saved){

  }
  const sel=window.getSelection();
  if(!sel||!sel.rangeCount) return;
  const range=sel.getRangeAt(0);
  if(!range.collapsed){
    // Text is selected → wrap selection in a span with the desired font-size
    const span=document.createElement('span');
    span.style.fontSize=px+'px';
    try{ range.surroundContents(span); }catch(e){
      // surroundContents fails when selection crosses elements – use execCommand fallback
      document.execCommand('fontSize',false,'7');
      el.querySelectorAll('font[size="7"]').forEach(f=>{
        const s=document.createElement('span');
        s.style.fontSize=px+'px';
        while(f.firstChild) s.appendChild(f.firstChild);
        f.parentNode.replaceChild(s,f);
      });
    }
    // Collapse selection to end of inserted span
    const newRange=document.createRange();
    newRange.selectNodeContents(span);
    newRange.collapse(false);
    sel.removeAllRanges();
    sel.addRange(newRange);
  } else {
    // No selection → insert a zero-width span; next typed characters inherit its size
    const span=document.createElement('span');
    span.style.fontSize=px+'px';
    span.appendChild(document.createTextNode('​')); // zero-width space as anchor
    range.insertNode(span);

    const newRange=document.createRange();

function saveTPasRtf(uid){
  const el=document.getElementById('textpad-'+uid);
  if(!el) return;

  // Escape a plain text string for RTF
  function escRtf(str){
    let out='';
    for(let i=0;i<str.length;i++){
      const c=str[i];
      if(c==='\\') out+='\\\\';
      else if(c==='{') out+='\\{';
      else if(c==='}') out+='\\}';
      else if(c==='\n') out+='\\line ';
      else if(c==='\r'){ /* skip */ }
      else {
        const code=c.charCodeAt(0);
        if(code>127) out+= code<=255 ? `\\'${code.toString(16).padStart(2,'0')}` : `\\u${code}?`;
        else out+=c;
      }
    }
    return out;
  }
  // Walk the DOM and convert to RTF tokens
  // parentHp = inherited half-point size from parent (emit \fsN only on change)
  function nodeToRtf(node, parentHp){
    if(parentHp===undefined) parentHp=containerHalfPts;
    if(node.nodeType===3){
      const t=node.textContent.replace(/\u200B/g,'');
      return t ? escRtf(t) : '';
    }
    if(node.nodeType!==1) return '';
    const tag=node.tagName.toUpperCase();
    if(tag==='BR') return '\\line ';
    const cs=window.getComputedStyle(node);
    const isBold= parseInt(cs.fontWeight)>=600 || tag==='B' || tag==='STRONG';
    const isItalic= cs.fontStyle==='italic' || tag==='I' || tag==='EM';
    const isUnderline= cs.textDecoration.includes('underline') || tag==='U';
    const isLink= tag==='A';
    const linkHref= isLink ? (node.getAttribute('href')||'') : '';
    const nodeFontRaw=(cs.fontFamily||'').split(',')[0].replace(/['"]/g,'').trim();
    const nodeFontIdx= nodeFontRaw && nodeFontRaw!==containerFont ? rtfFonts.indexOf(nodeFontRaw) : -1;
    const fontChanged= nodeFontIdx>0;
    const nodePx=parseFloat(cs.fontSize)||0;
    const nodeHp=nodePx>0 ? Math.round(nodePx*1.5) : 0;
    const sizeChanged=nodeHp>0 && nodeHp!==parentHp;
    let inner='';
    node.childNodes.forEach(n=>{ inner+=nodeToRtf(n, sizeChanged ? nodeHp : parentHp); });
    if(tag==='P'||tag==='DIV') inner+=inner.length ? '\\par ' : '';
    if(isUnderline) inner=`{\\ul ${inner}}`;
    if(isItalic) inner=`{\\i ${inner}}`;
    if(isBold)   inner=`{\\b ${inner}}`;
    if(isLink && linkHref) inner=`{\\field{\\*\\fldinst HYPERLINK "${linkHref.replace(/\\/g,'\\\\').replace(/"/g,'\\"')}"}{\\fldrslt\\ul\\cf2 ${inner}}}`;
    if(sizeChanged) inner=`{\\fs${nodeHp} ${inner}}`;
    if(fontChanged && nodeFontIdx>0) inner=`{\\f${nodeFontIdx} ${inner}}`;
    return inner;
  }

  // Detect base font from container style
  const containerFont=(el.style.fontFamily||'Arial').replace(/['"]/g,'').split(',')[0].trim();
  const containerSizePx=parseFloat(window.getComputedStyle(el).fontSize)||16;
  const containerHalfPts=Math.round(containerSizePx*1.5);
  const halfPts=containerHalfPts; // px -> half-points (1pt=1.333px) // px → half-points (1pt=1.333px)

  // Collect all font families used in the document
  const _collectFonts=(n,set)=>{ if(n.nodeType===1){const ff=(window.getComputedStyle(n).fontFamily||'').split(',')[0].replace(/['"]/g,'').trim();if(ff)set.add(ff);n.childNodes.forEach(c=>_collectFonts(c,set));} };
  const fontSet=new Set([containerFont]);
  _collectFonts(el,fontSet);
  const rtfFonts=[...fontSet];
  const _rtfFontClass=(f)=>{
    const n=f.toLowerCase();
    if(n.includes('comic')||n.includes('cursive')||n.includes('script')) return '\\fscript';
    if(n.includes('arial')||n.includes('helvetica')||n.includes('verdana')||n.includes('nunito')) return '\\fswiss';
    if(n.includes('courier')||n.includes('mono')) return '\\fmodern';
    return '\\froman';
  };
  const fontTableEntries=rtfFonts.map((f,i)=>`{\\f${i}${_rtfFontClass(f)}\\fcharset0 ${f};}`).join('');
  const fontTable=`{\\fonttbl${fontTableEntries}}`;
  const colorTable=`{\\colortbl ;\\red17\\green17\\blue17;\\red74\\green143\\blue255;}`;
  const body=nodeToRtf(el);

  const rtf=`{\\rtf1\\ansi\\deff0
${fontTable}
${colorTable}
\\f0\\fs${halfPts}\\cf1
${body}
}`;

  const blob=new Blob([rtf],{type:'application/rtf'});
  const a=document.createElement('a');
  a.download='text.rtf';
  a.href=URL.createObjectURL(blob);
  a.click();
  URL.revokeObjectURL(a.href);
}

    const href=a.getAttribute('href')||'';

function handleTPKeydown(e,uid){
  if((e.ctrlKey||e.metaKey)&&(e.key==='b'||e.key==='B')){e.preventDefault();document.execCommand('bold',false,null);updateTPBtnStates(uid);}
  if((e.ctrlKey||e.metaKey)&&(e.key==='i'||e.key==='I')){e.preventDefault();document.execCommand('italic',false,null);updateTPBtnStates(uid);}
  if((e.ctrlKey||e.metaKey)&&(e.key==='u'||e.key==='U')){e.preventDefault();document.execCommand('underline',false,null);updateTPBtnStates(uid);}
  if((e.ctrlKey||e.metaKey)&&(e.key==='k'||e.key==='K')){e.preventDefault();tpLinkClick(e,uid);}
  // On Enter: carry current font-size into the new line
  if(e.key==='Enter' && !e.shiftKey && !e.ctrlKey && !e.metaKey){
    const el=document.getElementById('textpad-'+uid);
    if(el){
      const sel=window.getSelection();
      if(sel&&sel.rangeCount){
        const node=sel.anchorNode;
        const refEl=node?(node.nodeType===3?node.parentElement:node):null;
        const computedSize=refEl?parseFloat(window.getComputedStyle(refEl).fontSize):null;
        const editorDefaultSize=parseFloat(window.getComputedStyle(el).fontSize)||16;
        if(computedSize && Math.round(computedSize)!==Math.round(editorDefaultSize)){
          e.preventDefault();
          document.execCommand('insertParagraph',false,null);
          const span=document.createElement('span');
          span.style.fontSize=Math.round(computedSize)+'px';
          span.appendChild(document.createTextNode('​'));
          const newSel=window.getSelection();
          if(newSel&&newSel.rangeCount){
            const r=newSel.getRangeAt(0);
            r.insertNode(span);
            const r2=document.createRange();
            r2.setStart(span.firstChild,1);
            r2.collapse(true);
            newSel.removeAllRanges();
            newSel.addRange(r2);
          }
          updateTPCounter(uid);
          return;
        }
      }
    }
  }
  // Update button state on any keyup too
  setTimeout(()=>updateTPBtnStates(uid),0);
}

function _fbReady(){
  return new Promise((resolve, reject) => {
    if(window._fbDbInstance) return resolve(window._fbDbInstance);
    let tries = 0;
    const t = setInterval(() => {
      if(window._fbDbInstance){ clearInterval(t); resolve(window._fbDbInstance); }
      else if(++tries > 100){ clearInterval(t); reject(new Error('Firebase nicht geladen – Internetverbindung prüfen')); }
    }, 100);
  });
}

function _fbListenPinboard(callback, group){
  let _ref = null, _handler = null, _unsubCalled = false;
  _fbReady().then(db => {
    if(_unsubCalled) return;
    const g = group || _STICKY_SESSION_GROUP;
    _ref = db.ref('pinboard/' + g);
    _handler = snap => {

      callback(val ? Object.values(val) : []);

  });

// Listener für ALLE Gruppen (Admin) — flacht alle Einträge mit _group-Feld ab
function _fbListenAllPinboard(callback){
  let _ref = null, _handler = null, _unsubCalled = false;
  _fbReady().then(db => {
    if(_unsubCalled) return;
    _ref = db.ref('pinboard');
    _handler = snap => {
      const val = snap.val() || {};
      const entries = [];
      Object.entries(val).forEach(([group, notes]) => {
        if(notes) Object.values(notes).forEach(e => entries.push(Object.assign({}, e, {_group: group})));
      });
      callback(entries);
    };
    _ref.on('value', _handler);
  });
  return () => { _unsubCalled = true; if(_ref && _handler) _ref.off('value', _handler); };
}
