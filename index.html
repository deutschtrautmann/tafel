// ── Eigene Notiz speichern / abschicken ──
async function savePinNote(uid){
  const isJa = document.documentElement.lang === 'ja';
  const ta = document.getElementById('pin-edit-ta-'+uid);
  const st = pinboardState[uid];
  if(!ta || !st) return;
  if(!ta.value.trim()){ _stickyShowStatus(isJa ? '⚠️ Notiz ist leer' : '⚠️ Notiz ist leer', '#fbbf24'); return; }
  _stickyShowStatus(isJa ? '⏳ 保存中 …' : '⏳ Speichere …', '#a78bfa');
  try {
    const color = st.color || STICKY_COLORS[0];
    if(st.noteId){
      const db = await _fbReady();
      const snap = await db.ref('pinboard/' + _STICKY_SESSION_GROUP + '/' + st.noteId).once('value');
      const existing = snap.val() || {};
      await _fbUpdateEntry(Object.assign({}, existing, { text: ta.value, colorId: color.id, ts: Date.now() }));
    } else {
      const nid = 'p' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
      await _fbUpdateEntry({
        noteId: nid, sessionId: _STICKY_SESSION_ID, text: ta.value, colorId: color.id,
        x: Math.round(Math.random()*70*10)/10, y: Math.round(Math.random()*65*10)/10,
        rot: Math.round((Math.random()*16-8)*10)/10, ts: Date.now()
      });
      st.noteId = nid;
    }
    st.lastSyncedText = ta.value;
    _stickyShowStatus(isJa ? '✅ 投稿しました！' : '✅ Notizzettel abgeschickt!', '#4ade80');
  } catch(e){ _stickyShowStatus('❌ ' + e.message, '#f87171'); }
}

// ── Eigene Notiz laden ──
async function loadPinNote(uid, silent){
  const isJa = document.documentElement.lang === 'ja';
  const st = pinboardState[uid];
  if(!st) return;
  if(!silent) _stickyShowStatus(isJa ? '⏳ 読み込み中 …' : '⏳ Lade …', '#a78bfa');
  try {
    const entries = await _fbGetPinboard();
    let entry = st.noteId ? entries.find(e => e.noteId === st.noteId) : null;
    if(!entry){
      const bound = Object.keys(pinboardState).map(k => pinboardState[k].noteId).filter(Boolean);
      entry = entries.find(e => e.sessionId === _STICKY_SESSION_ID && !bound.includes(e.noteId));
    }
    if(entry){
      st.noteId = entry.noteId;
      const ta = document.getElementById('pin-edit-ta-'+uid);
      if(ta) ta.value = entry.text || '';
      st.lastSyncedText = entry.text || '';
      setPinEditColor(uid, entry.colorId || 'yellow');
      if(!silent) _stickyShowStatus(isJa ? '✅ 読み込みました' : '✅ Geladen', '#4ade80');
    } else if(!silent){
      _stickyShowStatus(isJa ? '⚠️ 保存されたメモがありません' : '⚠️ Keine eigene Notiz gespeichert', '#fbbf24');
    }
  } catch(e){ if(!silent) _stickyShowStatus('❌ ' + e.message, '#f87171'); }
}

// ── Eigene Notiz löschen ──
async function deletePinNote(uid){
  const isJa = document.documentElement.lang === 'ja';
  const st = pinboardState[uid];
  const ta = document.getElementById('pin-edit-ta-'+uid);
  if(!st) return;
  if(!st.noteId){ if(ta) ta.value = ''; return; }
  try {
    await _fbDeleteEntry(st.noteId);
    st.noteId = null;
    if(ta) ta.value = '';
    _stickyShowStatus(isJa ? '🗑️ 削除しました。' : '🗑️ Notizzettel gelöscht.', '#f87171');
  } catch(e){ _stickyShowStatus('❌ ' + e.message, '#f87171'); }
}

// ── Rendering ──────────────────────────────────────────────
function _pinboardRender(uid){
  const board = document.getElementById('pin-board-'+uid);
  if(!board){ return; }
  const entries = _pinboardEntries[uid] || [];
  const isAdmin = (uid === 'admin');

  // Während Drag: kein Re-Render
  if(isAdmin && _adminPinDragging) return;

  // Aktuelle Zettel-Elemente erfassen
  const existing = {};
  board.querySelectorAll('[data-note-id]').forEach(el => {
    existing[el.dataset.noteId] = el;
  });

  // Gelöschte Zettel entfernen
  const incomingIds = new Set(entries.map(e => e.noteId));
  Object.keys(existing).forEach(nid => {
    if(!incomingIds.has(nid)) existing[nid].remove();
  });

  // Neue hinzufügen / geänderte aktualisieren
  entries.forEach(e => {
    const c = STICKY_COLORS.find(c => c.id === e.colorId) || STICKY_COLORS[0];
    let el = existing[e.noteId];
    if(!el){
      el = document.createElement('div');
      el.dataset.noteId = e.noteId;
      el._handlerAttached = false;
      board.appendChild(el);
    }
    // Gerade verschobenen Zettel nicht überschreiben
    if(el === _adminPinDraggingEl) return;
    // Klassen setzen
    el.className = 'pin-note' + (isAdmin ? ' pin-note-small pin-note-admin' : '');
    // Position + Farbe als inline style
    el.style.left      = e.x + '%';
    el.style.top       = e.y + '%';
    el.style.transform = 'rotate(' + e.rot + 'deg)';
    el.style.background = c.bg;
    el.style.border    = '1px solid ' + c.border;
    el.innerHTML = '<div class="pin-head"></div>'
      + '<div class="pin-note-text">' + escapeHtml(e.text) + '</div>';
    el._handlerAttached = false; // Handler nach innerHTML-Reset neu anhängen
  });

  _pinboardUpdateCount(uid);
  if(isAdmin) _pinboardAttachAdminHandlers();
}
let _adminPinDragging   = false;
let _adminPinDraggingEl = null;



// Admin-Modus-Wechsel: Vollbild-Pinnwand schließen, falls Admin sich abmeldet
function _pinboardRefreshAdmin(){
  if(!_stickyDeleteUnlocked) closeAdminPinboard();
}

// ── Zettel auf der Vollbild-Pinnwand verschieben / anklicken ──
function _pinboardAttachAdminHandlers(){
  const board = document.getElementById('pin-board-admin');
  if(!board) return;
  board.querySelectorAll('.pin-note-admin').forEach(el => {
    if(el._handlerAttached) return; // nicht doppelt anhängen
    el._handlerAttached = true;
    el.onpointerdown = (ev) => {
      if(ev.target.closest('button')) return;
      ev.preventDefault();
      const noteId = el.dataset.noteId;
      const boardRect = board.getBoundingClientRect();
      const startX = ev.clientX, startY = ev.clientY;
      const origLeft = parseFloat(el.style.left) || 0;
      const origTop  = parseFloat(el.style.top)  || 0;
      let moved = false;
      el.style.zIndex = 100;
      _adminPinDragging = true;
      _adminPinDraggingEl = el;
      const onMove = (ev2) => {
        const dx = ev2.clientX - startX, dy = ev2.clientY - startY;
        if(Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
        let nl = origLeft + (dx / boardRect.width)  * 100;
        let nt = origTop  + (dy / boardRect.height) * 100;
        el.style.left = Math.max(0, Math.min(94, nl)) + '%';
        el.style.top  = Math.max(0, Math.min(90, nt)) + '%';
      };
      const onUp = () => {
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        el.style.zIndex = '';
        _adminPinDragging = false;
        _adminPinDraggingEl = null;
        if(moved){
          _pinboardSavePosition(noteId, parseFloat(el.style.left), parseFloat(el.style.top), el.dataset.group||"");
        } else {
          openAdminNoteEditor(noteId);
        }
      };
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    };
  });
}

// ── TXT-Download aller Pinnwand-Einträge ────────────────────
function _pinboardDownloadTxt(entries){
  const isJa = document.documentElement.lang === 'ja';
  const colorDe = {yellow:'Gelb',green:'Grün',blue:'Blau',pink:'Rosa',orange:'Orange',purple:'Lila'};
  const colorJa = {yellow:'黄色',green:'緑色',blue:'青色',pink:'ピンク',orange:'オレンジ',purple:'紫色'};
  const lines = entries.map((n, i) => {
    const cid = n.colorId || 'yellow';
    const colorName = isJa ? (colorJa[cid]||cid) : (colorDe[cid]||cid);
    const date = n.ts ? new Date(n.ts).toLocaleString(isJa ? 'ja-JP' : 'de-DE') : '';
    const label = isJa
      ? ('【' + (i+1) + '】 色: ' + colorName + (date ? ' / ' + date : ''))
      : ('[Eintrag ' + (i+1) + '] Farbe: ' + colorName + (date ? ' / ' + date : ''));
    return label + '\n' + (n.text||'') + '\n';
  });
  const blob = new Blob([lines.join('\n---\n\n')], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = isJa
    ? ('掲示板_' + new Date().toISOString().slice(0,10) + '.txt')
    : ('Pinnwand_' + new Date().toISOString().slice(0,10) + '.txt');
  a.click();
  URL.revokeObjectURL(a.href);
}

// ── PNG-Download des Pinnwand-Bildes ────────────────────────
function downloadPinboardPNG(){
  const isJa = document.documentElement.lang === 'ja';
  const board = document.getElementById('pin-board-admin');
  const entries = _pinboardEntries['admin'] || [];
  if(!board) return;
  if(!entries.length){
    _stickyShowStatus(isJa ? '⚠️ Pinnwand ist leer' : '⚠️ Pinnwand ist leer', '#fbbf24');
    return;
  }
  const rect = board.getBoundingClientRect();
  const scale = 2;
  const canvas = document.createElement('canvas');
  canvas.width  = Math.round(rect.width  * scale);
  canvas.height = Math.round(rect.height * scale);
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);

  // Korkbrett-Hintergrund
  ctx.fillStyle = '#c39a64';
  ctx.fillRect(0, 0, rect.width, rect.height);

  const W = 150, H = 100;
  entries.forEach(e => {
    const c = STICKY_COLORS.find(c => c.id === e.colorId) || STICKY_COLORS[0];
    const x = (e.x / 100) * rect.width;
    const y = (e.y / 100) * rect.height;
    ctx.save();
    ctx.translate(x + W/2, y + H/2);
    ctx.rotate((e.rot || 0) * Math.PI / 180);
    // Schatten + Zettel
    ctx.shadowColor = 'rgba(0,0,0,0.35)';
    ctx.shadowBlur = 6; ctx.shadowOffsetX = 3; ctx.shadowOffsetY = 4;
    ctx.fillStyle = c.bg;
    ctx.fillRect(-W/2, -H/2, W, H);
    ctx.shadowColor = 'transparent';
    ctx.strokeStyle = c.border;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(-W/2, -H/2, W, H);
    // Pin-Kopf
    ctx.beginPath();
    ctx.fillStyle = '#b91c1c';
    ctx.arc(0, -H/2, 6, 0, Math.PI*2);
    ctx.fill();
    // Text
    ctx.fillStyle = '#2b2b2b';
    ctx.font = '12px "Comic Sans MS", cursive, sans-serif';
    _pinboardWrapText(ctx, e.text || '', -W/2 + 8, -H/2 + 22, W - 16, 15, 4);
    ctx.restore();
  });

  canvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = isJa
      ? ('掲示板_' + new Date().toISOString().slice(0,10) + '.png')
      : ('Pinnwand_' + new Date().toISOString().slice(0,10) + '.png');
    a.click();
    URL.revokeObjectURL(a.href);
  }, 'image/png');
}

// Hilfsfunktion: Text mit Zeilenumbruch in Canvas zeichnen (max. maxLines Zeilen)
function _pinboardWrapText(ctx, text, x, y, maxWidth, lineHeight, maxLines){
  let cy = y, lines = 0;
  const paragraphs = String(text).split('\n');
  for(const par of paragraphs){
    const words = par.split(/\s+/);
    let line = '';
    for(let i = 0; i < words.length; i++){
      const test = line + words[i] + ' ';
      if(ctx.measureText(test).width > maxWidth && line){
        if(lines >= maxLines - 1){ ctx.fillText(line.trim() + ' …', x, cy); return; }
        ctx.fillText(line, x, cy);
        line = words[i] + ' ';
        cy += lineHeight; lines++;
      } else {
        line = test;
      }
    }
    if(lines >= maxLines - 1){
      if(line.trim()) ctx.fillText(line.trim() + (par.length ? ' …' : ''), x, cy);
      return;
    }
    ctx.fillText(line, x, cy);
    cy += lineHeight; lines++;
  }
}

// Smiley-Modus: nur die Gesichter aus „Befinden"

const BEFINDEN_SMILEYS=[
  {emoji:'😄',label:'Sehr gut',color:'#4ade80'},
  {emoji:'🙂',label:'Gut',color:'#86efac'},
  {emoji:'😐',label:'Es geht',color:'#fbbf24'},
  {emoji:'😟',label:'Nicht gut',color:'#f87171'},
];

function setJeinMode(mode,uid){
  jeinState[uid].mode=mode;
  ['text','smiley','ampel','color','janken'].forEach(m=>{
    const b=document.getElementById('jmbtn-'+m+'-'+uid);
    if(b) b.classList.toggle('active-jmode',m===mode);
  });
  // reset display
  const disp=document.getElementById('jein-display-'+uid);
  if(disp){disp.innerHTML='<span style="font-size:2em;color:var(--text2);opacity:.4;">?</span>';disp.style.background=document.body.classList.contains('light-mode')?'rgba(0,0,0,0.04)':'rgba(0,0,0,0.15)';}
  // Show/hide choice buttons and roll button
  const jankenBtns=document.getElementById('jein-janken-btns-'+uid);
  const rollBtn=document.getElementById('jein-roll-btn-'+uid);
  if(jankenBtns) jankenBtns.style.display=mode==='janken'?'flex':'none';
  if(rollBtn) rollBtn.style.display=(mode==='janken')?'none':'block';
  // Start/stop auto-switch for ampel mode
  if(ampelTimers[uid]){clearTimeout(ampelTimers[uid]);delete ampelTimers[uid];}
  if(mode==='ampel'){
    if(jeinState[uid]) jeinState[uid].ampelState=null;
    scheduleAmpelSwitch(uid);
  }
  // Start/stop auto-cycle for smiley mode
  stopSmileyAutoRotate(uid);
  if(mode==='smiley') startSmileyAutoRotate(uid);
}

function scheduleAmpelSwitch(uid){
  // Read min/max from config inputs (default 10–30 s)
  const minEl=document.getElementById('ampel-min-'+uid);
  const maxEl=document.getElementById('ampel-max-'+uid);
  let minS=parseFloat(minEl?.value)||10;
  let maxS=parseFloat(maxEl?.value)||30;
  if(minS<1) minS=1; if(maxS<minS) maxS=minS;
  const greenMs=(minS+Math.random()*(maxS-minS))*1000;

  // Phase 1: show GREEN
  showAmpelState(uid,'gruen');
  if(jeinState[uid]) jeinState[uid].ampelState='gruen';

  // Phase 2: after greenMs → show YELLOW for 1 s
  ampelTimers[uid]=setTimeout(()=>{
    if(jeinState[uid]?.mode!=='ampel') return;
    showAmpelState(uid,'gelb');
    if(jeinState[uid]) jeinState[uid].ampelState='gelb';

    // Phase 3: after 1 s → show RED, play horn, stay
    ampelTimers[uid]=setTimeout(()=>{
      if(jeinState[uid]?.mode!=='ampel') return;
      showAmpelState(uid,'rot');
      if(jeinState[uid]) jeinState[uid].ampelState='rot';
      // Play horn only at red
      try{const ac=new (window.AudioContext||window.webkitAudioContext)();playCarHorn(ac,0.7);
        setTimeout(()=>{try{const ac2=new (window.AudioContext||window.webkitAudioContext)();playCarHorn(ac2,0.7);}catch(e){}},600);
      }catch(e){}
      // Do NOT auto-reschedule — red stays until widget is reactivated
      delete ampelTimers[uid];
    },1000);
  },greenMs);
}

  // Works for both dice widget (dicewrap) and jein widget (jein-display)
  const wrap=document.getElementById('dicewrap-'+uid);
  const disp=document.getElementById('jein-display-'+uid);
  const res =document.getElementById('diceres-'+uid);
  const isLM = document.body.classList.contains('light-mode');
  const circles={
    rot:  {bg: isLM?'#fff0f0':'#1a0000', dot:'#ef4444', empty: isLM?'rgba(220,0,0,0.12)':'rgba(80,0,0,0.4)'},
    gelb: {bg: isLM?'#fffbea':'#1a1400', dot:'#eab308', empty: isLM?'rgba(200,160,0,0.15)':'rgba(80,70,0,0.4)'},
    gruen:{bg: isLM?'#f0fff4':'#001a00', dot:'#22c55e', empty: isLM?'rgba(0,160,0,0.12)':'rgba(0,80,0,0.4)'},
  };
  const col=circles[state];
  const hsgColor = isLM ? '#555' : '#444';
  const rectFill = isLM ? '#ddd' : '#222';
  const svgHTML=`<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:${col.bg};border-radius:16px;">
    <svg viewBox="0 0 60 180" width="33%" height="90%" xmlns="http://www.w3.org/2000/svg">
      <rect x="5" y="5" width="50" height="170" rx="12" fill="${rectFill}" stroke="${hsgColor}" stroke-width="2"/>
      <circle cx="30" cy="35"  r="18" fill="${state==='rot'  ? col.dot : col.empty}"/>
      <circle cx="30" cy="90"  r="18" fill="${state==='gelb' ? col.dot : col.empty}"/>
      <circle cx="30" cy="145" r="18" fill="${state==='gruen'? col.dot : col.empty}"/>
    </svg>
  </div>`;
  if(wrap) wrap.innerHTML=svgHTML;
  if(disp){ disp.style.background=document.body.classList.contains('light-mode')?'rgba(0,0,0,0.06)':'rgba(0,0,0,0.3)'; disp.innerHTML=svgHTML; }
  const labels=currentLanguage==='ja'?{rot:'赤',gelb:'黄',gruen:'緑'}:{rot:'Rot',gelb:'Gelb',gruen:'Grün'};
  if(res) res.textContent=labels[state]||state;
}

function startSmileyAutoRotate(uid){
  stopSmileyAutoRotate(uid);
  smileyTimers[uid]=setInterval(()=>{
    if(jeinState[uid]?.mode!=='smiley') { stopSmileyAutoRotate(uid); return; }
    // Pick a different smiley than the currently shown one
    const disp=document.getElementById('jein-display-'+uid);
    const wrap=document.getElementById('dicewrap-'+uid);
    if(disp && disp.querySelector('span[data-smiley-active]')){
      const current=disp.querySelector('span[data-smiley-active]')?.textContent;
      const pool=BEFINDEN_SMILEYS.map(s=>s.emoji).filter(e=>e!==current);
      const next=(pool.length?pool:BEFINDEN_SMILEYS.map(s=>s.emoji))[Math.floor(Math.random()*(pool.length||BEFINDEN_SMILEYS.length))];
      disp.style.transform='scale(0.82)';disp.style.opacity='0.3';
      setTimeout(()=>{
        disp.style.transition='transform .25s cubic-bezier(.34,1.56,.64,1), opacity .2s';
        disp.style.transform='scale(1)';disp.style.opacity='1';
        disp.style.background='rgba(255,255,255,0.05)';
        disp.innerHTML=`<span data-smiley-active="1" style="font-size:7em;line-height:1;">${next}</span>`;
        try{const ac=new (window.AudioContext||window.webkitAudioContext)();playPop(ac,0.8);}catch(e){}
      },150);
    } else if(wrap){
      // Dice widget smiley auto-rotate
      const current=wrap.querySelector('span')?.textContent;
      const pool=BEFINDEN_SMILEYS.map(s=>s.emoji).filter(e=>e!==current);
      const next=(pool.length?pool:BEFINDEN_SMILEYS.map(s=>s.emoji))[Math.floor(Math.random()*(pool.length||BEFINDEN_SMILEYS.length))];
      wrap.style.transition='transform .12s ease-in';wrap.style.transform='scale(0.82)';
      setTimeout(()=>{
        wrap.style.transition='transform .25s cubic-bezier(.34,1.56,.64,1)';wrap.style.transform='scale(1)';
        wrap.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;"><span style="font-size:clamp(4em,18vw,9em);line-height:1;">${next}</span></div>`;
        try{const ac=new (window.AudioContext||window.webkitAudioContext)();playPop(ac,0.8);}catch(e){}
      },130);
    }
  },5000);
}

function stopSmileyAutoRotate(uid){
  if(smileyTimers[uid]){clearInterval(smileyTimers[uid]);delete smileyTimers[uid];}
}

function rollJein(uid){
  const yes=Math.random()<0.5;
  const disp=document.getElementById('jein-display-'+uid);
  const mode=jeinState[uid]?.mode||'text';
  
disp.style.transform='scale(0.8)';disp.style.opacity='0';
  setTimeout(()=>{
    disp.style.transform='scale(1)';disp.style.opacity='1';
    disp.style.transition='all .25s cubic-bezier(.34,1.56,.64,1)';
    if(mode==='text'){
      try{const ac=new (window.AudioContext||window.webkitAudioContext)();playPop(ac,0.8);}catch(e){}
      disp.style.background=yes?'rgba(74,222,128,0.15)':'rgba(248,113,113,0.15)';
      disp.innerHTML=`<span style="font-size:3.5em;font-weight:900;color:${yes?'#4ade80':'#f87171'};letter-spacing:2px;">${yes?(currentLanguage==='ja'?'はい':'JA'):(currentLanguage==='ja'?'いいえ':'NEIN')}</span>`;
    } else if(mode==='smiley'){
      try{const ac=new (window.AudioContext||window.webkitAudioContext)();playPop(ac,0.8);}catch(e){}
      const allSmileys=BEFINDEN_SMILEYS.map(s=>s.emoji);
      const s=allSmileys[Math.floor(Math.random()*allSmileys.length)];
      disp.style.background='rgba(255,255,255,0.05)';
      disp.innerHTML=`<span data-smiley-active="1" style="font-size:7em;line-height:1;">${s}</span>`;
      // Restart auto-rotate so next change is 5s after manual roll
      startSmileyAutoRotate(uid);
    } else if(mode==='ampel'){
      // Restart the green→yellow→red cycle
      if(ampelTimers[uid]){clearTimeout(ampelTimers[uid]);delete ampelTimers[uid];}
      scheduleAmpelSwitch(uid);
    } else if(mode==='color'){
      // Clear, unambiguous colors - randomly chosen regardless of yes/no
      const clearColors=['#22c55e','#eab308','#ef4444','#f97316','#ffffff','#9ca3af','#111111','#8b5cf6','#ec4899','#92400e','#3b82f6'];
      const col=clearColors[Math.floor(Math.random()*clearColors.length)];
      disp.style.background=col;
      disp.innerHTML='';
    }
  },150);
}

// ════════════════════════════════════════════════
// WIDGET: WAS?  (Photo Mosaic Reveal)
// ════════════════════════════════════════════════
const wasState={};

function buildWas(body,uid){
  wasState[uid]={imgs:[],imgIndex:0,step:0,maxSteps:8,canvas:null,revealed:false,mode:'diashow',blurInterval:null,diashowActive:false,diashowTimer:null,diashowRandom:false};

<div id="was-upload-${uid}" style="text-align:center;">

</div>

    <button class="wbtn" onclick="wasGoPrev(${uid})" id="was-prev-${uid}" style="padding:.3em .7em;font-size:.85em;">◀</button>

    <button class="wbtn" onclick="wasDiashowToggleZufall(${uid})" id="was-zufall-btn-${uid}" style="display:none;font-size:.82em;padding:.3em .7em;" data-i18n="diceZufallAn"></button>
    <div id="was-nav-label-${uid}" style="flex:1;text-align:center;font-size:.82em;color:var(--text2);font-weight:700;" data-i18n="wasFoto" data-i18n-suffix=" 1 / 1">1 / 1</div>

    <div style="display:flex;gap:3px;background:rgba(0,0,0,0.25);border-radius:8px;padding:3px;">

function loadWasImages(uid, files){
  if(!files||!files.length)return;
  const s=wasState[uid];
  s.imgs=[];
  s.imgIndex=0;
  let loaded=0;
  const total=files.length;
  Array.from(files).forEach((file,i)=>{
    const img=new Image();
    const reader=new FileReader();
    reader.onload=e=>{
      img.onload=()=>{
        s.imgs[i]=img;
        loaded++;
        if(loaded===total) wasActivatePhoto(uid,0);
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function wasActivatePhoto(uid, index){
  const s=wasState[uid];
  if(!s||!s.imgs.length)return;
  s.imgIndex=index;
  s.step=0;
  s.revealed=false;
  // Show canvas area, hide upload zone
  document.getElementById('was-upload-'+uid).style.display='none';
  const wrap=document.getElementById('was-canvas-wrap-'+uid);
  wrap.style.display='flex';
  const cv=document.getElementById('was-canvas-'+uid);
  const img=s.imgs[index];
  s.canvas=cv;

  // Canvas-Größe berechnen – nach dem nächsten Paint, damit clientWidth korrekt ist
  function _wasSetCanvasSize(){
    const bodyEl = cv.closest('.widget-body');
    const widget  = cv.closest('.widget');
    const topbarH = (document.getElementById('topbar')?.offsetHeight) || 68;
    // Verfügbare Breite
    const bodyW = bodyEl ? bodyEl.clientWidth : 0;
    const availW = Math.max(120, bodyW > 0 ? bodyW - 16 : (widget ? widget.offsetWidth - 32 : 400));
    // Verfügbare Höhe: Widget-Höhe minus Tabs (32px) + Header (36px) + Buttons (38px) + Padding + Nav
    const hasNav = s.imgs.length > 1;
    const reserved = 36/*header*/ + 32/*tabs*/ + (hasNav?42:0) + 38/*buttons+step*/ + 24/*padding*/;
    const widgetH = widget ? widget.offsetHeight : (window.innerHeight - topbarH);
    const availH = Math.max(80, widgetH - reserved);
    // Skalieren: Bild proportional einpassen, nie hochskalieren
    const scaleW = availW / img.width;
    const scaleH = availH / img.height;
    const scale  = Math.min(scaleW, scaleH);
    const cw = Math.round(img.width  * scale);
    const ch = Math.round(img.height * scale);
    cv.width  = cw;
    cv.height = ch;
    // CSS-Größe explizit setzen damit das Canvas nicht durch "width:100%" verzerrt wird
    cv.style.width  = cw + 'px';
    cv.style.height = ch + 'px';
  }
  // Update reveal button label
  const btn=document.getElementById('was-btn-'+uid);
  if(btn){
    if(s.mode==='diashow'){ btn.style.visibility='hidden'; }
    else {
      btn.style.visibility='';
      if(s.mode==='blur') btn.textContent=T('wasSchaerfer');
      else if(s.mode==='kaese') btn.textContent=T('wasMehrZeigen');
      else btn.textContent=T('wasFeiner');
      btn.disabled=false;
    }
  }
  // Nav bar
  const nav=document.getElementById('was-nav-'+uid);
  const navLabel=document.getElementById('was-nav-label-'+uid);
  const prevBtn=document.getElementById('was-prev-'+uid);
  const nextBtn=document.getElementById('was-next-'+uid);
  const diashowNavBtn=document.getElementById('wastab-diashow-'+uid);
  const diashowSingleBtn=document.getElementById('wastab-diashow-single-'+uid);
  // Sync mode tab highlighting
  document.getElementById('wastab-mosaic-'+uid)?.classList.toggle('active-tmode', s.mode==='mosaic');
  document.getElementById('wastab-blur-'+uid)?.classList.toggle('active-tmode', s.mode==='blur');
  document.getElementById('wastab-twirl-'+uid)?.classList.toggle('active-tmode', s.mode==='twirl');
  document.getElementById('wastab-puzzle-'+uid)?.classList.toggle('active-tmode', s.mode==='puzzle');
  document.getElementById('wastab-kaese-'+uid)?.classList.toggle('active-tmode', s.mode==='kaese');
  if(s.imgs.length>1){
    nav.style.display='flex';
    navLabel.textContent=`${T('wasFoto')} ${index+1} / ${s.imgs.length}`;
    prevBtn.disabled=(index===0);
    prevBtn.style.opacity=(index===0)?'0.35':'1';
    nextBtn.disabled=(index===s.imgs.length-1);
    nextBtn.style.opacity=(index===s.imgs.length-1)?'0.35':'1';
    nextBtn.textContent=index===s.imgs.length-1?T('wasFertig'):T('wasWeiter');
    // Sync diashow button state in nav
    if(diashowNavBtn){
      diashowNavBtn.textContent=s.diashowActive?T('wasPause'):T('wasDiashow');
      diashowNavBtn.classList.toggle('primary',s.diashowActive);
    }
    if(diashowSingleBtn) diashowSingleBtn.style.display='none';
  } else {
    nav.style.display='none';
    // For single image, hide diashow button (Diashow needs multiple photos)
    if(diashowSingleBtn) diashowSingleBtn.style.display='none';
  }
  // Erst nach dem nächsten Render-Frame messen (wrap ist gerade erst auf display:flex gesetzt)
  requestAnimationFrame(()=>{
    _wasSetCanvasSize();
    if(s.mode==='diashow'){
      // Diashow: Bild vollständig anzeigen
      const ctx=cv.getContext('2d');
      ctx.drawImage(img,0,0,cv.width,cv.height);
      const stepEl=document.getElementById('was-step-'+uid);
      if(stepEl) stepEl.textContent='';
      if(btn) btn.style.visibility='hidden';
    } else {
      if(btn) btn.style.visibility='';
      // Bild NICHT unbearbeitet zeigen – Effekt-Modus ab Schritt 0 rendern
      wasRenderStep(uid);
    }
  });

  // ResizeObserver: Canvas bei Widget-Größenänderung neu berechnen
  if(!s._resizeObs && window.ResizeObserver){
    const widget = cv.closest('.widget');
    if(widget){
      s._resizeObs = new ResizeObserver(()=>{
        const st=wasState[uid];
        if(st&&st.imgs&&st.imgs.length&&st.canvas){
          wasResizeCanvas(uid);
          if(st.mode!=='diashow') wasRenderStep(uid);
          else{
            const ctx=st.canvas.getContext('2d');
            const img=st.imgs[st.imgIndex];
            if(img) ctx.drawImage(img,0,0,st.canvas.width,st.canvas.height);
          }
        }
      });
      s._resizeObs.observe(widget);
    }
  }
}

function wasResizeCanvas(uid){
  const s=wasState[uid];
  if(!s||!s.imgs||!s.imgs.length||!s.canvas)return;
  const cv=s.canvas;
  const img=s.imgs[s.imgIndex]||s.imgs[0];
  if(!img)return;
  const bodyEl=cv.closest('.widget-body');
  const widget=cv.closest('.widget');
  const topbarH=(document.getElementById('topbar')?.offsetHeight)||68;
  const bodyW=bodyEl?bodyEl.clientWidth:0;
  const availW=Math.max(120,bodyW>0?bodyW-16:(widget?widget.offsetWidth-32:400));
  const hasNav=s.imgs.length>1;
  const reserved=36+32+(hasNav?42:0)+38+24;
  const widgetH=widget?widget.offsetHeight:(window.innerHeight-topbarH);
  const availH=Math.max(80,widgetH-reserved);
  const scaleW=availW/img.width;
  const scaleH=availH/img.height;
  const scale=Math.min(scaleW,scaleH);
  const cw=Math.round(img.width*scale);
  const ch=Math.round(img.height*scale);
  cv.width=cw; cv.height=ch;
  cv.style.width=cw+'px'; cv.style.height=ch+'px';
}

function wasGoNext(uid){
  const s=wasState[uid];
  if(!s||!s.imgs.length)return;
  if(s.imgIndex<s.imgs.length-1) wasActivatePhoto(uid, s.imgIndex+1);
}
function wasGoPrev(uid){
  const s=wasState[uid];
  if(!s||!s.imgs.length)return;
  if(s.imgIndex>0) wasActivatePhoto(uid, s.imgIndex-1);
}

function setWasMode(mode, uid){
  wasDiashowStop(uid);
  wasState[uid].mode = mode;
  wasState[uid].step = 0;
  wasState[uid].revealed = false;
  document.getElementById('wastab-mosaic-'+uid)?.classList.toggle('active-tmode', mode==='mosaic');
  document.getElementById('wastab-blur-'+uid)?.classList.toggle('active-tmode', mode==='blur');
  document.getElementById('wastab-twirl-'+uid)?.classList.toggle('active-tmode', mode==='twirl');
  document.getElementById('wastab-puzzle-'+uid)?.classList.toggle('active-tmode', mode==='puzzle');
  document.getElementById('wastab-kaese-'+uid)?.classList.toggle('active-tmode', mode==='kaese');
  // Update button label
  const btn = document.getElementById('was-btn-'+uid);
  if(btn && !wasState[uid].revealed){
    if(mode==='blur') btn.textContent=T('wasSchaerfer');
    else if(mode==='kaese') btn.textContent=T('wasMehrZeigen');
    else if(mode==='twirl') btn.textContent=T('wasFeiner');
    else btn.textContent=T('wasFeiner');
    btn.style.visibility='';
    btn.disabled = false;
  }
  if(wasState[uid].imgs&&wasState[uid].imgs.length) wasRenderStep(uid);
}

// loadWasImage kept for backward compat (single-file fallback)
function loadWasImage(uid, file){
  if(!file)return;
  loadWasImages(uid,[file]);
}

function wasRenderStep(uid){
  const s=wasState[uid]; if(!s||!s.imgs||!s.imgs.length||!s.canvas)return;
  s.img=s.imgs[s.imgIndex]||s.imgs[0]; // compat alias
  const cv=s.canvas;
  const ctx=cv.getContext('2d');
  const mode = s.mode||'mosaic';

  if(mode==='kaese'){
    if(s.step>=s.maxSteps-1){
      // Fully revealed
      ctx.drawImage(s.img,0,0,cv.width,cv.height);
      s.revealed=true;
      const btn=document.getElementById('was-btn-'+uid);
      if(btn){btn.textContent=T('wasEnthuellung');btn.disabled=true;}
      document.getElementById('was-step-'+uid).textContent=T('wasVollstaendig');
      return;
    }

    // Step 0: only a few small holes; each step adds more/bigger holes
    const rng=(seed)=>{let x=Math.sin(seed+1)*43758.5453123;return x-Math.floor(x);};
    const totalHoles=Math.floor(4+s.step*s.step*3);
    const minR=Math.max(10,Math.round((cv.width+cv.height)/28));
    const maxR=Math.min(cv.width,cv.height)*0.20;

    // 1) Draw the image onto an offscreen canvas
    const offImg=document.createElement('canvas');
    offImg.width=cv.width; offImg.height=cv.height;
    const offCtx=offImg.getContext('2d');
    offCtx.drawImage(s.img,0,0,cv.width,cv.height);

    // 2) Build a mask canvas: black everywhere, circles cut out
    const mask=document.createElement('canvas');
    mask.width=cv.width; mask.height=cv.height;
    const mctx=mask.getContext('2d');
    mctx.fillStyle='#f5c842';
    mctx.fillRect(0,0,mask.width,mask.height);
    // Cut holes using destination-out compositing
    mctx.globalCompositeOperation='destination-out';
    for(let i=0;i<totalHoles;i++){
      const hx=rng(i*7+1)*cv.width;
      const hy=rng(i*7+3)*cv.height;
      const baseR=minR+(rng(i*7+5))*(maxR-minR);
      const r=baseR*(0.7+s.step*0.05);
      mctx.beginPath();
      mctx.arc(hx,hy,r,0,Math.PI*2);
      mctx.fill();
    }
    mctx.globalCompositeOperation='source-over';

    // 3) Draw image, then overlay the mask
    ctx.drawImage(offImg,0,0);
    ctx.drawImage(mask,0,0);

    const stepDisp=document.getElementById('was-step-'+uid);
    if(stepDisp) stepDisp.textContent=T('wasSchritt')+' '+(s.step+1)+' / '+s.maxSteps;
    return;
  }

  if(mode==='twirl'){
    // Twirl/Wirbel: Stärke nimmt mit jedem Schritt ab (max → 0 = enthüllt)
    if(s.step>=s.maxSteps-1){
      ctx.drawImage(s.img,0,0,cv.width,cv.height);
      s.revealed=true;
      const btn=document.getElementById('was-btn-'+uid);
      if(btn){btn.textContent=T('wasEnthuellung');btn.disabled=true;}
      document.getElementById('was-step-'+uid).textContent=T('wasVollstaendig');
      return;
    }
    const maxAngle = Math.PI * 4; // 720° maximale Verdrehung bei Stufe 0
    const twirlAngle = maxAngle * (1 - s.step / (s.maxSteps - 1));

    // Bild in Offscreen-Canvas zeichnen
    const off = document.createElement('canvas');
    off.width = cv.width; off.height = cv.height;
    const offCtx = off.getContext('2d');
    offCtx.drawImage(s.img, 0, 0, cv.width, cv.height);
    const srcData = offCtx.getImageData(0, 0, cv.width, cv.height);
    const dstData = ctx.createImageData(cv.width, cv.height);
    const w = cv.width, h = cv.height;
    const cx2 = w / 2, cy2 = h / 2;
    const maxR = Math.sqrt(cx2 * cx2 + cy2 * cy2);
    const src = srcData.data, dst = dstData.data;
    for(let y = 0; y < h; y++){
      for(let x = 0; x < w; x++){
        const dx = x - cx2, dy = y - cy2;
        const r = Math.sqrt(dx*dx + dy*dy);
        // Wirbel fällt nach außen hin ab
        const factor = Math.max(0, 1 - r / maxR);
        const angle = twirlAngle * factor * factor;
        const cos = Math.cos(angle), sin = Math.sin(angle);
        const sx = Math.round(cx2 + dx*cos - dy*sin);
        const sy = Math.round(cy2 + dx*sin + dy*cos);
        const di = (y * w + x) * 4;
        if(sx >= 0 && sx < w && sy >= 0 && sy < h){
          const si = (sy * w + sx) * 4;
          dst[di]   = src[si];
          dst[di+1] = src[si+1];
          dst[di+2] = src[si+2];
          dst[di+3] = src[si+3];
        } else {
          dst[di+3] = 255;
        }
      }
    }
    ctx.putImageData(dstData, 0, 0);
    const stepDisp = document.getElementById('was-step-'+uid);
    if(stepDisp) stepDisp.textContent = T('wasSchritt')+' '+(s.step+1)+' / '+s.maxSteps;
    return;
  }

  if(mode==='puzzle'){
    // Puzzle: Stufe 0 = viele kleine Teile zufällig angeordnet, jede Stufe weniger & größere Teile
    // Stufe maxSteps-1 = ein einziges Stück = vollständiges Bild
    if(s.step>=s.maxSteps-1){
      ctx.drawImage(s.img,0,0,cv.width,cv.height);
      s.revealed=true;
      const btn=document.getElementById('was-btn-'+uid);
      if(btn){btn.textContent=T('wasEnthuellung');btn.disabled=true;}
      document.getElementById('was-step-'+uid).textContent=T('wasVollstaendig');
      return;
    }

    // Anzahl Teile: von ~64 (8×8) auf 2 abnehmend
    const maxPieces = 64;
    const minPieces = 2;
    // Exponentiell abnehmen: Stufe 0 → maxPieces, Stufe maxSteps-2 → minPieces
    const t = s.step / (s.maxSteps - 2);
    const totalPieces = Math.max(minPieces, Math.round(maxPieces * Math.pow(1 - t, 2)));
    // Gitter-Aufteilung so quadratisch wie möglich
    const cols = Math.max(1, Math.round(Math.sqrt(totalPieces * cv.width / cv.height)));
    const rows = Math.max(1, Math.round(totalPieces / cols));
    const pw = cv.width  / cols;  // Stück-Breite (Canvas)
    const ph = cv.height / rows;  // Stück-Höhe (Canvas)
    // Quell-Stückgröße im natürlichen Bild (für korrekte drawImage-Quellkoordinaten)
    const spw = s.img.naturalWidth  / cols;
    const sph = s.img.naturalHeight / rows;

    // Deterministischer Shuffle der Stück-Positionen (Seed = step, damit stabil pro Stufe)
    const total = cols * rows;
    const rng = (seed) => { let x = Math.sin(seed * 9301 + 49297) * 233280; return x - Math.floor(x); };
    // Erstelle Array aller Quell-Indizes, mische es
    const indices = Array.from({length: total}, (_, i) => i);
    for(let i = total - 1; i > 0; i--){
      const j = Math.floor(rng(i + s.step * 1000) * (i + 1));
      [indices[i], indices[j]] = [indices[j], indices[i]];
    }

    // Jedes Ziel-Kästchen bekommt ein zufälliges Quell-Stück (kein Spalt, kein Hintergrund)
    for(let dstI = 0; dstI < total; dstI++){
      const srcI  = indices[dstI];
      const srcCol = srcI % cols, srcRow = Math.floor(srcI / cols);
      const dstCol = dstI % cols, dstRow = Math.floor(dstI / cols);
      // Quell-Koordinaten aus natürlichem Bild
      const sx = srcCol * spw, sy = srcRow * sph;
      // Ziel-Koordinaten auf Canvas (nahtlos, kein Spalt)
      const dx = dstCol * pw, dy = dstRow * ph;
      ctx.drawImage(s.img,
        sx, sy, spw, sph,
        dx, dy, pw, ph
      );
    }

    const stepDisp = document.getElementById('was-step-'+uid);
    if(stepDisp) stepDisp.textContent = T('wasSchritt')+' '+(s.step+1)+' / '+s.maxSteps;
    return;
  }

  if(mode==='blur'){
    // Blur reveal: step 0 = very blurry, step maxSteps-1 = sharp
    const maxBlur=40;
    const blurPx = s.step>=s.maxSteps-1 ? 0 : Math.round(maxBlur*(1-s.step/(s.maxSteps-1)));
    ctx.filter = blurPx>0 ? `blur(${blurPx}px)` : 'none';
    ctx.drawImage(s.img,0,0,cv.width,cv.height);
    ctx.filter='none';
    if(blurPx===0){
      s.revealed=true;
      const btn=document.getElementById('was-btn-'+uid);
      if(btn){btn.textContent=T('wasEnthuellung');btn.disabled=true;}
      document.getElementById('was-step-'+uid).textContent=T('wasVollstaendig');
      return;
    }
    const stepDisp=document.getElementById('was-step-'+uid);
    if(stepDisp) stepDisp.textContent=T('wasSchaerfe')+' '+(s.step+1)+' / '+s.maxSteps;
    return;
  }

  // Pixelation (mosaic) mode
  const maxBlock=Math.max(2,Math.round(Math.min(cv.width,cv.height)/4));
  const blockSize=s.step>=s.maxSteps-1?1:Math.max(1,Math.round(maxBlock*Math.pow(0.45,s.step)));

  if(blockSize<=1){
    ctx.drawImage(s.img,0,0,cv.width,cv.height);
    s.revealed=true;
    const btn=document.getElementById('was-btn-'+uid);
    if(btn){btn.textContent=T('wasEnthuellung');btn.disabled=true;}
    document.getElementById('was-step-'+uid).textContent=T('wasVollstaendig');
    return;
  }

  const off=document.createElement('canvas');
  const bw=Math.max(1,Math.round(cv.width/blockSize));
  const bh=Math.max(1,Math.round(cv.height/blockSize));
  off.width=bw; off.height=bh;
  const octx=off.getContext('2d');
  octx.drawImage(s.img,0,0,bw,bh);
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(off,0,0,bw,bh,0,0,cv.width,cv.height);
  ctx.imageSmoothingEnabled=true;

  const stepDisp=document.getElementById('was-step-'+uid);
  if(stepDisp) stepDisp.textContent=T('wasSchritt')+' '+(s.step+1)+' / '+s.maxSteps;
}

function wasUpdateControlsVisibility(uid){
  const s = wasState[uid]; if(!s) return;
  const effectEl  = document.getElementById('was-effect-controls-'+uid);
  const zufallBtn = document.getElementById('was-zufall-btn-'+uid);
  if(s.diashowActive){
    if(effectEl)  effectEl.style.display  = 'none';
    if(zufallBtn) zufallBtn.style.display = '';
  } else {
    if(effectEl)  effectEl.style.display  = '';
    if(zufallBtn) zufallBtn.style.display = 'none';
  }
}

function wasCanvasClick(uid){
  const s=wasState[uid]; if(!s)return;
  if(s.mode==='diashow'){
    // In Diashow-Modus: zum nächsten Bild springen (wie Weiter-Knopf)
    if(s.imgs&&s.imgs.length>1) wasGoNext(uid);
    return;
  }
  wasRevealMore(uid);
}

function wasRevealMore(uid){
  const s=wasState[uid]; if(!s||s.revealed)return;
  try{const ac=new (window.AudioContext||window.webkitAudioContext)();playPop(ac,0.8);}catch(e){}
  s.step=Math.min(s.step+1,s.maxSteps);
  wasRenderStep(uid);
}

function wasReset(uid){
  const s=wasState[uid]; if(!s)return;
  s.step=0; s.revealed=false;
  const btn=document.getElementById('was-btn-'+uid);
  if(btn){
    if(s.mode==='blur') btn.textContent=T('wasSchaerfer');
    else if(s.mode==='kaese') btn.textContent=T('wasMehrZeigen');
    else btn.textContent=T('wasFeiner');
    btn.disabled=false;
  }
  if(s.imgs&&s.imgs.length) wasActivatePhoto(uid,0);
  else wasRenderStep(uid);
}

// DIASHOW für Was?-Widget
function wasDiashowToggle(uid){
  const s=wasState[uid]; if(!s)return;
  // Button kann in der Nav-Bar (was-nav) ODER im single-Modus sein
  const btn=document.getElementById('wastab-diashow-'+uid);
  const btnSingle=document.getElementById('wastab-diashow-single-'+uid);
  if(s.diashowActive){
    // Pause/Stop
    s.diashowActive=false;
    s.mode='diashow';
    if(s.diashowTimer){clearTimeout(s.diashowTimer);s.diashowTimer=null;}
    if(btn){btn.textContent=T('wasDiashow');btn.classList.remove('primary','active-tmode');}
    if(btnSingle){btnSingle.textContent=T('wasDiashow');btnSingle.classList.remove('active-tmode');}
    // Alle Effekt-Tabs deaktiviert lassen
    document.getElementById('wastab-mosaic-'+uid)?.classList.remove('active-tmode');
    document.getElementById('wastab-blur-'+uid)?.classList.remove('active-tmode');
    document.getElementById('wastab-twirl-'+uid)?.classList.remove('active-tmode');
    document.getElementById('wastab-puzzle-'+uid)?.classList.remove('active-tmode');
    document.getElementById('wastab-kaese-'+uid)?.classList.remove('active-tmode');
    // Bild unbearbeitet anzeigen
    if(s.imgs&&s.imgs.length&&s.canvas){
      const ctx=s.canvas.getContext('2d');
      const img=s.imgs[s.imgIndex];
      if(img) ctx.drawImage(img,0,0,s.canvas.width,s.canvas.height);
    }
    const revealBtn2=document.getElementById('was-btn-'+uid);
    if(revealBtn2) revealBtn2.style.visibility='hidden';
    wasUpdateControlsVisibility(uid);
  } else {
    // Start – mind. 1 Bild muss geladen sein
    if(!s.imgs||!s.imgs.length){alert('Bitte zuerst Fotos hochladen.');return;}
    s.diashowActive=true;
    s.mode='diashow';
    if(btn){btn.textContent=T('wasPause');btn.classList.add('primary');}
    if(btnSingle){btnSingle.textContent=T('wasPause');btnSingle.classList.add('active-tmode');}
    // Effekt-Tabs deaktivieren während Diashow
    document.getElementById('wastab-mosaic-'+uid)?.classList.remove('active-tmode');
    document.getElementById('wastab-blur-'+uid)?.classList.remove('active-tmode');
    document.getElementById('wastab-twirl-'+uid)?.classList.remove('active-tmode');
    document.getElementById('wastab-puzzle-'+uid)?.classList.remove('active-tmode');
    document.getElementById('wastab-kaese-'+uid)?.classList.remove('active-tmode');
    wasUpdateControlsVisibility(uid);
    // Shuffle-Reihenfolge erstellen
    if(!s.diashowQueue||!s.diashowQueue.length) s.diashowQueue=wasDiashowShuffle(s.imgs.length);
    wasDiashowStep(uid);
  }
}
function wasDiashowShuffle(n){
  const arr=Array.from({length:n},(_,i)=>i);
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
}
function wasDiashowStep(uid){
  const s=wasState[uid]; if(!s||!s.diashowActive)return;
  let nextIdx;
  if(s.diashowRandom){
    if(!s.diashowQueue||!s.diashowQueue.length) s.diashowQueue=wasDiashowShuffle(s.imgs.length);
    nextIdx=s.diashowQueue.shift();
  } else {
    nextIdx=(s.imgIndex+1) % s.imgs.length;
  }
  // Reveal the photo fully (skip puzzle mode — show image directly)
  s.step=s.maxSteps; s.revealed=false;
  wasActivatePhoto(uid, nextIdx);
  // After canvas is ready, draw full image
  requestAnimationFrame(()=>{
    const cv=s.canvas; if(!cv)return;
    const ctx=cv.getContext('2d');
    const img=s.imgs[nextIdx];
    if(img) ctx.drawImage(img,0,0,cv.width,cv.height);
    // Hide step info and reveal button during diashow
    const stepEl=document.getElementById('was-step-'+uid);
    if(stepEl) stepEl.textContent='';
    const revealBtn=document.getElementById('was-btn-'+uid);
    if(revealBtn) revealBtn.style.visibility='hidden';
  });
  s.diashowTimer=setTimeout(()=>wasDiashowStep(uid), 5000);
}
function wasDiashowStop(uid){
  const s=wasState[uid]; if(!s)return;
  s.diashowActive=false;
  if(s.diashowTimer){clearTimeout(s.diashowTimer);s.diashowTimer=null;}
  const btn=document.getElementById('wastab-diashow-'+uid);
  if(btn){btn.textContent=T('wasDiashow');btn.classList.remove('primary','active-tmode');}
  const btnSingle=document.getElementById('wastab-diashow-single-'+uid);
  if(btnSingle){btnSingle.textContent=T('wasDiashow');btnSingle.classList.remove('active-tmode');}
  const revealBtn=document.getElementById('was-btn-'+uid);
  if(revealBtn) revealBtn.style.visibility='';
  wasUpdateControlsVisibility(uid);
}

function wasDiashowToggleZufall(uid){
  const s=wasState[uid]; if(!s)return;
  s.diashowRandom=!s.diashowRandom;
  s.diashowQueue=[];  // reset queue so new mode takes effect immediately
  const btn=document.getElementById('was-zufall-btn-'+uid);
  if(btn){
    btn.textContent=s.diashowRandom ? T('diceZufallAus') : T('diceZufallAn');
    btn.classList.toggle('primary', s.diashowRandom);
  }
  // Laufenden Timer abbrechen und sofort nächsten Schritt ausführen
  if(s.diashowActive){
    if(s.diashowTimer){clearTimeout(s.diashowTimer);s.diashowTimer=null;}
    wasDiashowStep(uid);
  }
}

function playDrumRoll(durationMs){
  if(!soundEnabled) return;
  try{
    const ac=new(window.AudioContext||window.webkitAudioContext)();
    const totalSec=durationMs/1000;
    const now=ac.currentTime+0.02;

    // Master compressor for punch
    const comp=ac.createDynamicsCompressor();
    comp.threshold.value=-12; comp.knee.value=4;
    comp.ratio.value=6; comp.attack.value=0.001; comp.release.value=0.08;
    comp.connect(ac.destination);

    // Reverb convolver for room feel
    const revLen=ac.sampleRate*1.2;
    const revBuf=ac.createBuffer(2,revLen,ac.sampleRate);
    for(let ch=0;ch<2;ch++){const d=revBuf.getChannelData(ch);for(let i=0;i<revLen;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/revLen,2.2);}
    const rev=ac.createConvolver(); rev.buffer=revBuf;
    const revGain=ac.createGain(); revGain.gain.value=0.18;
    rev.connect(revGain); revGain.connect(comp);

    const sr=ac.sampleRate;

    // Helper: single snare hit
    function snareHit(t, vol){
      const hitLen=0.06;
      // Noise layer (snare wires)
      const nBuf=ac.createBuffer(1,Math.ceil(sr*hitLen),sr);
      const nd=nBuf.getChannelData(0);
      for(let i=0;i<nd.length;i++) nd[i]=(Math.random()*2-1);
      const nSrc=ac.createBufferSource(); nSrc.buffer=nBuf;
      const hp=ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=2200; hp.Q.value=0.8;
      const pEq=ac.createBiquadFilter(); pEq.type='peaking'; pEq.frequency.value=6000; pEq.gain.value=9; pEq.Q.value=1.0;
      const nGain=ac.createGain();
      nGain.gain.setValueAtTime(vol*1.1,t);
      nGain.gain.exponentialRampToValueAtTime(0.0001,t+hitLen*0.85);
      nSrc.connect(hp); hp.connect(pEq); pEq.connect(nGain); nGain.connect(comp);
      nSrc.connect(hp); pEq.connect(rev);
      nSrc.start(t); nSrc.stop(t+hitLen+0.01);
      // Body tone
      const bodyOsc=ac.createOscillator(); bodyOsc.type='triangle';
      bodyOsc.frequency.setValueAtTime(220,t);
      bodyOsc.frequency.exponentialRampToValueAtTime(75,t+0.035);
      const bodyGain=ac.createGain();
      bodyGain.gain.setValueAtTime(vol*0.75,t);
      bodyGain.gain.exponentialRampToValueAtTime(0.0001,t+0.045);
      bodyOsc.connect(bodyGain); bodyGain.connect(comp);
      bodyOsc.start(t); bodyOsc.stop(t+0.055);
      // Click transient
      const cBuf=ac.createBuffer(1,Math.ceil(sr*0.005),sr);
      const cd=cBuf.getChannelData(0);
      for(let i=0;i<cd.length;i++) cd[i]=(Math.random()*2-1)*Math.exp(-i/(sr*0.001));
      const cSrc=ac.createBufferSource(); cSrc.buffer=cBuf;
      const cGain=ac.createGain(); cGain.gain.setValueAtTime(vol*0.7,t);
      cSrc.connect(cGain); cGain.connect(comp);
      cSrc.start(t); cSrc.stop(t+0.007);
    }

    // Helper: hi-hat tick
    function hiHat(t, vol){
      const hLen=0.022;
      const hBuf=ac.createBuffer(1,Math.ceil(sr*hLen),sr);
      const hd=hBuf.getChannelData(0);
      for(let i=0;i<hd.length;i++) hd[i]=(Math.random()*2-1);
      const hSrc=ac.createBufferSource(); hSrc.buffer=hBuf;
      const hhp=ac.createBiquadFilter(); hhp.type='highpass'; hhp.frequency.value=8000; hhp.Q.value=0.5;
      const hGain=ac.createGain();
      hGain.gain.setValueAtTime(vol*0.55,t);
      hGain.gain.exponentialRampToValueAtTime(0.0001,t+hLen*0.8);
      hSrc.connect(hhp); hhp.connect(hGain); hGain.connect(comp);
      hSrc.start(t); hSrc.stop(t+hLen+0.005);
    }

    // Accelerating roll with crescendo + hi-hats
    let t=now;
    let interval=0.22;
    const minInterval=0.032;
    while(t < now+totalSec-0.2){
      const progress=(t-now)/totalSec;
      const vol=0.32+progress*0.65;
      snareHit(t, vol);
      // Hi-hat on offbeats
      if(interval>0.07) hiHat(t+interval*0.5, vol*0.5);
      interval=Math.max(minInterval, 0.22-progress*0.19);
      t+=interval;
    }

    // ── Final crash ──
    const rimT=now+totalSec-0.1;
    snareHit(rimT, 1.3);

    // Deep bass drum
    const bdOsc=ac.createOscillator(); bdOsc.type='sine';
    bdOsc.frequency.setValueAtTime(200,rimT);
    bdOsc.frequency.exponentialRampToValueAtTime(32,rimT+0.35);
    const bdGain=ac.createGain();
    bdGain.gain.setValueAtTime(1.4,rimT);
    bdGain.gain.exponentialRampToValueAtTime(0.0001,rimT+0.38);
    bdOsc.connect(bdGain); bdGain.connect(comp);
    bdOsc.start(rimT); bdOsc.stop(rimT+0.4);

    // Bass overtone
    const bdOsc2=ac.createOscillator(); bdOsc2.type='sine';
    bdOsc2.frequency.setValueAtTime(380,rimT);
    bdOsc2.frequency.exponentialRampToValueAtTime(100,rimT+0.18);
    const bdGain2=ac.createGain();
    bdGain2.gain.setValueAtTime(0.55,rimT);
    bdGain2.gain.exponentialRampToValueAtTime(0.0001,rimT+0.2);
    bdOsc2.connect(bdGain2); bdGain2.connect(comp);
    bdOsc2.start(rimT); bdOsc2.stop(rimT+0.22);

    // Cymbal crash noise
    const cyLen=1.1;
    const cyBuf=ac.createBuffer(1,Math.ceil(sr*cyLen),sr);
    const cyd=cyBuf.getChannelData(0);
    for(let i=0;i<cyd.length;i++) cyd[i]=(Math.random()*2-1)*Math.pow(1-i/(sr*cyLen),1.5);
    const cySrc=ac.createBufferSource(); cySrc.buffer=cyBuf;
    const cyHp=ac.createBiquadFilter(); cyHp.type='highpass'; cyHp.frequency.value=5000;
    const cyBp=ac.createBiquadFilter(); cyBp.type='bandpass'; cyBp.frequency.value=9000; cyBp.Q.value=0.6;
    const cyGain=ac.createGain();
    cyGain.gain.setValueAtTime(0.7,rimT);
    cyGain.gain.exponentialRampToValueAtTime(0.0001,rimT+cyLen);
    cySrc.connect(cyHp); cyHp.connect(cyBp); cyBp.connect(cyGain); cyGain.connect(comp);
    cyGain.connect(rev);
    cySrc.start(rimT); cySrc.stop(rimT+cyLen+0.05);

  }catch(e){}
}

function playBallImpact(){
  try{
    const ac=new(window.AudioContext||window.webkitAudioContext)();
    const t=ac.currentTime;
    // --- thud: low sine burst (ball hitting bottom) ---
    const osc=ac.createOscillator();
    const env=ac.createGain();
    osc.type='sine';
    osc.frequency.setValueAtTime(180,t);
    osc.frequency.exponentialRampToValueAtTime(55,t+0.12);
    env.gain.setValueAtTime(0,t);
    env.gain.linearRampToValueAtTime(0.7,t+0.008);
    env.gain.exponentialRampToValueAtTime(0.001,t+0.22);
    osc.connect(env);env.connect(ac.destination);
    osc.start(t);osc.stop(t+0.25);
    // --- click transient: short noise burst ---
    const buf=ac.createBuffer(1,ac.sampleRate*0.04,ac.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
    const ns=ac.createBufferSource();
    const nf=ac.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=900; nf.Q.value=0.8;
    const ng=ac.createGain(); ng.gain.setValueAtTime(0.35,t);
    ns.buffer=buf;ns.connect(nf);nf.connect(ng);ng.connect(ac.destination);
    ns.start(t);
    // --- tiny bounce echo at t+0.48s ---
    const osc2=ac.createOscillator();
    const env2=ac.createGain();
    osc2.type='sine';
    osc2.frequency.setValueAtTime(130,t+0.48);
    osc2.frequency.exponentialRampToValueAtTime(45,t+0.56);
    env2.gain.setValueAtTime(0,t+0.48);
    env2.gain.linearRampToValueAtTime(0.28,t+0.486);
    env2.gain.exponentialRampToValueAtTime(0.001,t+0.60);
    osc2.connect(env2);env2.connect(ac.destination);
    osc2.start(t+0.48);osc2.stop(t+0.62);
  }catch(e){}
}
function playBoing(){
  if(!soundEnabled) return;
  try{
    const ac=new(window.AudioContext||window.webkitAudioContext)();
    const t=ac.currentTime;
    const osc=ac.createOscillator();
    const g=ac.createGain();
    osc.type='sine';
    osc.frequency.setValueAtTime(300,t);
    osc.frequency.exponentialRampToValueAtTime(80,t+0.5);
    osc.frequency.exponentialRampToValueAtTime(220,t+0.9);
    osc.frequency.exponentialRampToValueAtTime(100,t+1.2);
    g.gain.setValueAtTime(0.6,t);
    g.gain.setValueAtTime(0.5,t+0.3);
    g.gain.linearRampToValueAtTime(0,t+1.3);
    osc.connect(g);g.connect(ac.destination);
    osc.start(t);osc.stop(t+1.4);
    // Add slight vibrato for boing effect
    const lfo=ac.createOscillator();
    const lfoG=ac.createGain();
    lfo.frequency.value=8;
    lfoG.gain.setValueAtTime(0,t);
    lfoG.gain.linearRampToValueAtTime(30,t+0.2);
    lfo.connect(lfoG);lfoG.connect(osc.frequency);
    lfo.start(t);lfo.stop(t+1.4);
  }catch(e){}
}

function slotApplyNumReels(uid){
  const s=slotState[uid];
  const n=s.numReels||3;
  for(let c=0;c<4;c++){
    const w=document.getElementById('slot-reel-wrap-'+c+'-'+uid);
    if(w) w.style.display=c<n?'':'none';
  }
}

function slotSizeReels(uid){
  const s = slotState[uid];
  const n = s.numReels||3;
  const wraps = [0,1,2,3].slice(0,n).map(c=>document.getElementById('slot-reel-wrap-'+c+'-'+uid));
  if(!wraps[0]) return;
  const cellH = wraps[0].clientHeight;
  if(cellH < 10) return;
  s.cellH = cellH;

  // Rebuild strips — slotBuildStrip fits font to actual reel width
  for(let c=0;c<n;c++){
    slotBuildStrip(c, uid);
    slotRenderPos(c, uid);
  }

  // Size STOP button — derive size from the machine height, not the btn-row
  // (btn-row can report near-zero during first layout pass)
  const machine = document.getElementById('slot-play-'+uid);
  const btnRow  = document.getElementById('slot-btn-row-'+uid);
  const bStop   = document.getElementById('slot-btn-stop-'+uid);
  if(bStop && machine){
    // Use btn-row clientHeight if it's large enough, otherwise fall back to 15% of machine
    const rowH   = btnRow ? btnRow.clientHeight : 0;
    const machH  = machine.clientHeight || 0;
    const base   = rowH >= 50 ? rowH : Math.max(72, Math.round(machH * 0.15));
    const stopD  = Math.round(base * 0.90);
    const safeD  = Math.max(60, stopD);          // never smaller than 60px
    bStop.style.width    = safeD+'px';
    bStop.style.height   = safeD+'px';
    bStop.style.fontSize = Math.round(safeD * 0.20)+'px';
  }

  // Compute hard minimum widget size so words are always legible (minFS=18px)
  const minFS    = 18;
  const minCellH = Math.ceil(minFS / 0.50);
  const minSymH  = Math.round(minCellH * 0.55);
  const canvas   = document.createElement('canvas');
  const ctx      = canvas.getContext('2d');
  ctx.font       = `900 ${minFS}px Arial, sans-serif`;
  const minReelWs = [0,1,2,3].slice(0,n).map(c=>{
    const words  = s.currentWords[c] || ['—'];
    const maxTW  = Math.max(...words.map(w => ctx.measureText(w).width));
    return Math.ceil(maxTW + 22);
  });
  const minWidgetW = minReelWs.reduce((a,b)=>a+b,0) + 100; // reels + padding + gaps
  const minWidgetH = minCellH + minSymH + 200;              // reel row + chrome

  const widgetEl = wraps[0].closest('.widget');
  if(widgetEl){
    widgetEl.dataset.minw = Math.max(300, minWidgetW);
    widgetEl.dataset.minh = Math.max(260, minWidgetH);
    const curW = parseInt(widgetEl.style.width)||0;
    const curH = parseInt(widgetEl.style.height)||0;
    if(curW > 0 && curW < +widgetEl.dataset.minw) widgetEl.style.width  = widgetEl.dataset.minw+'px';
    if(curH > 0 && curH < +widgetEl.dataset.minh) widgetEl.style.height = widgetEl.dataset.minh+'px';
  }
}

// ── Textarea ↔ rows Hilfsfunktionen ──
function slotRowsToText(rows){
  return rows.map(r=>r.map(w=>(w||'').trim()).join('\t')).join('\n');
}
function slotTextToRows(text){
  const rows=[];
  text.split(/\r?\n/).forEach(line=>{
    const t=line.trim(); if(!t) return;
    let parts=t.split(/\t/);
    if(parts.length<2) parts=t.split(/;/);
    if(parts.length<2) parts=t.split(/,/);
    if(parts.length<2) parts=t.split(/\s{2,}/);
    if(parts.length<2) parts=t.split(/\s+/);
    parts=parts.map(p=>p.trim()).filter(p=>p.length>0);
    const n=Math.min(4,Math.max(2,parts.length));
    const row=[];
    for(let i=0;i<n;i++) row.push(parts[i]||'');
    if(row.some(w=>w)) rows.push(row);
  });
  return rows;
}
// Detect consistent column count from rows (most frequent count, min 2, max 4)
function slotDetectNumReels(rows){
  if(!rows||!rows.length) return 3;
  const counts={};
  rows.forEach(r=>{ const n=Math.min(4,Math.max(2,r.length)); counts[n]=(counts[n]||0)+1; });
  let best=3,bestC=0;
  Object.entries(counts).forEach(([k,v])=>{ if(v>bestC||(v===bestC&&+k>best)){best=+k;bestC=v;} });
  return best;
}

function slotFillTextarea(uid){
  const ta=document.getElementById('slot-textarea-'+uid);
  if(!ta) return;
  ta.value=slotRowsToText(slotState[uid].rows);

function slotApplyTextarea(uid){
  const ta=document.getElementById('slot-textarea-'+uid);
  const text=ta?ta.value:'';
  let rows=slotTextToRows(text);
  if(!rows.length) rows=[['Wort 1','Wort 2','Wort 3']];
  const s=slotState[uid];
  s.rows=rows;
  const n=slotDetectNumReels(rows);
  s.numReels=n;
  s.stoppedReels=Array(4).fill(false);
  s.rafIds=Array(4).fill(0);
  s.pixelPos=Array(4).fill(0);
  s.centerIdx=Array(4).fill(0);
  s.currentWords=[];
  for(let c=0;c<n;c++) s.currentWords.push(rows.map(r=>r[c]||'—'));
  slotApplyNumReels(uid);
  slotInitReels(uid);
  requestAnimationFrame(()=>slotSizeReels(uid));
  slotShowTab('play',uid);
}

function slotLoadTxtToTextarea(uid, inputEl){
  const file=inputEl?.files?.[0]; if(!file) return;
  // Detect encoding: read as UTF-8 first; if replacement chars (U+FFFD) appear,
  // re-read as Windows-1252 which covers ä ö ü ß and other Western characters.
  const apply=text=>{
    const ta=document.getElementById('slot-textarea-'+uid);
    if(ta){ ta.value=(text||'').replace(/\r\n/g,'\n'); }
    inputEl.value='';
  };
  const r1=new FileReader();
  r1.onload=e=>{
    const text=e.target.result||'';
    if(text.includes('\uFFFD')){
      // UTF-8 failed → retry as Windows-1252
      const r2=new FileReader();
      r2.onload=e2=>apply(e2.target.result||'');
      r2.readAsText(file,'windows-1252');
    } else {
      apply(text);
    }
  };
  r1.readAsText(file,'UTF-8');
}

const SLOT_SYMBOLS = ['⭐','🍎','🍊','🍓','🍋','🍇','🍒','🔔','💎','🍀'];

function slotBuildStrip(col, uid){
  const s     = slotState[uid];
  const words = s.currentWords[col];
  const el    = document.getElementById('slot-reel-'+col+'-'+uid);
  const wrap  = document.getElementById('slot-reel-wrap-'+col+'-'+uid);
  if(!el) return;

  const cellH    = s.cellH || 100;
  const symH     = Math.round(cellH * 0.36);
  const symFS    = Math.round(cellH * 0.30);
  const padPx    = 10;
  const reelW    = (wrap && wrap.clientWidth > 0) ? wrap.clientWidth : 9999;
  const maxAvail = reelW - padPx * 2;

  // Shrink font until the longest word fits the reel width — never break
  const canvas = document.createElement('canvas');
  const ctx    = canvas.getContext('2d');
  let wordFS   = Math.round(cellH * 0.50);
  for(let iter = 0; iter < 40; iter++){
    ctx.font = `900 ${wordFS}px Arial, sans-serif`;
    const maxW = Math.max(...words.map(w => ctx.measureText(w).width));
    if(maxW <= maxAvail || wordFS <= 8) break;
    wordFS = Math.max(8, Math.floor(wordFS * (maxAvail / maxW) * 0.97));
  }

  let html = '';
  let symIdx = col * 3; // different start per column
  for(let rep = 0; rep < SLOT_STRIP_REPS; rep++){
    for(let i = 0; i < words.length; i++){
      const sym = SLOT_SYMBOLS[symIdx % SLOT_SYMBOLS.length];
      symIdx++;
      html += `<div class="slot-reel-cell slot-reel-word" style="height:${cellH}px;font-size:${wordFS}px;padding:0 ${padPx}px;">${escHtml(words[i])}</div>`;
      html += `<div class="slot-reel-cell slot-reel-sym"  style="height:${symH}px;font-size:${symFS}px;">${sym}</div>`;
    }
  }
  el.innerHTML = html;
  el.style.transition = 'none';
  s.stepH = s.stepH || {};
  s.stepH[col] = cellH + symH;
}

function slotRenderPos(col, uid){
  const s = slotState[uid];
  const el = document.getElementById('slot-reel-'+col+'-'+uid);
  if(!el) return;
  el.style.top = (-s.pixelPos[col])+'px';
  const n    = s.currentWords[col].length;
  const step = (s.stepH && s.stepH[col]) || (s.cellH||100);
  // centerIdx = which word (0…n-1) is currently in the viewport center
  s.centerIdx[col] = Math.round(s.pixelPos[col] / step) % n;
  if(s.centerIdx[col]<0) s.centerIdx[col]+=n;
}

function slotBigBtn(uid){
  const s = slotState[uid];
  if(s.phase==='idle') slotMainStart(uid);
  else if(s.phase==='spinning') slotMainStop(uid);
}

function slotMainStart(uid){
  const s = slotState[uid];
  if(s.phase!=='idle') return;
  const n = s.numReels||3;
  s.phase='spinning'; s.nextStopReel=0;
  s.stoppedReels=Array(4).fill(false); s.stoppedCount=0;
  const btnStop = document.getElementById('slot-btn-stop-'+uid);
  const btnLabel = document.getElementById('slot-btn-label-'+uid);
  const btnSub = document.getElementById('slot-btn-sub-'+uid);
  if(btnStop){ btnStop.classList.remove('idle'); btnStop.disabled=false; }
  if(btnLabel) btnLabel.textContent=T('slotStop');
  if(btnSub) btnSub.textContent=T('slotAnhalten');
  for(let c=0;c<n;c++) document.getElementById('slot-reel-wrap-'+c+'-'+uid)?.classList.remove('reel-win');
  ['l','r'].forEach(side=>{
    const el=document.getElementById('slot-star-'+side+'-'+uid);
    if(el){el.innerHTML='&#9733;';el.classList.remove('win');}
  });
  const speeds=[3.2,3.8,2.9,3.5];
  for(let c=0;c<n;c++) slotAnimReel(c,uid,speeds[c]);
  playSound('Piano', 0.85);
}

function slotMainStop(uid){
  const s = slotState[uid];
  if(s.phase!=='spinning') return;
  const n = s.numReels||3;
  const c = s.nextStopReel;
  if(c>=n) return;
  slotStopReel(c,uid);
  s.nextStopReel++;
  if(s.nextStopReel>=n){
    const btnStop = document.getElementById('slot-btn-stop-'+uid);
    const btnLabel = document.getElementById('slot-btn-label-'+uid);
    const btnSub = document.getElementById('slot-btn-sub-'+uid);
    if(btnStop){ btnStop.disabled=true; }
    if(btnLabel) btnLabel.textContent='…';
  }
}

function slotAnimReel(col, uid, speed){
  // speed was originally px/frame at ~60 fps → convert to px/second
  // so the visual speed is identical on 60 Hz and correct on any refresh rate
  const pxPerSec = speed * 60;
  const s = slotState[uid];
  let lastTs = null;
  function frame(ts){
    if(s.stoppedReels[col]) return;
    if(lastTs === null) lastTs = ts;
    // Cap delta to 100 ms to avoid huge jumps after tab switches / pauses
    const dt = Math.min((ts - lastTs) / 1000, 0.1);
    lastTs = ts;
    const n    = s.currentWords[col].length;
    const step = (s.stepH && s.stepH[col]) || (s.cellH||100);
    s.pixelPos[col] += pxPerSec * dt;
    // Wrap within safe range
    if(s.pixelPos[col] > (SLOT_STRIP_REPS-2)*n*step) s.pixelPos[col]-=(SLOT_STRIP_REPS-4)*n*step;
    slotRenderPos(col,uid);
    s.rafIds[col]=requestAnimationFrame(frame);
  }
  s.rafIds[col]=requestAnimationFrame(frame);
}

function slotStopReel(col, uid){
  const s = slotState[uid];
  const n = s.numReels||3;
  if(s.stoppedReels[col]) return;
  s.stoppedReels[col]=true;
  cancelAnimationFrame(s.rafIds[col]);
  // Snap to nearest WORD cell (step = word+symbol height)
  const step = (s.stepH && s.stepH[col]) || (s.cellH||100);
  s.pixelPos[col]=Math.round(s.pixelPos[col]/step)*step;
  slotRenderPos(col,uid);
  try{const ac=new(window.AudioContext||window.webkitAudioContext)();playPop(ac,0.85);}catch(e){}
  s.stoppedCount++;
  if(s.stoppedCount===n){ s.phase='done'; setTimeout(()=>slotCheckResult(uid),80); }
}

function slotCheckResult(uid){
  const s=slotState[uid];
  const n=s.numReels||3;
  const idx=s.centerIdx.slice(0,n);

  // Full win: all reels show same row index
  const fullWin=idx.every(v=>v===idx[0]);

  // Part win: at least 2 adjacent or any 2 matching (only relevant for n>=3)
  let partWin=false;
  let matchPairs=[];
  if(!fullWin && n>=3){
    for(let a=0;a<n;a++) for(let b=a+1;b<n;b++){
      if(idx[a]===idx[b]) matchPairs.push([a,b]);
    }
    partWin=matchPairs.length>0;
  }

  // Points by number of reels
  // 2 reels: full=1, part=– ; 3 reels: full=5, part=1 ; 4 reels: full=10, part=1
  let gained=0;
  const pointsFull={2:1,3:5,4:10};
  const pointsPart={2:0,3:1,4:1};

  if(fullWin){
    gained=pointsFull[n]||5;
    for(let c=0;c<n;c++) document.getElementById('slot-reel-wrap-'+c+'-'+uid)?.classList.add('reel-win');
    ['l','r'].forEach(side=>{const el=document.getElementById('slot-star-'+side+'-'+uid);if(el){el.innerHTML='&#11088;';el.classList.add('win');}});
    for(let i=0;i<gained;i++) setTimeout(()=>playSound('Glocke',0.85), i*160);
  } else if(partWin){
    gained=pointsPart[n]||1;
    const winCols=new Set(matchPairs.flat());
    winCols.forEach(c=>document.getElementById('slot-reel-wrap-'+c+'-'+uid)?.classList.add('reel-win'));
    for(let i=0;i<gained;i++) setTimeout(()=>playSound('Glocke',0.75), i*160);
  } else {
    try{const ac=new(window.AudioContext||window.webkitAudioContext)();playPop(ac,0.4);}catch(e){}
  }
  s.points+=gained;
  const ptsEl=document.getElementById('slot-pts-'+uid);
  if(ptsEl) ptsEl.textContent=s.points+' PKT';
  const btnStop=document.getElementById('slot-btn-stop-'+uid);
  const btnLabel=document.getElementById('slot-btn-label-'+uid);
  const btnSub=document.getElementById('slot-btn-sub-'+uid);
  if(btnStop){ btnStop.disabled=false; btnStop.classList.add('idle'); }
  if(btnLabel) btnLabel.textContent=T('slotNeuesSpiel');
  if(btnSub) btnSub.textContent=T('slotTippen');
  s.phase='idle'; s.nextStopReel=0;
}

// WIDGET: SPIELE (Rad · Slot · Janken)
// ════════════════════════════════════════════════
function buildSpiele(body, uid){
  body.style.cssText='padding:0;display:flex;flex-direction:column;overflow:hidden;flex:1 1 auto;min-height:0;box-sizing:border-box;';

  // Tab bar
  const tabBar=document.createElement('div');
  tabBar.style.cssText='display:flex;gap:6px;align-items:center;padding:6px 10px 5px;background:rgba(0,0,0,0.28);flex-shrink:0;flex-wrap:wrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;';
  tabBar.style.cssText += '-webkit-scrollbar{display:none}';
  tabBar.classList.add('timer-mode-bar');
  ['rad','slot','puzzle','zuordnen','ampel'].forEach((tab,i)=>{
    const labelKeys={rad:'spieleRad',slot:'spieleSlot',puzzle:'spielePuzzle',ampel:'spieleAmpel',zuordnen:'spieleZuordnen'};
    const icons={rad:'🎡',slot:'🎰',puzzle:'🧩',ampel:'🚦',zuordnen:'🔗'};
    const btn=document.createElement('button');
    btn.className='timer-mode-btn spiele-tab-btn'+(i===0?' active-tmode':'');
    btn.id=`spiele-tab-${tab}-${uid}`;
    btn.textContent=icons[tab]+' '+T(labelKeys[tab]);
    btn.onclick=()=>spieleShowTab(tab,uid);
    tabBar.appendChild(btn);
  });
  body.appendChild(tabBar);

  // Panels
  ['rad','slot','puzzle','zuordnen','ampel'].forEach((tab,i)=>{
    const panel=document.createElement('div');
    panel.id=`spiele-panel-${tab}-${uid}`;
    panel.style.cssText=`flex:1;min-height:0;overflow:hidden;display:${i===0?'flex':'none'};flex-direction:column;`;
    body.appendChild(panel);
  });

  // Build each sub-widget into its panel
  // Note: buildWheel/buildSlot overwrite body.style — restore display after
  const radPanel  = document.getElementById(`spiele-panel-rad-${uid}`);
  const slotPanel = document.getElementById(`spiele-panel-slot-${uid}`);
  buildWheel(radPanel,  uid*1000+1);
  radPanel.style.display  = 'flex';   // restore (buildWheel may overwrite)
  buildSlot(slotPanel, uid*1000+2);
  slotPanel.style.display = 'none';   // restore hidden state

  // Janken panel — starts hidden, style must NOT set display:flex here
  // ── Puzzle panel ──
  const puzzlePanel = document.getElementById(`spiele-panel-puzzle-${uid}`);
  // Nur Layout-Eigenschaften setzen, display bleibt 'none' (von panel-Erstellungs-Loop)
  puzzlePanel.style.flexDirection = 'column';
  puzzlePanel.style.overflow = 'hidden';
  buildPuzzlePanel(puzzlePanel, uid);

  // ── Ampel panel ──
  buildAmpelPanel(document.getElementById(`spiele-panel-ampel-${uid}`), uid);

  // ── Zuordnen panel ──
  buildZuordnenPanel(document.getElementById(`spiele-panel-zuordnen-${uid}`), uid);
}
