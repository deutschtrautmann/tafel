      <option value="80">80</option>
    </select>
    <div class="ddt-sep"></div>
  </div>
  <!-- Pen size -->
  <select class="ddt-size-sel" id="ddt-sz" onchange="ddtState.sz=parseInt(this.value)" title="Stiftgröße">
    <option value="2">2px</option>
    <option value="5" selected>5px</option>
    <option value="10">10px</option>
    <option value="20">20px</option>
    <option value="40">40px</option>
  </select>
  <!-- Photo insert -->
  <label class="ddt-btn" title="Foto einfügen" style="cursor:pointer;font-size:12px;font-weight:700;padding:0 10px;width:auto;">
    Foto
    <input type="file" accept="image/*" style="display:none;" onchange="ddtInsertPhoto(this.files[0]);this.value=''">
  </label>
  <!-- Undo / Save / Clear -->
  <button class="ddt-btn ddt-undo-btn" id="ddt-undo" onclick="ddtUndo()" title="Rückgängig (Strg+Z)">↩</button>
  <button class="ddt-btn" onclick="ddtSave()" title="Speichern">💾</button>
  <button class="ddt-btn" onclick="ddtClear()" title="Löschen">
    <svg viewBox="0 0 18 18" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="3" y="5" width="12" height="11" rx="2" stroke="currentColor" stroke-width="1.4"/>
      <line x1="1.5" y1="5" x2="16.5" y2="5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M7 5V3.5Q7 2.5 8 2.5H10Q11 2.5 11 3.5V5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      <line x1="7" y1="8" x2="7" y2="13" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      <line x1="11" y1="8" x2="11" y2="13" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    </svg>
  </button>
  <div class="ddt-sep"></div>
  <!-- Colors -->
  <div id="ddt-color-row" style="display:flex;gap:5px;align-items:center;flex-shrink:0;">
    <div class="ddt-color selected" style="background:#111111"                                      id="ddtc-0"  onclick="ddtSetColor('#111111',this)"  title="Schwarz"></div>
    <div class="ddt-color"          style="background:#6b7280"                                      id="ddtc-1"  onclick="ddtSetColor('#6b7280',this)"  title="Grau"></div>
    <div class="ddt-color"          style="background:#ffffff;border:2px solid rgba(0,0,0,0.18);"   id="ddtc-2"  onclick="ddtSetColor('#ffffff',this)"  title="Weiß"></div>
    <div class="ddt-color"          style="background:#3498db"                                      id="ddtc-3"  onclick="ddtSetColor('#3498db',this)"  title="Blau"></div>
    <div class="ddt-color"          style="background:#f1c40f"                                      id="ddtc-4"  onclick="ddtSetColor('#f1c40f',this)"  title="Gelb"></div>
    <div class="ddt-color"          style="background:#e74c3c"                                      id="ddtc-5"  onclick="ddtSetColor('#e74c3c',this)"  title="Rot"></div>
    <div class="ddt-color"          style="background:#2ecc71"                                      id="ddtc-6"  onclick="ddtSetColor('#2ecc71',this)"  title="Grün"></div>
    <div class="ddt-color"          style="background:#f39c12"                                      id="ddtc-7"  onclick="ddtSetColor('#f39c12',this)"  title="Orange"></div>
    <div class="ddt-color"          style="background:#7b4f2e"                                      id="ddtc-8"  onclick="ddtSetColor('#7b4f2e',this)"  title="Braun"></div>
    <div class="ddt-color"          style="background:#9b59b6"                                      id="ddtc-9"  onclick="ddtSetColor('#9b59b6',this)"  title="Lila"></div>
    <div class="ddt-color"          style="background:#e91e8c"                                      id="ddtc-10" onclick="ddtSetColor('#e91e8c',this)"  title="Rosa"></div>
  </div>
  <!-- Fullscreen / Close -->
  <button class="ddt-fs" onclick="toggleFullscreen()" title="Vollbild">⛶</button>
  <button class="ddt-close" onclick="closeDesktopDraw()" title="Schließen">✕</button>
</div>
<div id="desktop-draw-overlay">
  <canvas id="desktop-draw-canvas"></canvas>
</div>

<script>
// ══════════════════════════════════════════════════════
//  DESKTOP DRAW — vollbild Zeichenbrett über den Desktop
// ══════════════════════════════════════════════════════
const ddtState={
  color:'#000000', sz:5, tool:'pen',
  drawing:false, lx:0, ly:0,
  undoStack:[],
  textActive:false, textX:0, textY:0, textStr:'', textSnapshot:null,
  cursorVis:true, cursorTimer:null
};

function openDesktopDraw(){
  const overlay=document.getElementById('desktop-draw-overlay');
  const toolbar=document.getElementById('desktop-draw-toolbar');
  const cv=document.getElementById('desktop-draw-canvas');
  if(!overlay||!cv) return;
  cv.width=window.innerWidth;
  cv.height=window.innerHeight;
  // White background
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#ffffff';
  ctx.fillRect(0,0,cv.width,cv.height);
  ddtState.undoStack=[];
  ddtState.drawing=false;
  ddtState.textActive=false;
  ddtState.textStr='';
  const undoBtn=document.getElementById('ddt-undo');
  if(undoBtn) undoBtn.classList.remove('has-undo');
  // Hide normal topbar, show draw toolbar
  const topbar=document.getElementById('topbar');
  const clockWrap=document.getElementById('clock-wrap');
  if(topbar) topbar.style.display='none';
  if(clockWrap) clockWrap.style.display='none';
  overlay.classList.add('active');
  toolbar.classList.add('active');
  ddtInitEvents();
  cv.focus();
}

function closeDesktopDraw(){
  ddtCommitText();
  const overlay=document.getElementById('desktop-draw-overlay');
  const toolbar=document.getElementById('desktop-draw-toolbar');
  overlay.classList.remove('active');
  toolbar.classList.remove('active');
  ddtStopCursorBlink();
  ddtState.drawing=false;
  // Restore normal topbar
  const topbar=document.getElementById('topbar');
  const clockWrap=document.getElementById('clock-wrap');
  if(topbar) topbar.style.display='';
  if(clockWrap) clockWrap.style.display='';
}

function ddtCanvas(){ return document.getElementById('desktop-draw-canvas'); }
function ddtCtx(){ return ddtCanvas().getContext('2d'); }

function ddtGetP(e){
  const cv=ddtCanvas();
  const r=cv.getBoundingClientRect();
  const sx=cv.width/r.width, sy=cv.height/r.height;
  if(e.touches) return{x:(e.touches[0].clientX-r.left)*sx, y:(e.touches[0].clientY-r.top)*sy};
  return{x:(e.clientX-r.left)*sx, y:(e.clientY-r.top)*sy};
}

function ddtStroke(x1,y1,x2,y2){
  if(ddtState.tool==='marker'){
    // Marker: Pfad auf Offscreen-Canvas erweitern (kein direktes Zeichnen hier)
    const oc=ddtState._markerOC;
    if(!oc) return;
    const octx=oc.getContext('2d');
    octx.lineTo(x2,y2);
    octx.stroke();
    // Vorschau: Hauptcanvas = Snapshot + Offscreen mit Alpha
    const cv=ddtCanvas(); const ctx=cv.getContext('2d');
    if(ddtState._markerSnap) ctx.putImageData(ddtState._markerSnap,0,0);
    ctx.save();
    ctx.globalAlpha=0.35;
    ctx.globalCompositeOperation='multiply';
    ctx.drawImage(oc,0,0);
    ctx.restore();
    return;
  }
  const ctx=ddtCtx();
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
  if(ddtState.tool==='eraser'){
    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=1; ctx.strokeStyle='#ffffff'; ctx.lineWidth=ddtState.sz*3;
  } else {
    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=1; ctx.strokeStyle=ddtState.color; ctx.lineWidth=ddtState.sz;
  }
  ctx.lineCap='round'; ctx.lineJoin='round'; ctx.stroke();
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
}

function ddtMarkerStart(x,y){
  const cv=ddtCanvas();
  // Offscreen-Canvas in gleicher Größe
  const oc=document.createElement('canvas');
  oc.width=cv.width; oc.height=cv.height;
  const octx=oc.getContext('2d');
  octx.lineCap='round'; octx.lineJoin='round';
  octx.strokeStyle=ddtState.color;
  octx.lineWidth=ddtState.sz*4;
  octx.beginPath(); octx.moveTo(x,y);
  ddtState._markerOC=oc;
  ddtState._markerSnap=cv.getContext('2d').getImageData(0,0,cv.width,cv.height);
}

function ddtMarkerEnd(){
  const cv=ddtCanvas(); const ctx=cv.getContext('2d');
  const oc=ddtState._markerOC;
  if(!oc) return;
  // Snapshot wiederherstellen und Marker-Strich einmalig mit Alpha einbetten
  if(ddtState._markerSnap) ctx.putImageData(ddtState._markerSnap,0,0);
  ctx.save();
  ctx.globalAlpha=0.35;
  ctx.globalCompositeOperation='multiply';
  ctx.drawImage(oc,0,0);
  ctx.restore();
  ddtState._markerOC=null;
  ddtState._markerSnap=null;
}

function ddtPushUndo(){
  const cv=ddtCanvas();
  const ctx=cv.getContext('2d');
  const snap=ctx.getImageData(0,0,cv.width,cv.height);
  ddtState.undoStack.push(snap);
  if(ddtState.undoStack.length>40) ddtState.undoStack.shift();
  const btn=document.getElementById('ddt-undo');
  if(btn) btn.classList.add('has-undo');
}

function ddtUndo(){
  if(ddtState.undoStack.length===0) return;
  const snap=ddtState.undoStack.pop();
  const cv=ddtCanvas();
  cv.getContext('2d').putImageData(snap,0,0);
  const btn=document.getElementById('ddt-undo');
  if(btn){btn.classList.toggle('has-undo', ddtState.undoStack.length>0);}
}

function ddtClear(){
  ddtCommitText();
  ddtPushUndo();
  const cv=ddtCanvas();
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#ffffff';
  ctx.fillRect(0,0,cv.width,cv.height);
}

function ddtSave(){
  ddtCommitText();
  const cv=ddtCanvas();
  // Composite onto white for PNG export
  const exp=document.createElement('canvas');
  exp.width=cv.width; exp.height=cv.height;
  const ectx=exp.getContext('2d');
  ectx.fillStyle='#fff'; ectx.fillRect(0,0,exp.width,exp.height);
  ectx.drawImage(cv,0,0);
  const a=document.createElement('a');
  a.download='zeichnung.png'; a.href=exp.toDataURL('image/png'); a.click();
}

function ddtSetColor(color, el){
  ddtState.color=color;
  document.querySelectorAll('.ddt-color').forEach(d=>d.classList.remove('selected'));
  el.classList.add('selected');
}

function ddtSetTool(tool, btn){
  ddtCommitText();
  ddtState.tool=tool;
  document.querySelectorAll('.ddt-btn[id^="ddt-pen"],#ddt-marker,#ddt-text,#ddt-eraser')
    .forEach(b=>b.classList.remove('active-tool'));
  btn.classList.add('active-tool');
  const textOpts=document.getElementById('ddt-text-opts');
  const szSel=document.getElementById('ddt-sz');
  if(textOpts){ textOpts.classList.toggle('visible', tool==='text'); }
  if(szSel){ szSel.style.display=(tool==='text')?'none':''; }
  const cv=ddtCanvas();
  if(cv){ cv.style.cursor=(tool==='eraser')?'cell':(tool==='text')?'text':'crosshair'; }
}

// ── Text tool ──
function ddtRenderTextCursor(){
  const st=ddtState;
  if(!st.textSnapshot) return;
  const cv=ddtCanvas(); const ctx=cv.getContext('2d');
  ctx.putImageData(st.textSnapshot,0,0);
  const font=document.getElementById('ddt-textfont')?.value||'Arial';
  const size=parseInt(document.getElementById('ddt-textsize')?.value||'20');
  ctx.globalAlpha=1; ctx.fillStyle=st.color;
  ctx.font=`${size}px ${font},sans-serif`;
  ctx.textBaseline='alphabetic';
  ctx.fillText(st.textStr, st.textX, st.textY);
  if(st.cursorVis){
    const tw=ctx.measureText(st.textStr).width;
    ctx.beginPath();
    ctx.moveTo(st.textX+tw+1, st.textY-size*0.85);
    ctx.lineTo(st.textX+tw+1, st.textY+size*0.2);
    ctx.strokeStyle=st.color; ctx.lineWidth=1.5; ctx.globalAlpha=0.85; ctx.stroke(); ctx.globalAlpha=1;
  }
}
function ddtStartCursorBlink(){ ddtStopCursorBlink(); ddtState.cursorVis=true; ddtState.cursorTimer=setInterval(()=>{ddtState.cursorVis=!ddtState.cursorVis;ddtRenderTextCursor();},530); }
function ddtStopCursorBlink(){ if(ddtState.cursorTimer){clearInterval(ddtState.cursorTimer);ddtState.cursorTimer=null;} }
function ddtCommitText(){
  const st=ddtState; if(!st.textActive) return;
  ddtStopCursorBlink();
  ddtPushUndo();
  const cv=ddtCanvas(); const ctx=cv.getContext('2d');
  ctx.putImageData(st.textSnapshot,0,0);
  if(st.textStr.trim()!==''){
    const font=document.getElementById('ddt-textfont')?.value||'Arial';
    const size=parseInt(document.getElementById('ddt-textsize')?.value||'20');
    ctx.globalAlpha=1; ctx.fillStyle=st.color;
    ctx.font=`${size}px ${font},sans-serif`;
    ctx.textBaseline='alphabetic';
    ctx.fillText(st.textStr, st.textX, st.textY);
  }
  st.textActive=false; st.textStr=''; st.textSnapshot=null;
}
function ddtUpdateTextCursor(){ if(ddtState.textActive) ddtRenderTextCursor(); }

// ── Photo insert ──
function ddtInsertPhoto(file){
  if(!file) return;
  const cv=ddtCanvas(); if(!cv) return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{ _ddtStartPhotoOverlay(img); };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

// ── Desktop Draw: interaktives Foto-Overlay mit Drag & Resize ──
const _ddtPhotoState={};

function _ddtStartPhotoOverlay(img){
  const cv=ddtCanvas(); if(!cv) return;
  _ddtEndPhotoOverlay(false); // vorheriges entfernen

  const cvR=cv.getBoundingClientRect();
  const maxW=cvR.width*0.6, maxH=cvR.height*0.6;
  const scale=Math.min(maxW/img.naturalWidth, maxH/img.naturalHeight, 1);
  const w=Math.round(img.naturalWidth*scale);
  const h=Math.round(img.naturalHeight*scale);
  const x=Math.round((cvR.width-w)/2);
  const y=Math.round((cvR.height-h)/2);

  const ps=_ddtPhotoState.cur={img,x,y,w,h,dragging:false,resizing:false,dx:0,dy:0};
  ps.snapshot=cv.getContext('2d').getImageData(0,0,cv.width,cv.height);

  // Overlay über das Canvas (fixed, deckt genau den Canvas ab)
  const ov=document.createElement('div');
  ov.id='ddt-photo-ov';
  ov.style.cssText=`position:fixed;left:${cvR.left}px;top:${cvR.top}px;width:${cvR.width}px;height:${cvR.height}px;z-index:10050;touch-action:none;cursor:default;`;

  // Rahmen
  const frame=document.createElement('div');
  frame.id='ddt-photo-frame';
  frame.style.cssText=`position:absolute;border:2px dashed ${_accentRgb(0.9)};border-radius:3px;box-sizing:border-box;cursor:move;user-select:none;`;

  // Resize-Handle (rechts unten)
  const rh=document.createElement('div');
  rh.style.cssText=`position:absolute;right:-7px;bottom:-7px;width:18px;height:18px;background:${_accentRgb(0.95)};border-radius:4px;cursor:nwse-resize;z-index:2;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;`;
  rh.textContent='↘';
  frame.appendChild(rh);

  // Einbetten-Button
  const commitBtn=document.createElement('button');
  commitBtn.textContent=T('drawEinbetten');
  commitBtn.style.cssText=`position:absolute;top:-34px;left:50%;transform:translateX(-50%);background:${_accentHex()};color:#fff;border:none;border-radius:8px;padding:4px 14px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.4);z-index:3;`;
  commitBtn.onmousedown=e=>e.stopPropagation();
  commitBtn.ontouchstart=e=>e.stopPropagation();
  commitBtn.onclick=e=>{ e.stopPropagation(); _ddtEndPhotoOverlay(true); };

  // Abbrechen-Button
  const cancelBtn=document.createElement('button');
  cancelBtn.textContent='✕';
  cancelBtn.style.cssText='position:absolute;top:-34px;right:-4px;background:rgba(248,113,113,0.9);color:#fff;border:none;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:800;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.3);z-index:3;';
  cancelBtn.onmousedown=e=>e.stopPropagation();
  cancelBtn.ontouchstart=e=>e.stopPropagation();
  cancelBtn.onclick=e=>{ e.stopPropagation(); _ddtEndPhotoOverlay(false); };

  frame.appendChild(commitBtn);
  frame.appendChild(cancelBtn);
  ov.appendChild(frame);
  document.body.appendChild(ov);

  // Vorschau zeichnen + Rahmen positionieren
  function syncFrame(){
    const s=_ddtPhotoState.cur; if(!s) return;
    frame.style.left=s.x+'px';
    frame.style.top=s.y+'px';
    frame.style.width=s.w+'px';
    frame.style.height=s.h+'px';
    const ctx=cv.getContext('2d');
    const scaleX=cv.width/cvR.width, scaleY=cv.height/cvR.height;
    if(s.snapshot) ctx.putImageData(s.snapshot,0,0);
    ctx.globalAlpha=0.85;
    ctx.drawImage(s.img, s.x*scaleX, s.y*scaleY, s.w*scaleX, s.h*scaleY);
    ctx.globalAlpha=1;
  }
  syncFrame();

  // Drag
  function onDragStart(e){
    const t=e.target;
    if(t===rh||t===commitBtn||t===cancelBtn) return;
    e.preventDefault(); e.stopPropagation();
    const s=_ddtPhotoState.cur; if(!s) return;
    s.dragging=true;
    const cx=e.touches?e.touches[0].clientX:e.clientX;
    const cy=e.touches?e.touches[0].clientY:e.clientY;
    const or=ov.getBoundingClientRect();
    s.dx=cx-or.left-s.x; s.dy=cy-or.top-s.y;
  }
  function onDragMove(e){
    const s=_ddtPhotoState.cur; if(!s||!s.dragging) return;
    e.preventDefault();
    const cx=e.touches?e.touches[0].clientX:e.clientX;
    const cy=e.touches?e.touches[0].clientY:e.clientY;
    const or=ov.getBoundingClientRect();
    s.x=Math.max(0,Math.min(ov.clientWidth-s.w, cx-or.left-s.dx));
    s.y=Math.max(0,Math.min(ov.clientHeight-s.h, cy-or.top-s.dy));
    syncFrame();
  }
  function onDragEnd(){ const s=_ddtPhotoState.cur; if(s) s.dragging=false; }

  ov.addEventListener('mousedown',onDragStart);
  ov.addEventListener('touchstart',onDragStart,{passive:false});
  document.addEventListener('mousemove',onDragMove);
  document.addEventListener('touchmove',onDragMove,{passive:false});
  document.addEventListener('mouseup',onDragEnd);
  document.addEventListener('touchend',onDragEnd);
  ps._rmDrag=()=>{
    document.removeEventListener('mousemove',onDragMove);
    document.removeEventListener('touchmove',onDragMove);
    document.removeEventListener('mouseup',onDragEnd);
    document.removeEventListener('touchend',onDragEnd);
  };

  // Resize
  function onResizeStart(e){
    e.preventDefault(); e.stopPropagation();
    const s=_ddtPhotoState.cur; if(!s) return;
    s.resizing=true;
    const cx=e.touches?e.touches[0].clientX:e.clientX;
    const cy=e.touches?e.touches[0].clientY:e.clientY;
    s._rx0=cx; s._ry0=cy; s._rw0=s.w; s._rh0=s.h;
  }
  function onResizeMove(e){
    const s=_ddtPhotoState.cur; if(!s||!s.resizing) return;
    e.preventDefault();
    const cx=e.touches?e.touches[0].clientX:e.clientX;
    const cy=e.touches?e.touches[0].clientY:e.clientY;
    const aspect=s.img.naturalWidth/s.img.naturalHeight;
    let newW=Math.max(40, s._rw0+(cx-s._rx0));
    let newH=Math.round(newW/aspect);
    if(newH<30){newH=30; newW=Math.round(newH*aspect);}
    s.w=newW; s.h=newH;
    syncFrame();
  }
  function onResizeEnd(){ const s=_ddtPhotoState.cur; if(s) s.resizing=false; }

  rh.addEventListener('mousedown',onResizeStart);
  rh.addEventListener('touchstart',onResizeStart,{passive:false});
  document.addEventListener('mousemove',onResizeMove);
  document.addEventListener('touchmove',onResizeMove,{passive:false});
  document.addEventListener('mouseup',onResizeEnd);
  document.addEventListener('touchend',onResizeEnd);
  ps._rmResize=()=>{
    document.removeEventListener('mousemove',onResizeMove);
    document.removeEventListener('touchmove',onResizeMove);
    document.removeEventListener('mouseup',onResizeEnd);
    document.removeEventListener('touchend',onResizeEnd);
  };
}

function _ddtEndPhotoOverlay(commit){
  const ps=_ddtPhotoState.cur;
  if(ps){
    if(ps._rmDrag) ps._rmDrag();
    if(ps._rmResize) ps._rmResize();
  }
  const ov=document.getElementById('ddt-photo-ov');
  if(ov) ov.remove();
  const cv=ddtCanvas(); if(!cv) return;
  const ctx=cv.getContext('2d');
  if(commit && ps){
    if(ps.snapshot) ctx.putImageData(ps.snapshot,0,0);
    ddtPushUndo();
    const cvR=cv.getBoundingClientRect();
    const scaleX=cv.width/cvR.width, scaleY=cv.height/cvR.height;
    ctx.globalAlpha=1;
    ctx.drawImage(ps.img, ps.x*scaleX, ps.y*scaleY, ps.w*scaleX, ps.h*scaleY);
    ctx.globalAlpha=1;
  } else if(!commit && ps && ps.snapshot){
    ctx.putImageData(ps.snapshot,0,0);
  }
  delete _ddtPhotoState.cur;
}

// ── Desktop Draw: verschiebbares Text-Overlay ──
const _ddtTextState={};

function _ddtStartTextOverlay(clickX, clickY, cvRect){
  _ddtEndTextOverlay(false); // evtl. vorheriges verwerfen

  const font = document.getElementById('ddt-textfont')?.value || 'Arial';
  const size = parseInt(document.getElementById('ddt-textsize')?.value || '20');

  // Startposition: wo geklickt wurde (in CSS-Pixel relativ zum Canvas)
  const ps = _ddtTextState.cur = {
    x: Math.max(0, clickX - 4),
    y: Math.max(0, clickY - size - 4),
    dragging: false, dx: 0, dy: 0,
    cvRect
  };

  const cv = ddtCanvas();
  ps.snapshot = cv.getContext('2d').getImageData(0,0,cv.width,cv.height);

  // Overlay — kein Hintergrund, pointer-events:none; Drag läuft über box+handle
  const ov = document.createElement('div');
  ov.id = 'ddt-text-ov';
  ov.style.cssText = `position:fixed;left:${cvRect.left}px;top:${cvRect.top}px;` +
    `width:${cvRect.width}px;height:${cvRect.height}px;z-index:10050;` +
    `pointer-events:none;touch-action:none;`;

  // Textbox-Container
  const box = document.createElement('div');
  box.id = 'ddt-text-box';
  box.style.cssText = `position:absolute;left:${ps.x}px;top:${ps.y}px;` +
    `min-width:200px;min-height:${size+80}px;` +
    `border:2px dashed ${_accentRgb(0.85)};border-radius:6px;` +
    `background:rgba(255,255,255,0.97);box-sizing:border-box;` +
    `user-select:none;pointer-events:auto;` +
    `display:flex;flex-direction:column;box-shadow:0 4px 18px rgba(0,0,0,0.18);`;

  // ── Mini-Toolbar (Schrift/Größe) oben in der Box ──
  const miniBar = document.createElement('div');
  miniBar.style.cssText = `display:flex;gap:4px;align-items:center;padding:4px 6px;` +
    `background:rgba(240,242,250,0.98);border-radius:4px 4px 0 0;` +
    `border-bottom:1px solid rgba(0,0,0,0.1);flex-shrink:0;cursor:default;`;
  miniBar.addEventListener('mousedown', e => e.stopPropagation());
  miniBar.addEventListener('touchstart', e => e.stopPropagation(), {passive:true});

  // Schriftart-Select in der Box
  const fontSel = document.createElement('select');
  fontSel.style.cssText = `background:#fff;border:1px solid rgba(0,0,0,0.18);color:#1a1f3a;` +
    `border-radius:5px;font-size:11px;padding:0 4px;height:26px;cursor:pointer;flex-shrink:0;`;
  [['Arial','Arial'],["Georgia","Georgia"],["'Courier New'",'Monospace'],['Impact','Impact']].forEach(([val,lbl])=>{
    const o=document.createElement('option'); o.value=val; o.textContent=lbl;
    if(val===font) o.selected=true;
    fontSel.appendChild(o);
  });

  // Größe-Select in der Box
  const sizeSel = document.createElement('select');
  sizeSel.style.cssText = `background:#fff;border:1px solid rgba(0,0,0,0.18);color:#1a1f3a;` +
    `border-radius:5px;font-size:11px;padding:0 4px;height:26px;cursor:pointer;flex-shrink:0;`;
  [14,20,28,40,60,80].forEach(s=>{
    const o=document.createElement('option'); o.value=s; o.textContent=s+'px';
    if(s===size) o.selected=true;
    sizeSel.appendChild(o);
  });

  // Live-Update der Textarea bei Auswahl
  function applyStyle(){
    const f = fontSel.value;
    const s = parseInt(sizeSel.value);
    ta.style.fontFamily = f + ',sans-serif';
    ta.style.fontSize   = s + 'px';
    // Sync mit globalen Toolbar-Selects
    const tb_font = document.getElementById('ddt-textfont');
    const tb_size = document.getElementById('ddt-textsize');
    if(tb_font) tb_font.value = f;
    if(tb_size) tb_size.value = s;
  }
  fontSel.addEventListener('change', applyStyle);
  sizeSel.addEventListener('change', applyStyle);

  // Drag-Handle-Label im miniBar (rechts)
  const dragHint = document.createElement('span');
  dragHint.textContent = '✥';
  dragHint.style.cssText = `margin-left:auto;color:#aaa;font-size:14px;cursor:move;` +
    `padding:0 4px;user-select:none;`;
  miniBar.appendChild(fontSel);
  miniBar.appendChild(sizeSel);
  miniBar.appendChild(dragHint);
  box.appendChild(miniBar);

  // ── Drag-Handle: schmaler Streifen unter miniBar, über der Textarea ──
  const dragHandle = document.createElement('div');
  dragHandle.style.cssText = `height:14px;background:${_accentRgb(0.08)};` +
    `cursor:move;flex-shrink:0;display:flex;align-items:center;justify-content:center;`;
  dragHandle.innerHTML = '<svg width="32" height="6" viewBox="0 0 32 6"><rect y="0" width="32" height="2" rx="1" fill="#aaa"/><rect y="4" width="32" height="2" rx="1" fill="#aaa"/></svg>';
  box.appendChild(dragHandle);

  // Textarea für Eingabe
  const ta = document.createElement('textarea');
  ta.id = 'ddt-text-input';
  ta.style.cssText = `width:100%;min-height:${size+16}px;flex:1;` +
    `background:transparent;border:none;outline:none;resize:both;` +
    `font-family:${font},sans-serif;font-size:${size}px;` +
    `color:${ddtState.color};line-height:1.25;padding:4px 8px;` +
    `cursor:text;pointer-events:auto;box-sizing:border-box;user-select:text;`;
  ta.placeholder = 'Text eingeben…';
  // Text-Selektion und Eingabe erlauben — kein Drag-Start von Textarea
  ta.addEventListener('mousedown', e => e.stopPropagation());
  ta.addEventListener('touchstart', e => e.stopPropagation(), {passive:true});
  box.appendChild(ta);

  // Buttons
  const commitBtn = document.createElement('button');
  commitBtn.textContent = '✓ Einbetten';
  commitBtn.style.cssText = 'position:absolute;top:-34px;left:50%;transform:translateX(-50%);' +
    `background:${_accentHex()};color:#fff;border:none;border-radius:8px;padding:4px 14px;` +
    'font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;' +
    'box-shadow:0 2px 8px rgba(0,0,0,0.3);z-index:3;pointer-events:auto;';
  commitBtn.onmousedown = e => e.stopPropagation();
  commitBtn.onclick = e => { e.stopPropagation(); _ddtEndTextOverlay(true); };

  const cancelBtn = document.createElement('button');
  cancelBtn.textContent = '✕';
  cancelBtn.style.cssText = 'position:absolute;top:-34px;right:-4px;' +
    'background:rgba(220,50,50,0.88);color:#fff;border:none;border-radius:8px;' +
    'padding:4px 10px;font-size:12px;font-weight:800;cursor:pointer;' +
    'box-shadow:0 2px 8px rgba(0,0,0,0.25);z-index:3;pointer-events:auto;';
  cancelBtn.onmousedown = e => e.stopPropagation();
  cancelBtn.onclick = e => { e.stopPropagation(); _ddtEndTextOverlay(false); };

  box.appendChild(commitBtn);
  box.appendChild(cancelBtn);
  ov.appendChild(box);
  document.body.appendChild(ov);

  setTimeout(() => ta.focus(), 30);

  // ── Drag: über dragHandle und dragHint ──
  function startDrag(e){
    e.preventDefault(); e.stopPropagation();
    ps.dragging = true;
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    const br = box.getBoundingClientRect();
    ps.dx = cx - br.left;
    ps.dy = cy - br.top;
    document.addEventListener('mousemove',  onDragMove);
    document.addEventListener('touchmove',  onDragMove, {passive:false});
    document.addEventListener('mouseup',    onDragEnd);
    document.addEventListener('touchend',   onDragEnd);
  }
  function onDragMove(e){
    if(!ps.dragging) return;
    e.preventDefault();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    const cvR = ddtCanvas().getBoundingClientRect();
    ps.x = Math.max(0, Math.min(cvR.width  - box.offsetWidth,  cx - cvR.left - ps.dx));
    ps.y = Math.max(0, Math.min(cvR.height - box.offsetHeight, cy - cvR.top  - ps.dy));
    box.style.left = ps.x + 'px';
    box.style.top  = ps.y + 'px';
  }
  function onDragEnd(){
    ps.dragging = false;
    document.removeEventListener('mousemove',  onDragMove);
    document.removeEventListener('touchmove',  onDragMove);
    document.removeEventListener('mouseup',    onDragEnd);
    document.removeEventListener('touchend',   onDragEnd);
  }

  dragHandle.addEventListener('mousedown',  startDrag);
  dragHandle.addEventListener('touchstart', startDrag, {passive:false});
  dragHint.addEventListener('mousedown',    startDrag);
  dragHint.addEventListener('touchstart',   startDrag, {passive:false});

  ps._rmDrag = () => { onDragEnd(); };
}

function _ddtEndTextOverlay(commit){
  const ps = _ddtTextState.cur;
  if(ps && ps._rmDrag) ps._rmDrag();

  const ov  = document.getElementById('ddt-text-ov');
  const box = document.getElementById('ddt-text-box');
  const ta  = document.getElementById('ddt-text-input');
  const text = ta ? ta.value.trim() : '';

  if(ov) ov.remove();

  const cv = ddtCanvas(); if(!cv) return;
  const ctx = cv.getContext('2d');

  if(!commit || !text || !ps){
    // Abbrechen — Snapshot wiederherstellen
    if(ps && ps.snapshot) ctx.putImageData(ps.snapshot, 0, 0);
    delete _ddtTextState.cur;
    return;
  }

  // Snapshot wiederherstellen, dann Text draufzeichnen
  if(ps.snapshot) ctx.putImageData(ps.snapshot, 0, 0);
  ddtPushUndo();

  const font = document.getElementById('ddt-textfont')?.value || 'Arial';
  const size = parseInt(document.getElementById('ddt-textsize')?.value || '20');
  const cvR  = cv.getBoundingClientRect();
  const scaleX = cv.width  / cvR.width;
  const scaleY = cv.height / cvR.height;

  // Boxposition: ps.x/y sind relativ zum Overlay (= CSS-Canvas-Koordinaten)
  const boxEl = document.getElementById('ddt-text-box'); // schon entfernt → nutze ps
  const textX = (ps.x + 6) * scaleX;          // 6px padding
  const textY = (ps.y + 18 + size) * scaleY;  // 18px grip-Höhe + Baseline

  ctx.globalAlpha = 1;
  ctx.fillStyle   = ddtState.color;
  ctx.font        = `${size * scaleY}px ${font},sans-serif`;
  ctx.textBaseline = 'alphabetic';

  // Mehrzeiligen Text unterstützen
  const lines = text.split('\n');
  lines.forEach((line, i) => {
    ctx.fillText(line, textX, textY + i * size * scaleY * 1.3);
  });

  delete _ddtTextState.cur;
}

// ── Events (initialised once) ──
let _ddtEventsInit=false;
function ddtInitEvents(){
  if(_ddtEventsInit) return;
  _ddtEventsInit=true;
  const cv=ddtCanvas();
  cv.setAttribute('tabindex','0');
  cv.style.outline='none';

  cv.addEventListener('mousedown',e=>{
    if(e.target.closest('#desktop-draw-toolbar')) return;
    if(ddtState.tool==='text'){
      const r=cv.getBoundingClientRect();
      _ddtStartTextOverlay(e.clientX - r.left, e.clientY - r.top, r);
      return;
    }
    const p=ddtGetP(e);
    ddtPushUndo();
    ddtState.drawing=true; ddtState.lx=p.x; ddtState.ly=p.y;
    if(ddtState.tool==='marker') ddtMarkerStart(p.x,p.y);
  });
  cv.addEventListener('mousemove',e=>{
    if(!ddtState.drawing) return;
    const p=ddtGetP(e);
    ddtStroke(ddtState.lx,ddtState.ly,p.x,p.y);
    ddtState.lx=p.x; ddtState.ly=p.y;
  });
  cv.addEventListener('mouseup',()=>{ if(ddtState.tool==='marker') ddtMarkerEnd(); ddtState.drawing=false; });
  cv.addEventListener('mouseleave',()=>{ if(ddtState.tool==='marker') ddtMarkerEnd(); ddtState.drawing=false; });

  cv.addEventListener('touchstart',e=>{
    e.preventDefault();
    if(ddtState.tool==='text'){
      const r=cv.getBoundingClientRect();
      _ddtStartTextOverlay(e.touches[0].clientX - r.left, e.touches[0].clientY - r.top, r);
      return;
    }
    const p=ddtGetP(e);
    ddtPushUndo();
    ddtState.drawing=true; ddtState.lx=p.x; ddtState.ly=p.y;
    if(ddtState.tool==='marker') ddtMarkerStart(p.x,p.y);
  },{passive:false});
  cv.addEventListener('touchmove',e=>{
    e.preventDefault();
    if(!ddtState.drawing) return;
    const p=ddtGetP(e);
    ddtStroke(ddtState.lx,ddtState.ly,p.x,p.y);
    ddtState.lx=p.x; ddtState.ly=p.y;
  },{passive:false});
  cv.addEventListener('touchend',()=>{ if(ddtState.tool==='marker') ddtMarkerEnd(); ddtState.drawing=false; });

  cv.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&(e.key==='z'||e.key==='Z')){e.preventDefault();ddtUndo();return;}
    if(e.key==='Escape'){ closeDesktopDraw(); return; }
  });

  // Resize canvas when window resizes (preserve content)
  window.addEventListener('resize',()=>{
    const overlay=document.getElementById('desktop-draw-overlay');
    if(!overlay.classList.contains('active')) return;
    const offscreen=document.createElement('canvas');
    offscreen.width=cv.width; offscreen.height=cv.height;
    if(offscreen.width>0&&offscreen.height>0) offscreen.getContext('2d').drawImage(cv,0,0);
    cv.width=window.innerWidth; cv.height=window.innerHeight;
    const ctx=cv.getContext('2d');
    ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,cv.width,cv.height);
    if(offscreen.width>0&&offscreen.height>0) try{ ctx.drawImage(offscreen,0,0); }catch(_){}
  });
}
</script>

<script>
// Web Audio API: decode all audio once on load → instant, zero-latency playback
(function(){
  const _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const _buffers = {};
  const _resumeCtx = () => { if(_audioCtx.state === 'suspended') _audioCtx.resume(); };
  document.addEventListener('click', _resumeCtx, {once: true});
  document.addEventListener('touchstart', _resumeCtx, {once: true});

  // Decode all <audio> base64 sources into AudioBuffers
  window.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('audio[id^="snd-"]').forEach(el => {
      const id = el.id.replace('snd-', '');
      const src = el.src; // data:audio/mpeg;base64,...
      // Convert base64 to ArrayBuffer
      const b64 = src.split(',')[1];
      const bin = atob(b64);
      const buf = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
      _audioCtx.decodeAudioData(buf.buffer, decoded => {
        _buffers[id] = decoded;
      });
    });
  });

  // Override playSound to use Web Audio API when buffer is ready
  window._pzAudioCtx = _audioCtx;   // expose for Puzzle
  window._waBuffers  = _buffers;    // expose for playFadeinDouble
  window._waPlaySound = function(id, vol) {
    if(_audioCtx.state === 'suspended') _audioCtx.resume();
    const buf = _buffers[id];
    if(buf) {
      const src = _audioCtx.createBufferSource();
      const gain = _audioCtx.createGain();
      gain.gain.value = (vol !== undefined ? vol : 0.8);
      src.buffer = buf;
      src.connect(gain);
      gain.connect(_audioCtx.destination);
      src.start(0);
    } else {
      // Fallback: HTML audio element
      const el = document.getElementById('snd-'+id);
      if(el){ el.volume=(vol||0.8); el.currentTime=0; el.play(); }
    }
  };
})();
</script>
