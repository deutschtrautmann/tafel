// ════════════════════════════════════════════════
// AMPEL LIVE ANIMATION: Fenster & Sterne
// ════════════════════════════════════════════════
const _ampelAnim = {}; // auid -> { rafId, starPhases[], windowTimers[] }

function ampelAnimStart(auid){
  ampelAnimStop(auid);
  const state = { stopped: false, starPhases: [], windowTimers: [] };
  _ampelAnim[auid] = state;

  // ── Sterne: Schimmern + kurzes Aufblitzen ──
  const NUM_STARS = 55;
  // Layer 1: langsame Sinuswelle (Schimmern)
  // Layer 2: kurzes Aufblitzen (twinkle) – unabhängiger schneller Sinus mit Ruhezeit
  for(let i = 0; i < NUM_STARS; i++){
    state.starPhases.push({
      // Schimmer
      phase:    Math.random() * Math.PI * 2,
      speed:    0.3 + Math.random() * 0.7,      // rad/s – langsam
      minOp:    0.25 + Math.random() * 0.2,
      maxOp:    0.62 + Math.random() * 0.2,
      // Twinkle-Blitz
      tPhase:   Math.random() * Math.PI * 2,
      tSpeed:   4 + Math.random() * 8,           // rad/s – schnell
      tActive:  false,
      tTimer:   Math.random() * 6,               // Sekunden bis zum nächsten Blitz
      tDur:     0,
    });
  }
  let lastTs = null;
  function animStars(ts){
    if(state.stopped) return;
    const dt = lastTs ? (ts - lastTs) / 1000 : 0.016;
    lastTs = ts;
    for(let i = 0; i < NUM_STARS; i++){
      const sp = state.starPhases[i];

      // Schimmer-Basis
      sp.phase += sp.speed * dt;
      const base = (Math.sin(sp.phase) + 1) / 2;
      let op = sp.minOp + base * (sp.maxOp - sp.minOp);

      // Twinkle-Blitz
      if(sp.tActive){
        sp.tPhase += sp.tSpeed * dt;
        const flash = Math.max(0, Math.sin(sp.tPhase));       // 0..1 schnelle Halbwelle
        op = Math.min(1, op + flash * (1.0 - op) * 0.92);    // hoch auf fast 1.0
        sp.tDur -= dt;
        if(sp.tDur <= 0) sp.tActive = false;
      } else {
        sp.tTimer -= dt;
        if(sp.tTimer <= 0){
          sp.tActive = true;
          sp.tPhase  = 0;
          sp.tDur    = 0.18 + Math.random() * 0.22;           // 180–400 ms Blitz
          sp.tTimer  = 3 + Math.random() * 12;                // 3–15 s bis zum nächsten
        }
      }

      const el = document.getElementById('astar-' + auid + '-' + i);
      if(el) el.setAttribute('opacity', op.toFixed(3));
    }
    state.rafId = requestAnimationFrame(animStars);
  }
  state.rafId = requestAnimationFrame(animStars);

  // ── Fenster: zufälliges Ein-/Ausschalten ──
  // Gebäude-Präfixe und Anzahl Fenster
  const BUILDINGS = [
    { prefix: 'bml', count: 18, litColor: () => '#f5c84488', darkColor: 'rgba(10,15,50,0.6)', litStroke: () => '#c8960a44', darkStroke: '#1a2040' },
    { prefix: 'bmr', count: 21, litColor: () => '#ffd05588', darkColor: 'rgba(10,15,50,0.6)', litStroke: () => '#b88a0044', darkStroke: '#1a2040' },
    { prefix: 'bgl', count: 18, litColor: (w) => w ? '#ffe08a' : '#a8d8ff', darkColor: 'rgba(8,12,40,0.7)', litStroke: (w) => w ? '#c8960a44' : '#5599cc44', darkStroke: '#1a2040' },
    { prefix: 'bsl', count:  8, litColor: () => '#ffd04499', darkColor: 'rgba(8,12,40,0.7)',  litStroke: () => '#b88a0033', darkStroke: '#1a2040' },
    { prefix: 'bgr', count: 22, litColor: (w) => w ? '#ffe08a' : '#c8eaff', darkColor: 'rgba(8,12,40,0.7)', litStroke: (w) => w ? '#c8960a44' : '#5599cc44', darkStroke: '#1a2040' },
    { prefix: 'bsr', count: 10, litColor: (w) => w ? '#ffd04499' : '#b8deff88', darkColor: 'rgba(8,12,40,0.7)', litStroke: () => '#b88a0033', darkStroke: '#1a2040' },
  ];

  function scheduleWindowFlicker(){
    if(state.stopped) return;
    // Pick a random building, random window
    const bld = BUILDINGS[Math.floor(Math.random() * BUILDINGS.length)];
    const idx = Math.floor(Math.random() * bld.count);
    const el = document.getElementById('aw-' + bld.prefix + '-' + auid + '-' + idx);
    if(el){
      const currently = el.getAttribute('data-lit') === '1';
      const warm = el.getAttribute('data-warm') === '1';
      // Toggle
      const nowLit = !currently;
      el.setAttribute('data-lit', nowLit ? '1' : '0');
      // Smooth transition via style
      el.style.transition = 'fill 0.6s ease, opacity 0.6s ease';
      if(nowLit){
        el.setAttribute('fill', typeof bld.litColor === 'function' ? bld.litColor(warm) : bld.litColor);
        el.setAttribute('stroke', typeof bld.litStroke === 'function' ? bld.litStroke(warm) : bld.litStroke);
      } else {
        el.setAttribute('fill', bld.darkColor);
        el.setAttribute('stroke', bld.darkStroke);
      }
    }
    // Next flicker: 1.5–8s (feels organic, not frantic)
    const delay = 1500 + Math.random() * 6500;
    const tid = setTimeout(scheduleWindowFlicker, delay);
    state.windowTimers.push(tid);
  }
  // Stagger a few independent flicker streams so multiple windows can change at once
  for(let s = 0; s < 4; s++){
    const tid = setTimeout(scheduleWindowFlicker, Math.random() * 3000);
    state.windowTimers.push(tid);
  }
}

function ampelAnimStop(auid){
  const st = _ampelAnim[auid];
  if(!st) return;
  st.stopped = true;
  if(st.rafId) cancelAnimationFrame(st.rafId);
  st.windowTimers.forEach(t => clearTimeout(t));
  delete _ampelAnim[auid];
}

// Global state for Ampel Panel
const _apTimers   = {};
const _apState    = {};
const _apPaused   = {}; // auid -> true if paused
const _apFinished = {}; // auid -> true after cycle completed naturally

// ── Ampel: Stadtgeräusche (Web Audio, synthetisch) ──
const _cityAudio = {}; // auid -> { ctx, nodes[], stopped }

function cityStop(auid){
  const ca = _cityAudio[auid];
  if(!ca) return;
  ca.stopped = true;
  // Fade out master gain over 0.8s then disconnect all
  try{
    ca.master.gain.setValueAtTime(ca.master.gain.value, ca.ctx.currentTime);
    ca.master.gain.linearRampToValueAtTime(0, ca.ctx.currentTime + 0.8);
    setTimeout(()=>{
      ca.nodes.forEach(n=>{ try{n.stop();}catch(e){} try{n.disconnect();}catch(e){} });
      try{ca.master.disconnect();}catch(e){}
    }, 900);
  }catch(e){}
  delete _cityAudio[auid];
}

function cityStart(auid){
  cityStop(auid); // stop any previous
  if(!soundEnabled) return; // don't start city sounds if muted
  let ctx;
  try{ ctx = window._pzAudioCtx || new (window.AudioContext||window.webkitAudioContext)(); }
  catch(e){ return; }
  if(ctx.state==='suspended') ctx.resume();

  const ca = { ctx, nodes:[], master:ctx.createGain(), stopped:false };
  ca.master.gain.setValueAtTime(0, ctx.currentTime);
  ca.master.gain.linearRampToValueAtTime(0.18, ctx.currentTime + 1.5); // fade in
  ca.master.connect(ctx.destination);
  _cityAudio[auid] = ca;

  // ── 1. Verkehrsrauschen: gefiltertes Rosa-Rauschen ──
  const bufLen = ctx.sampleRate * 3;
  const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
  const data = buf.getChannelData(0);
  let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0;
  for(let i=0;i<bufLen;i++){
    const w = Math.random()*2-1;
    b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759;
    b2=0.96900*b2+w*0.1538520; b3=0.86650*b3+w*0.3104856;
    b4=0.55000*b4+w*0.5329522; b5=-0.7616*b5-w*0.0168980;
    data[i]=(b0+b1+b2+b3+b4+b5+w*0.5362)*0.11;
  }
  const noise = ctx.createBufferSource();
  noise.buffer = buf; noise.loop = true;
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'lowpass'; noiseFilter.frequency.value = 800;
  const noiseGain = ctx.createGain(); noiseGain.gain.value = 0.7;
  noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(ca.master);
  noise.start(); ca.nodes.push(noise);

  // ── 2. Gelegentliche vorbeifahrende Autos (Doppler-ähnlich) ──
  function scheduleCarPass(){
    if(ca.stopped) return;
    const delay = 3000 + Math.random()*7000;
    setTimeout(()=>{
      if(ca.stopped) return;
      const carBuf = ctx.createBuffer(1, ctx.sampleRate*2, ctx.sampleRate);
      const cd = carBuf.getChannelData(0);
      for(let i=0;i<cd.length;i++) cd[i]=(Math.random()*2-1)*0.4;
      const car = ctx.createBufferSource();
      car.buffer = carBuf;
      const carFilter = ctx.createBiquadFilter();
      carFilter.type = 'bandpass'; carFilter.frequency.value = 400; carFilter.Q.value = 0.8;
      const carGain = ctx.createGain();
      const t = ctx.currentTime;
      carGain.gain.setValueAtTime(0, t);
      carGain.gain.linearRampToValueAtTime(0.5, t+0.4);
      carGain.gain.linearRampToValueAtTime(0.2, t+1.0);
      carGain.gain.linearRampToValueAtTime(0, t+1.8);
      // Doppler: pitch goes down as car passes
      carFilter.frequency.setValueAtTime(900, t);
      carFilter.frequency.linearRampToValueAtTime(180, t+1.8);
      car.connect(carFilter); carFilter.connect(carGain); carGain.connect(ca.master);
      car.start(t); car.stop(t+2);
      ca.nodes.push(car);
      scheduleCarPass();
    }, delay);
  }
  scheduleCarPass();

  // ── 3. Ferne Stimmen/Schritte: kurze Band-Noise-Bursts ──
  function scheduleMurmur(){
    if(ca.stopped) return;
    const delay = 4000 + Math.random()*8000;
    setTimeout(()=>{
      if(ca.stopped) return;
      const dur = 0.3 + Math.random()*0.5;
      const osc = ctx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.value = 180 + Math.random()*120;
      const murFilter = ctx.createBiquadFilter();
      murFilter.type = 'bandpass'; murFilter.frequency.value = 300; murFilter.Q.value = 3;
      const murGain = ctx.createGain();
      const t = ctx.currentTime;
      murGain.gain.setValueAtTime(0, t);
      murGain.gain.linearRampToValueAtTime(0.04, t+0.05);
      murGain.gain.linearRampToValueAtTime(0, t+dur);
      osc.connect(murFilter); murFilter.connect(murGain); murGain.connect(ca.master);
      osc.start(t); osc.stop(t+dur+0.1);
      ca.nodes.push(osc);
      scheduleMurmur();
    }, delay);
  }
  scheduleMurmur();

  // ── 4. Vogelzwitschern: kurze FM-Chirps ──
  function scheduleBird(){
    if(ca.stopped) return;
    const delay = 5000 + Math.random()*12000;
    setTimeout(()=>{
      if(ca.stopped) return;
      const chirps = 2 + Math.floor(Math.random()*4);
      for(let c=0;c<chirps;c++){
        const t = ctx.currentTime + c*0.12;
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        const baseF = 2400 + Math.random()*1200;
        osc.frequency.setValueAtTime(baseF, t);
        osc.frequency.linearRampToValueAtTime(baseF*1.3, t+0.06);
        osc.frequency.linearRampToValueAtTime(baseF, t+0.10);
        const bGain = ctx.createGain();
        bGain.gain.setValueAtTime(0, t);
        bGain.gain.linearRampToValueAtTime(0.07, t+0.02);
        bGain.gain.linearRampToValueAtTime(0, t+0.10);
        osc.connect(bGain); bGain.connect(ca.master);
        osc.start(t); osc.stop(t+0.12);
        ca.nodes.push(osc);
      }
      scheduleBird();
    }, delay);
  }
  scheduleBird();
}

function ampelPanelSetLight(auid, state){
  const rot  = document.getElementById('ampel-rot-'+auid);
  const gelb = document.getElementById('ampel-gelb-'+auid);
  const gruen= document.getElementById('ampel-gruen-'+auid);
  if(!rot) return;
  const isLM = document.body.classList.contains('light-mode');
  rot.setAttribute('fill',  state==='rot'  ? `url(#rg-r-${auid})` : (isLM?'rgba(180,0,0,0.12)':'rgba(80,0,0,0.35)'));
  gelb.setAttribute('fill', state==='gelb' ? `url(#rg-y-${auid})` : (isLM?'rgba(160,120,0,0.12)':'rgba(80,70,0,0.35)'));
  gruen.setAttribute('fill',state==='gruen'? `url(#rg-g-${auid})` : (isLM?'rgba(0,150,0,0.12)':'rgba(0,80,0,0.35)'));
  // Hintergrund-Schimmer der aktiven Lampe
  const scene = document.getElementById('ampel-scene-'+auid);
  if(scene){
    const glows={rot:'rgba(180,0,0,0.18)',gelb:'rgba(160,120,0,0.18)',gruen:'rgba(0,130,0,0.18)'};
    scene.style.boxShadow = `inset 0 0 80px 20px ${glows[state]||'transparent'}`;
  }
  // Ton bei jedem Zustandswechsel: Hupe bei Rot, Pop bei Gelb/Grün
  if(soundEnabled) try{
    if(state==='rot'){
      playSound('Hupe', 0.9);
    } else {
      const ac = window._pzAudioCtx || new (window.AudioContext||window.webkitAudioContext)();
      if(ac.state==='suspended') ac.resume();
      playPop(ac, 0.8);
    }
  }catch(e){}
  _apState[auid] = state;
}

function _ampelBtnSetRunning(auid, running){
  const icon  = document.getElementById('ampel-playbtn-icon-'+auid);
  const label = document.getElementById('ampel-playbtn-label-'+auid);
  const btn   = document.getElementById('ampel-playbtn-'+auid);
  if(!btn) return;
  if(running){
    if(icon)  icon.innerHTML  = '&#9646;&#9646;';
    if(label) label.textContent = T('ampelStop');
    btn.style.background = 'linear-gradient(135deg,#ef4444 0%,#dc2626 100%)';
  } else {
    if(icon)  icon.innerHTML  = '&#9654;';
    if(label) label.textContent = T('ampelStart');
    btn.style.background = 'linear-gradient(135deg,#22c55e 0%,#16a34a 100%)';
  }
}

function ampelPanelStart(auid){
  if(_apTimers[auid]){clearTimeout(_apTimers[auid]);delete _apTimers[auid];}
  _apPaused[auid]   = false;
  _apFinished[auid] = false;
  _ampelBtnSetRunning(auid, true);
  ampelAnimStart(auid); // Sterne + Fenster-Animation starten
  const minEl = document.getElementById('sa-min-'+auid);
  const maxEl = document.getElementById('sa-max-'+auid);
  const minS  = Math.max(1, parseInt(minEl?.value||10));
  const maxS  = Math.max(minS, parseInt(maxEl?.value||30));
  const gruenMs = (minS + Math.random()*(maxS-minS)) * 1000;
  ampelPanelSetLight(auid, 'gruen');
  _apTimers[auid] = setTimeout(()=>{
    if(!document.getElementById('ampel-rot-'+auid)) return;
    ampelPanelSetLight(auid, 'gelb');
    _apTimers[auid] = setTimeout(()=>{
      if(!document.getElementById('ampel-rot-'+auid)) return;
      ampelPanelSetLight(auid, 'rot');
      cityStop(auid); // Stadtgeräusche stoppen bei Rot
      _apPaused[auid]   = false;
      _apFinished[auid] = true;   // Zyklus beendet → nächster Klick = sofort Neustart
      delete _apTimers[auid];
      _ampelBtnSetRunning(auid, false); // back to Start after cycle ends
    }, 3000);
  }, gruenMs);
}

function ampelPanelPause(auid){
  if(_apTimers[auid]){clearTimeout(_apTimers[auid]);delete _apTimers[auid];}
  cityStop(auid);
  ampelAnimStop(auid); // Fenster-Animation einfrieren
  _apPaused[auid]   = true;
  _apFinished[auid] = false;
  _ampelBtnSetRunning(auid, false);
  // freeze current light (no state change)
}

function ampelPanelToggle(auid){
  try{const ac=window._pzAudioCtx||new (window.AudioContext||window.webkitAudioContext)();playPop(ac,0.8);}catch(e){}
  if(_apTimers[auid]){
    // Läuft → Abbrechen (Stop)
    clearTimeout(_apTimers[auid]); delete _apTimers[auid];
    cityStop(auid);
    ampelAnimStop(auid);
    ampelPanelSetLight(auid, 'rot');
    _apPaused[auid]   = false;
    _apFinished[auid] = false;
    _ampelBtnSetRunning(auid, false);
  } else {
    // Gestoppt/fertig → Neustart (Start)
    cityStart(auid);
    ampelPanelStart(auid);
  }
}

function ampelPanelClick(auid){
  // Click on scene = Neustart (restart cycle + city sounds)
  try{const ac=window._pzAudioCtx||new (window.AudioContext||window.webkitAudioContext)();playPop(ac,0.8);}catch(e){}
  cityStart(auid);
  ampelPanelStart(auid);
}

let _spielOverlayState = null; // { tab, uid, panel, placeholder }

function openSpielOverlay(tab, uid){
  const overlay  = document.getElementById('spiel-overlay');
  const content  = document.getElementById('spiel-overlay-content');
  const titleEl  = document.getElementById('spiel-overlay-title');
  const panel    = document.getElementById(`spiele-panel-${tab}-${uid}`);
  if(!overlay || !panel) return;

  // Wenn schon geöffnet für genau diesen Tab/uid – nichts tun
  if(_spielOverlayState && _spielOverlayState.tab===tab && _spielOverlayState.uid===uid) return;

  // Vorherigen Zustand zurückbauen (anderer Tab/uid)
  if(_spielOverlayState) _restoreSpielPanel();

  // Platzhalter im Widget einsetzen, damit Layout stabil bleibt
  const placeholder = document.createElement('div');
  placeholder.id = `spiel-ph-${tab}-${uid}`;
  panel.parentNode.insertBefore(placeholder, panel);

  // Panel ins Overlay verschieben
  panel.style.display = 'flex';
  panel.style.flex    = '1';
  panel.style.minHeight = '0';
  content.appendChild(panel);

  // Titel
  const labels = { puzzle:'🧩 Puzzle', zuordnen:'🔗 Zuordnen' };
  titleEl.textContent = labels[tab] || tab;

  // Topbar verstecken wie beim Zeichnen
  const topbar    = document.getElementById('topbar');
  const clockWrap = document.getElementById('clock-wrap');
  if(topbar)    topbar.style.display    = 'none';
  if(clockWrap) clockWrap.style.display = 'none';

  overlay.classList.add('active');

  _spielOverlayState = { tab, uid, panel, placeholder };

  // Neu skalieren nach Anzeige
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      const widgetEl = document.getElementById(`spiele-panel-rad-${uid}`)?.closest('.widget');
      if(widgetEl) updateWidgetScale(widgetEl);
      if(tab==='puzzle'){
        const game = document.getElementById(`pz-game-${uid}`);
        _pzAttachResizeObserver(uid, game);
      }
      if(tab==='zuordnen'){
        const gameWrap = document.getElementById(`zu-game-${uid}`);
        if(gameWrap){
          const tf = gameWrap.querySelector('.zu-textfield');
          if(tf){ tf.style.height=''; tf.style.maxHeight=''; tf.style.flex='1 1 0'; tf.style.minHeight='0'; }
        }
      }
    });
  });
}

function _restoreSpielPanel(){
  if(!_spielOverlayState) return;
  const { tab, uid, panel, placeholder } = _spielOverlayState;
  if(placeholder && placeholder.parentNode){
    placeholder.parentNode.insertBefore(panel, placeholder);
    placeholder.remove();
  }
  panel.style.display = 'none';
  _spielOverlayState = null;
}

function closeSpielOverlay(){
  if(!_spielOverlayState) return;
  const { uid } = _spielOverlayState;
  const overlay = document.getElementById('spiel-overlay');
  overlay.classList.remove('active');
  _restoreSpielPanel();
  // Topbar wiederherstellen
  const topbar    = document.getElementById('topbar');
  const clockWrap = document.getElementById('clock-wrap');
  if(topbar)    topbar.style.display    = '';
  if(clockWrap) clockWrap.style.display = '';
  // Tab-Buttons im Widget: keiner aktiv markiert für Puzzle/Zuordnen
  // (zeigt nur noch Rad/Slot/Ampel aktiv – wir wechseln zurück zu Rad)
  ['rad','slot','puzzle','zuordnen','ampel'].forEach(t=>{
    const btn = document.getElementById(`spiele-tab-${t}-${uid}`);
    if(btn) btn.classList.toggle('active-tmode', t==='rad');
    const panel = document.getElementById(`spiele-panel-${t}-${uid}`);
    if(panel) panel.style.display = t==='rad' ? 'flex' : 'none';
  });
  // Widget neu einpassen nachdem Topbar wieder sichtbar ist
  requestAnimationFrame(()=>{
    setDesktopTop();
    const widgetEl = document.getElementById(`spiele-panel-rad-${uid}`)?.closest('.widget');
    if(widgetEl) clampWidget(widgetEl);
  });
}

function spieleShowTab(tab, uid){
  // City sounds: stop when leaving ampel tab
  const auid = uid * 1000 + 5;
  if(tab === 'ampel'){
    // Don't auto-start cycle: user clicks the Start button
    // Always start the visual live animation (stars + windows) when entering the tab
    ampelAnimStart(auid);
    // Reset button to "Start" state when entering the tab fresh (if not currently running)
    if(!_apTimers[auid]){
      _apPaused[auid] = false;
      _ampelBtnSetRunning(auid, false);
    }
  } else {
    cityStop(auid);
    if(_apTimers[auid]){clearTimeout(_apTimers[auid]);delete _apTimers[auid];}
    _apPaused[auid] = false;
    ampelAnimStop(auid); // Animation stoppen beim Tab-Wechsel
  }

  // ── Vollbild-Overlay für Puzzle & Zuordnen ──
  const fullscreenTabs = ['puzzle','zuordnen'];
  if(fullscreenTabs.includes(tab)){
    openSpielOverlay(tab, uid);
  } else {
    closeSpielOverlay();
  }

  // Nur Widget-Panels für Nicht-Overlay-Tabs umschalten
  // (Puzzle/Zuordnen-Panels wurden ggf. ins Overlay verschoben – nicht anfassen)
  const widgetEl = document.getElementById(`spiele-panel-rad-${uid}`)?.closest('.widget');
  ['rad','slot','puzzle','zuordnen','ampel'].forEach(t=>{
    const panel=document.getElementById(`spiele-panel-${t}-${uid}`);
    const btn  =document.getElementById(`spiele-tab-${t}-${uid}`);
    // Panel überspringen, wenn es sich bereits im Overlay befindet
    if(panel && document.getElementById('spiel-overlay-content')?.contains(panel)) {
      if(btn) btn.classList.toggle('active-tmode', t===tab);
      return;
    }
    if(panel) panel.style.display = (t===tab && !['puzzle','zuordnen'].includes(t)) ? 'flex' : 'none';
    if(btn)   btn.classList.toggle('active-tmode', t===tab);
  });
  if(tab==='slot'){
    requestAnimationFrame(()=>slotSizeReels(uid*1000+2));
    setTimeout(()=>slotSizeReels(uid*1000+2), 120);
  }
  if(tab==='rad'){
    // Trigger wheel canvas resize after display:flex is applied
    requestAnimationFrame(()=>{
      const wuid = uid*1000+1;
      const cv = document.getElementById('wheel-canvas-'+wuid);
      if(cv){
        const stage = cv.closest('.wheel-stage');
        if(stage && stage.clientWidth > 0){
          const size = Math.max(120, Math.min(stage.clientWidth, stage.clientHeight, 680));
          const dpr = Math.max(1, Math.min(2, window.devicePixelRatio||1));
          cv.width = Math.round(size*dpr); cv.height = Math.round(size*dpr);
          cv.style.width = size+'px'; cv.style.height = size+'px';
          try{ drawQuestionWheel(wuid); }catch(_){}
        }
      }
    });
    setTimeout(()=>{
      const wuid = uid*1000+1;
      const cv = document.getElementById('wheel-canvas-'+wuid);
      if(cv){ const stage=cv.closest('.wheel-stage'); if(stage){ const size=Math.max(120,Math.min(stage.clientWidth,stage.clientHeight,680)); const dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1)); cv.width=Math.round(size*dpr); cv.height=Math.round(size*dpr); cv.style.width=size+'px'; cv.style.height=size+'px'; try{drawQuestionWheel(wuid);}catch(_){} }}
    }, 150);
  }
  // Refresh scale for any tab switch so --uiscale is propagated
  if(widgetEl) updateWidgetScale(widgetEl);

  // ── Puzzle & Zuordnen: Inhalte nach Overlay-Öffnung neu skalieren ──
  if((tab==='puzzle'||tab==='zuordnen') && widgetEl){
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        updateWidgetScale(widgetEl);
        // Puzzle: pz-container Höhe optimal ausfüllen
        if(tab==='puzzle'){
          const game = document.getElementById(`pz-game-${uid}`);
          _pzAttachResizeObserver(uid, game);
        }
        if(tab==='zuordnen'){
          const gameWrap = document.getElementById(`zu-game-${uid}`);
          if(gameWrap){
            const tf = gameWrap.querySelector('.zu-textfield');
            if(tf){ tf.style.height=''; tf.style.maxHeight=''; tf.style.flex='1 1 0'; tf.style.minHeight='0'; }
          }
        }
      });
    });
  }
}

const pzState = {};

function pzBeep(freq, type, dur, vol, delayMs){
  if(!soundEnabled) return;
  setTimeout(() => {
    const c = window._pzAudioCtx;
    if(!c) return;
    if(c.state === 'suspended') c.resume();
    const osc = c.createOscillator(), g = c.createGain(), t = c.currentTime;
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    osc.frequency.exponentialRampToValueAtTime(freq * 0.25, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(g); g.connect(c.destination);
    osc.start(t); osc.stop(t + dur);
  }, delayMs || 0);
}

  const box = document.createElement('div');
  box.style.cssText = 'background:var(--card);border-radius:16px;padding:20px 22px 18px;box-shadow:0 12px 48px rgba(0,0,0,0.55);min-width:320px;max-width:520px;width:90vw;display:flex;flex-direction:column;gap:12px;';

  titleEl.style.cssText = 'font-weight:700;font-size:1.05em;color:var(--text);';
  titleEl.textContent = T('spieleEintraege');
  const closeBtn = document.createElement('button');
  closeBtn.className = 'wh-btn';
  closeBtn.style.cssText = 'font-size:1.15em;padding:2px 8px;border-radius:7px;cursor:pointer;background:none;border:none;color:var(--text2);';
  closeBtn.textContent = '✕';

  hdr.appendChild(titleEl); hdr.appendChild(closeBtn);
  box.appendChild(hdr);

  const hintEl = document.createElement('div');
  hintEl.style.cssText = 'font-size:.82em;color:var(--text2);line-height:1.5;';
  if(hintIsHtml) hintEl.innerHTML = hintContent.replace(/\n/g,'<br>'); else hintEl.textContent = hintContent;
  box.appendChild(hintEl);

  const ta = document.createElement('textarea');
  ta.className = 'slot-edit-textarea';
  ta.spellcheck = false;
  ta.style.cssText += ';min-height:150px;';
  ta.value = initialText;
  box.appendChild(ta);

  const btnRow = document.createElement('div');
  btnRow.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;align-items:center;';

  const applyBtn = document.createElement('button');
  applyBtn.className = 'wbtn primary';
  applyBtn.style.cssText = 'font-size:.92em;padding:.45em 1.2em;';

  fileSpan.style.cssText = 'font-size:.88em;padding:.42em .9em;white-space:nowrap;cursor:pointer;';

  fileInputM.type = 'file'; fileInputM.accept = '.txt,text/plain';
  fileInputM.style.display = 'none';

    const file = fileInputM.files?.[0]; if(!file) return;
    const apply = text => { ta.value = (text||'').replace(/\r\n/g,'\n'); fileInputM.value=''; };
    const r1 = new FileReader();
    r1.onload = e => {
      const t = e.target.result||'';
      if(t.includes('\uFFFD')){ const r2=new FileReader(); r2.onload=e2=>apply(e2.target.result||''); r2.readAsText(file,'windows-1252'); }

function pzShowEintraegeModal(uid){
  const st = pzState[uid];
  const initialText = (st && st.sentences && st.sentences.length) ? st.sentences.join('\n') : (st && st.lastData ? st.lastData : '');
  _buildEintraegeModal('pz-eintraege-modal-'+uid, T('pzHint'), false, initialText, (text, overlay) => {
    st.lastData = text;
    pzProcessData(uid, text);
    overlay.remove();
  });
}

function pzProcessData(uid, data){
  const st = pzState[uid];
  st.sentences = data.split(/\r?\n/).map(t=>t.trim()).filter(t=>t.length>0);
  st.current = 0;
  pzShowSentence(uid);
}

function pzShuffle(arr){ return arr.sort(()=>Math.random()-0.5); }

function pzShowSentence(uid){
  const st = pzState[uid];
  const game = document.getElementById(`pz-game-${uid}`);
  if(!game) return;
  game.innerHTML = '';

  if(st.current >= st.sentences.length){
    const done = document.createElement('div');
    done.style.cssText = 'font-weight:700;color:var(--green);padding:8px 0;';
    done.textContent = T('pzPerfekt');
    game.appendChild(done);
    const btn = document.createElement('button');
    btn.className = 'pz-btn'; btn.style.background = 'var(--accent2)';
    btn.textContent = T('pzNochmal');
    btn.onclick = () => { st.current = 0; pzProcessData(uid, st.lastData); };
    game.appendChild(btn);
    return;
  }

  const correct = st.sentences[st.current];
  const words   = pzShuffle(correct.split(/\s+/));

  const prog = document.createElement('div');
  prog.className = 'pz-progress';
  prog.textContent = `${T('pzSatz')} ${st.current+1} ${T('pzVon')} ${st.sentences.length}`;
  game.appendChild(prog);

  const lbl = document.createElement('span');
  lbl.className = 'pz-label';
  lbl.textContent = T('pzInstruktion');
  game.appendChild(lbl);

  const pool = pzCreateZone(uid);
  pool.dataset.correct = correct;
  pool.style.flex = '1 1 0';
  pool.style.minHeight = '0';
  pool.style.overflow = 'auto';
  pool.style.alignContent = 'flex-start';
  words.forEach(w => pool.appendChild(pzCreateWord(w, uid)));
  game.appendChild(pool);

  // ── Prüfen button directly below the word box ──
  const checkBtn = document.createElement('button');
  checkBtn.className = 'pz-btn';
  checkBtn.id = `pz-check-${uid}`;
  checkBtn.textContent = T('pzPruefen');
  checkBtn.onclick = () => pzCheck(uid);
  game.appendChild(checkBtn);

  // ResizeObserver: container immer optimal ausfüllen
  _pzAttachResizeObserver(uid, game);
}

const _pzResizeObservers = {};
function _pzAttachResizeObserver(uid, game){
  if(!game) return;
  // Fit container immediately, then watch for resizes
  function fit(){
    const container = game.querySelector('.pz-container');
    if(!container) return;
    container.style.height = '';
    container.style.maxHeight = '';
    container.style.flex = '1 1 0';
    container.style.minHeight = '0';
    container.style.overflow = 'auto';
  }
  fit();
  if(!window.ResizeObserver) return;
  if(_pzResizeObservers[uid]) _pzResizeObservers[uid].disconnect();
  const ro = new ResizeObserver(fit);
  ro.observe(game);
  _pzResizeObservers[uid] = ro;
}

function pzCreateWord(text, uid){
  const el = document.createElement('div');
  el.className = 'pz-word';
  el.textContent = text;
  pzAddDragEvents(el, uid);
  return el;
}

function pzCreateZone(uid){
  const zone = document.createElement('div');
  zone.className = 'pz-container';
  zone.addEventListener('dragover', e=>{
    e.preventDefault(); zone.classList.add('drag-over');
    if(!pzMouseSource) return;
    pzFlipInsert(zone, pzGetMovable(pzMouseSource), pzGetAfterElement(zone, e.clientX, e.clientY));
  });
  zone.addEventListener('dragleave', ()=>zone.classList.remove('drag-over'));
  zone.addEventListener('drop', e=>{ e.preventDefault(); zone.classList.remove('drag-over'); pzMouseSource=null; });
  return zone;
}

function pzAddDragEvents(el, uid){
  el.draggable = true;
  el.addEventListener('dragstart', ()=>{
    pzMouseSource = el;
    setTimeout(()=>pzGetMovable(el).classList.add('pz-dragging'), 0);
  });
  el.addEventListener('dragend', ()=>{
    if(pzMouseSource) pzGetMovable(pzMouseSource).classList.remove('pz-dragging');
    pzMouseSource = null;
    try{const _ac=new(window.AudioContext||window.webkitAudioContext)();playPop(_ac,0.55);}catch(_e){}
  });
  pzAddTouchDrag(el);
}

function pzAddTouchDrag(el){
  let ghost=null, src=null, ox=0, oy=0;
  el.addEventListener('touchstart', e=>{
    src = el;
    const mov = pzGetMovable(el), t = e.touches[0], r = mov.getBoundingClientRect();
    ox = t.clientX - r.left; oy = t.clientY - r.top;
    ghost = mov.cloneNode(true);
    ghost.className = 'pz-ghost';
    ghost.style.width = r.width+'px';
    ghost.style.left  = (t.clientX-ox)+'px';
    ghost.style.top   = (t.clientY-oy)+'px';
    document.body.appendChild(ghost);
    mov.classList.add('pz-dragging');
  },{passive:true});
  el.addEventListener('touchmove', e=>{
    if(!src||!ghost) return;
    e.preventDefault();
    const t = e.touches[0];
    ghost.style.left=(t.clientX-ox)+'px'; ghost.style.top=(t.clientY-oy)+'px';
    ghost.style.visibility='hidden';
    const target = document.elementFromPoint(t.clientX, t.clientY);
    ghost.style.visibility='visible';
    const zone = target && target.closest('.pz-container');
    if(!zone) return;
    document.querySelectorAll('.pz-container').forEach(z=>z.classList.remove('drag-over'));
    zone.classList.add('drag-over');
    pzFlipInsert(zone, pzGetMovable(src), pzGetAfterElement(zone, t.clientX, t.clientY));
  },{passive:false});
  const end = ()=>{
    if(ghost){ghost.remove();ghost=null;}
    if(src){pzGetMovable(src).classList.remove('pz-dragging');src=null;}
    document.querySelectorAll('.pz-container').forEach(z=>z.classList.remove('drag-over'));
    try{const _ac=new(window.AudioContext||window.webkitAudioContext)();playPop(_ac,0.55);}catch(_e){}
  };
  el.addEventListener('touchend', end); el.addEventListener('touchcancel', end);
}

function pzGetMovable(el){
  const p = el.parentElement;
  return (p && p.classList.contains('pz-group')) ? p : el;
}

function pzFlipInsert(container, toMove, after){
  const children = [...container.querySelectorAll('.pz-word:not(.pz-group .pz-word), .pz-group')].filter(el=>el!==toMove);
  const first = new Map();
  children.forEach(el=>{ const r=el.getBoundingClientRect(); first.set(el,{x:r.left,y:r.top}); });
  if(after==null) container.appendChild(toMove); else container.insertBefore(toMove, after);
  children.forEach(el=>{
    const f=first.get(el); if(!f) return;
    const l=el.getBoundingClientRect();
    const dx=f.x-l.left, dy=f.y-l.top;
    if(Math.abs(dx)<1&&Math.abs(dy)<1) return;
    el.style.transition='none'; el.style.transform=`translate(${dx}px,${dy}px)`;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ el.style.transition=''; el.style.transform=''; }));
  });
}

function pzGetAfterElement(container, x, y){
  const items=[...container.querySelectorAll('.pz-word:not(.pz-group .pz-word), .pz-group:not(.pz-dragging)')];
  if(!items.length) return null;
  const rows=[];
  items.forEach(el=>{
    const box=el.getBoundingClientRect(), mid=box.top+box.height/2;
    let row=rows.find(r=>Math.abs(r.mid-mid)<box.height*0.6);
    if(!row){row={mid,els:[]};rows.push(row);}
    row.els.push(el);
  });
  rows.sort((a,b)=>a.mid-b.mid);
  let best=rows[0], bestD=Infinity;
  rows.forEach(r=>{ const d=Math.abs(r.mid-y); if(d<bestD){bestD=d;best=r;} });
  const sorted=best.els.slice().sort((a,b)=>a.getBoundingClientRect().left-b.getBoundingClientRect().left);
  for(const el of sorted){ const box=el.getBoundingClientRect(); if(x<box.left+box.width/2) return el; }
  const idx=rows.indexOf(best);
  if(idx<rows.length-1){
    return rows[idx+1].els.slice().sort((a,b)=>a.getBoundingClientRect().left-b.getBoundingClientRect().left)[0];
  }
  return null;
}

function pzNorm(text){ return text.replace(/[.,!?;:]/g,'').replace(/\s+/g,' ').trim(); }

function pzCheck(uid){
  pzBeep(660, 'sine', 0.35, 0.18, 0);
  const pool = document.querySelector(`#pz-game-${uid} .pz-container`);
  if(!pool) return;
  const wordsInOrder = [...pool.querySelectorAll('.pz-word')].map(w=>w.textContent);
  const correctStr   = pool.dataset.correct;
  if(pzNorm(wordsInOrder.join(' ')) === pzNorm(correctStr)){
    pzPlayWin();
    // Merge all words into one final group and flash it
    pzMergeAll(pool, correctStr);
    // Show "Nochmal spielen" button below the pool after a short delay
    setTimeout(()=>{
      const game = document.getElementById(`pz-game-${uid}`);
      if(!game) return;
      // Remove old check button
      const oldBtn = document.getElementById(`pz-check-${uid}`);
      if(oldBtn) oldBtn.remove();
      // Add next/restart button below pool
      const nextBtn = document.createElement('button');
      nextBtn.className = 'pz-btn';
      nextBtn.style.background = 'var(--accent2)';
      const st = pzState[uid];
      const isLast = st.current + 1 >= st.sentences.length;
      if(isLast){
        nextBtn.textContent = T('pzNochmal');
        nextBtn.onclick = ()=>{ st.current=0; pzProcessData(uid, st.lastData); };
      } else {
        nextBtn.textContent = `▶ ${T('pzSatz')} ${st.current+2}`;
        nextBtn.onclick = ()=>{ st.current++; pzShowSentence(uid); };
      }
      game.appendChild(nextBtn);
    }, 600);
  } else {
    let anyMatch=false;
    while(pzUpdateGroups(pool, correctStr)){ anyMatch=true; }
    if(anyMatch) pzPlayPartial(); else pzPlayWrong();
  }
}

function _pzSetupGroup(grp){
  grp.draggable = true;
  pzAddTouchDrag(grp);
  grp.addEventListener('dragstart',()=>{ pzMouseSource=grp.querySelector('.pz-word'); setTimeout(()=>grp.classList.add('pz-dragging'),0); });
  grp.addEventListener('dragend',()=>{ grp.classList.remove('pz-dragging'); pzMouseSource=null; });
}

function pzMergeAll(pool, correctStr){
  // Arrange all words in correct order, then wrap in one group with flash
  const cw = correctStr.split(/\s+/);
  // Collect all word elements mapped by text
  const allWords = [...pool.querySelectorAll('.pz-word')];
  const used = new Array(allWords.length).fill(false);
  const ordered = [];
  for(const w of cw){
    const idx = allWords.findIndex((el,i)=>!used[i] && pzNorm(el.textContent)===pzNorm(w));
    if(idx !== -1){ ordered.push(allWords[idx]); used[idx]=true; }
  }
  // Remove all existing groups and loose words from pool
  [...pool.children].forEach(c=>c.remove());
  // Build one big group
  const grp = document.createElement('div');
  grp.className = 'pz-group';
  grp.dataset.start = 0;
  grp.dataset.end = cw.length - 1;
  _pzSetupGroup(grp);
  ordered.forEach(w=>grp.appendChild(w));
  pool.appendChild(grp);
  // Flash
  requestAnimationFrame(()=>{
    grp.classList.remove('pz-flash');
    void grp.offsetWidth;
    grp.classList.add('pz-flash');
    grp.addEventListener('animationend',()=>grp.classList.remove('pz-flash'),{once:true});
  });
}

function pzUpdateGroups(answer, correctStr){
  const cw = correctStr.split(/\s+/);
  const topElems = [...answer.querySelectorAll('.pz-word:not(.pz-group .pz-word), .pz-group')];

  // Helper: get word texts from a top-level element
  function getElemWords(el){
    if(el.classList.contains('pz-word')) return [el.textContent];
    return [...el.querySelectorAll('.pz-word')].map(w=>w.textContent);
  }

  // Find first valid start index in correctStr for 'words', not overlapping usedRanges
  function findMatchStart(words, usedRanges){
    for(let s=0; s<=cw.length-words.length; s++){
      let ok=true;
      for(let j=0;j<words.length;j++){
        if(pzNorm(words[j])!==pzNorm(cw[s+j])){ ok=false; break; }
      }
      if(!ok) continue;
      const end=s+words.length-1;
      const overlaps=usedRanges.some(r=>!(end<r.start||s>r.end));
      if(!overlaps) return s;
    }
    return -1;
  }

  // Collect already-locked ranges from existing groups
  const usedRanges=[];
  topElems.forEach(el=>{
    if(el.classList.contains('pz-group')){
      const s=parseInt(el.dataset.start), e=parseInt(el.dataset.end);
      if(!isNaN(s)&&!isNaN(e)) usedRanges.push({start:s,end:e});
    }
  });

  for(let i=0;i<topElems.length-1;i++){
    const leftEl=topElems[i], rightEl=topElems[i+1];
    const lw=getElemWords(leftEl), rw=getElemWords(rightEl);
    const combined=[...lw,...rw];
    let valid=false, startIdx=-1;

    if(leftEl.classList.contains('pz-group')&&rightEl.classList.contains('pz-group')){
      const le=parseInt(leftEl.dataset.end), rs=parseInt(rightEl.dataset.start);
      if(le+1===rs){ valid=true; startIdx=parseInt(leftEl.dataset.start); }
    } else if(leftEl.classList.contains('pz-group')){
      const le=parseInt(leftEl.dataset.end);
      const tempRanges=usedRanges.filter(r=>!(r.start===parseInt(leftEl.dataset.start)&&r.end===parseInt(leftEl.dataset.end)));
      const pos=findMatchStart(rw,tempRanges);
      if(pos===le+1){ valid=true; startIdx=parseInt(leftEl.dataset.start); }
    } else if(rightEl.classList.contains('pz-group')){
      const rs=parseInt(rightEl.dataset.start);
      const tempRanges=usedRanges.filter(r=>!(r.start===parseInt(rightEl.dataset.start)&&r.end===parseInt(rightEl.dataset.end)));
      const pos=findMatchStart(lw,tempRanges);
      if(pos+lw.length===rs){ valid=true; startIdx=pos; }
    } else {
      startIdx=findMatchStart(combined,usedRanges);
      if(startIdx!==-1) valid=true;
    }

    if(!valid) continue;

    let grp;
    if(leftEl.classList.contains('pz-group')){
      grp=leftEl;
      if(rightEl.classList.contains('pz-group')){
        [...rightEl.querySelectorAll('.pz-word')].forEach(w=>grp.appendChild(w));
        grp.dataset.end=rightEl.dataset.end;
        rightEl.remove();
      } else {
        grp.appendChild(rightEl);
        grp.dataset.end=parseInt(grp.dataset.end)+rw.length;
      }
    } else if(rightEl.classList.contains('pz-group')){
      grp=rightEl;
      grp.insertBefore(leftEl,grp.firstChild);
      grp.dataset.start=startIdx;
    } else {
      grp=document.createElement('div');
      grp.className='pz-group';
      grp.dataset.start=startIdx;
      grp.dataset.end=startIdx+combined.length-1;
      _pzSetupGroup(grp);
      answer.insertBefore(grp,leftEl);
      grp.appendChild(leftEl);
      grp.appendChild(rightEl);
    }

    [...answer.querySelectorAll('.pz-group')].forEach(g=>{if(g.children.length===0)g.remove();});
    // Flash animation on the updated group
    requestAnimationFrame(()=>{
      grp.classList.remove('pz-flash');
      void grp.offsetWidth;
      grp.classList.add('pz-flash');
      grp.addEventListener('animationend',()=>grp.classList.remove('pz-flash'),{once:true});
    });
    return true;
  }
  return false;
}

// ZUORDNEN-SPIEL (Spiele-Tab)
// ════════════════════════════════════════════════
const zuState = {};

// Group border/bg colours
const ZU_COLORS = ['#f87171','#60a5fa','#4ade80','#fbbf24','#a78bfa','#f472b6','#34d399','#fb923c'];
const ZU_BG     = ['rgba(248,113,113,0.13)','rgba(96,165,250,0.13)','rgba(74,222,128,0.13)',
                   'rgba(251,191,36,0.13)','rgba(167,139,250,0.13)','rgba(244,114,182,0.13)',
                   'rgba(52,211,153,0.13)','rgba(251,146,60,0.13)'];

function buildZuordnenPanel(panel, uid){

  panel.style.overflowX      = 'hidden';

  zuState[uid] = { groups:[], rawText:'', numGroups:3, phase:'setup', activeGroup:null };

  // ── Scroll area (TXT/Einträge buttons + game) — no scroll, fits window ──
  const scrollArea = document.createElement('div');
  scrollArea.style.cssText = 'flex:1 1 0;min-height:0;overflow:hidden;padding:8px 10px;display:flex;flex-direction:column;gap:6px;scrollbar-width:none;';
  panel.appendChild(scrollArea);

  // Button row: Einträge only
  const btnRow = document.createElement('div');
  btnRow.style.cssText = 'display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex-shrink:0;';
  scrollArea.appendChild(btnRow);

  // Einträge button
  const eintraegeBtn = document.createElement('button');
  eintraegeBtn.className = 'pz-file-label';
  eintraegeBtn.style.cssText += ';margin-bottom:0;cursor:pointer;';
  eintraegeBtn.dataset.i18n='spieleEintraege'; eintraegeBtn.textContent=T('spieleEintraege');
  eintraegeBtn.onclick = () => zuShowEintraegeModal(uid);
  btnRow.appendChild(eintraegeBtn);

  // Reset button (next to Einträge, same style)

  topResetBtn.className = 'pz-file-label';
  topResetBtn.style.cssText += ';margin-bottom:0;cursor:pointer;';
  topResetBtn.textContent = '↺ '+T('namesResetKurz');
  topResetBtn.style.touchAction = 'manipulation';
  topResetBtn.onclick = () => zuReset(uid);
  btnRow.appendChild(topResetBtn);

  // ── Game area ──
  const gameWrap = document.createElement('div');
  gameWrap.id = `zu-game-${uid}`;
  gameWrap.style.cssText = 'display:flex;flex-direction:column;gap:6px;flex:1 1 0;min-height:0;overflow:hidden;';
  scrollArea.appendChild(gameWrap);

  // Beispiel-Einträge sofort anzeigen

  zuState[uid].rawText = defaultText;
  zuStartGame(uid, defaultText);
}

/* ── Einträge modal for Zuordnen ── */
function zuShowEintraegeModal(uid){
  const st = zuState[uid];
  _buildEintraegeModal('zu-eintraege-modal-'+uid, T('zuordnenHint'), true, st.rawText || '', (text, overlay) => {
    st.rawText = text;
    zuStartGame(uid, text);
    overlay.remove();
  });
}

function zuParseText(text){
  const lines = text.split(/\r?\n/);
  const groups = [];
  let cur = null;
  let firstLine = true;
  for(const raw of lines){
    const line = raw.trim();
    if(!line){ firstLine = true; continue; }
    if(/^\d+$/.test(line)){
      if(cur) groups.push(cur);
      cur = { title:'', words:[] };
      firstLine = true;
      continue;
    }
    if(!cur) cur = { title:'', words:[] };
    if(firstLine){ cur.title = line; firstLine = false; }
    else cur.words.push(line);
  }
  if(cur) groups.push(cur);
  return groups.filter(g=>g.title);
}

function zuStartGame(uid, rawText){
  const st = zuState[uid];
  st.rawText = rawText;
  const groups = zuParseText(rawText);
  if(groups.length < 2) return;
  st.groups      = groups;
  st.phase       = 'playing';
  st.activeGroup = null;
  zuBuildGame(uid);
}

function zuBuildGame(uid){
  const st       = zuState[uid];
  const gameWrap = document.getElementById(`zu-game-${uid}`);
  if(!gameWrap) return;
  gameWrap.innerHTML = '';
  st.activeGroup = null;

  // ── Title chips row ──
  const titlesRow = document.createElement('div');
  titlesRow.className = 'zu-titles-row';
  titlesRow.id = `zu-titles-${uid}`;
  gameWrap.appendChild(titlesRow);

  st.groups.forEach((g, gi) => {
    const color = ZU_COLORS[gi % ZU_COLORS.length];
    const bg    = ZU_BG[gi % ZU_BG.length];
    const titleEl = document.createElement('div');
    titleEl.className = 'zu-title';
    titleEl.style.background  = color;
    titleEl.style.color       = '#fff';
    titleEl.style.opacity     = '0.65';
    titleEl.textContent = g.title;
    titleEl.dataset.zuGroup = gi;
    titleEl.dataset.zuUid   = uid;
    titleEl.addEventListener('click', () => zuSelectTitle(uid, gi));
    titlesRow.appendChild(titleEl);
  });

  // ── Text field (word chips) ──
  const textfield = document.createElement('div');
  textfield.className = 'zu-textfield';
  textfield.id = `zu-textfield-${uid}`;
  // flex:1 füllt den verbleibenden Platz zwischen Titelleiste und Prüfen-Button
  textfield.style.cssText = 'flex:1 1 0;min-height:0;overflow-y:auto;overflow-x:hidden;align-content:flex-start;';
  gameWrap.appendChild(textfield);

  // Collect all words shuffled
  const allWords = [];
  st.groups.forEach((g, gi) => {
    g.words.forEach(w => allWords.push({ groupIdx: gi, text: w }));
  });
  allWords.sort(() => Math.random() - 0.5);

  allWords.forEach(item => {
    const el = document.createElement('div');
    el.className = 'zu-word';
    el.textContent = item.text;
    el.dataset.zuGroup    = item.groupIdx;
    el.dataset.zuText     = item.text;
    el.dataset.zuMarked   = '';   // will hold assigned group index or ''
    el.addEventListener('click', () => zuMarkWord(uid, el));
    textfield.appendChild(el);
  });

  // ── Prüfen row (only) ──
  const checkRow = document.createElement('div');
  checkRow.className = 'zu-check-row';
  checkRow.id = `zu-check-row-${uid}`;

  const checkBtn = document.createElement('button');
  checkBtn.className = 'wbtn primary';
  checkBtn.textContent = '✔ '+T('pzPruefen').replace(' ✔','');
  checkBtn.style.cssText = 'touch-action:manipulation;font-size:clamp(14px,calc(var(--uiscale,1)*16px),22px);padding:calc(var(--uiscale,1)*8px) calc(var(--uiscale,1)*20px);';
  checkBtn.onclick = () => zuPruefen(uid);
  checkRow.appendChild(checkBtn);

  gameWrap.appendChild(checkRow);
}

/* ── Select a title (active colour pen) ── */
function zuSelectTitle(uid, gi){
  const st = zuState[uid];
  if(st.phase !== 'playing') return;
  // Toggle off if already active
  if(st.activeGroup === gi){
    st.activeGroup = null;
  } else {
    st.activeGroup = gi;
  }
  // Update title highlight — active = full opacity, inactive = dimmed
  document.querySelectorAll(`[data-zu-uid="${uid}"].zu-title`).forEach(el => {
    const elGi = parseInt(el.dataset.zuGroup);
    const isActive = elGi === st.activeGroup;
    el.classList.toggle('zu-active-title', isActive);
    el.style.opacity   = isActive ? '1' : (st.activeGroup === null ? '0.65' : '0.45');
    el.style.transform = isActive ? 'scale(1.08)' : 'scale(1)';
    el.style.boxShadow = isActive ? '0 4px 16px rgba(0,0,0,0.35)' : '0 2px 8px rgba(0,0,0,0.25)';
  });
}

/* ── Click a word chip to mark/unmark ── */
function zuMarkWord(uid, el){
  const st = zuState[uid];
  if(st.phase !== 'playing') return;
  // Korrekt markierte Wörter sind gesperrt
  if(el.dataset.zuCorrect === '1') return;

  try{const ac=new (window.AudioContext||window.webkitAudioContext)();playPop(ac,0.8);}catch(e){}

  const gi = st.activeGroup;
  const prevMarked = el.dataset.zuMarked !== '' ? parseInt(el.dataset.zuMarked) : null;

  if(gi === null){
    // No title active — clicking removes mark
    el.dataset.zuMarked = '';
    el.classList.remove('zu-marked');
    el.style.background = '#fff';
    el.style.color      = '#111';
    el.style.boxShadow  = '0 2px 6px rgba(0,0,0,0.35)';
    return;
  }

  if(prevMarked === gi){
    // Already marked with this colour → toggle off
    el.dataset.zuMarked = '';
    el.classList.remove('zu-marked');
    el.style.background = '#fff';
    el.style.color      = '#111';
    el.style.boxShadow  = '0 2px 6px rgba(0,0,0,0.35)';
  } else {
    // Mark with active group colour
    const color = ZU_COLORS[gi % ZU_COLORS.length];
    el.dataset.zuMarked = gi;
    el.classList.add('zu-marked');
    el.style.background = color;
    el.style.color      = '#fff';
    el.style.boxShadow  = `0 3px 10px rgba(0,0,0,0.4)`;
  }
}

/* ── Prüfen: check all markings ── */
function zuPruefen(uid){
  const st = zuState[uid];
  if(st.phase !== 'playing') return;

  const textfield = document.getElementById(`zu-textfield-${uid}`);
  if(!textfield) return;

  const words = Array.from(textfield.querySelectorAll('.zu-word'));
  let correct = 0, wrong = 0, unmarked = 0;

  // Map: Wort-Text -> { Gruppen-Index: Anzahl Vorkommen in dieser Gruppe }
  // (erlaubt korrekte Zuordnung bei doppelten Einträgen mit identischem Inhalt in mehreren Gruppen,
  //  aber maximal so oft pro Gruppe, wie der Text dort tatsächlich vorkommt)
  const textToGroupCounts = {};
  st.groups.forEach((g, gi) => {
    g.words.forEach(w => {
      if(!textToGroupCounts[w]) textToGroupCounts[w] = {};
      textToGroupCounts[w][gi] = (textToGroupCounts[w][gi] || 0) + 1;
    });
  });

  // Belegungs-Zähler: wie viele Treffer eines Textes wurden bereits einer Gruppe zugerechnet
  const usedCounts = {};
  const getUsed = (text, gi) => (usedCounts[text] && usedCounts[text][gi]) || 0;
  const incUsed = (text, gi) => {
    if(!usedCounts[text]) usedCounts[text] = {};
    usedCounts[text][gi] = (usedCounts[text][gi] || 0) + 1;
  };

  // Bereits zuvor korrekt gesperrte Wörter belegen ihren Platz weiterhin
  words.forEach(el => {
    if(el.dataset.zuCorrect === '1'){
      incUsed(el.dataset.zuText, parseInt(el.dataset.zuMarked));
    }
  });

  // First pass: classify each word (skip already-locked correct ones)
  const results = words.map(el => {
    if(el.dataset.zuCorrect === '1') return { el, status: 'already_correct' };
    const markedStr = el.dataset.zuMarked;
    if(markedStr === '') return { el, status: 'unmarked' };
    const markedGroup = parseInt(markedStr);
    const text = el.dataset.zuText;
    const allowed = (textToGroupCounts[text] && textToGroupCounts[text][markedGroup]) || 0;
    const isCorrect = getUsed(text, markedGroup) < allowed;
    if(isCorrect) incUsed(text, markedGroup);
    return { el, status: isCorrect ? 'correct' : 'wrong' };
  });

  results.forEach(r => {
    if(r.status === 'unmarked') unmarked++;
    else if(r.status === 'correct' || r.status === 'already_correct') correct++;
    else if(r.status === 'wrong') wrong++;
  });

  // Shake unmarked immediately
  results.filter(r => r.status === 'unmarked').forEach(r => {
    r.el.style.animation = 'none';
    requestAnimationFrame(() => {
      r.el.style.animation = 'zu-shake 0.35s ease-out both';
      r.el.addEventListener('animationend', () => { r.el.style.animation = ''; }, {once:true});
    });
  });

  // Sequential flash for newly-marked words only
  const marked = results.filter(r => r.status === 'correct' || r.status === 'wrong');
  const DELAY = 180; // ms between each word

  marked.forEach((r, idx) => {
    setTimeout(() => {
      const el = r.el;
      if(r.status === 'correct'){
        // Kurzes Hüpfen, dann das Wort sperren
        const lockColor = ZU_COLORS[parseInt(el.dataset.zuMarked) % ZU_COLORS.length];
        pzBeep(660, 'sine', 0.18, 0.18, 0);
        el.style.animation = 'none';
        requestAnimationFrame(() => {
          el.style.animation = 'zu-hop 0.4s ease-out both';
          el.addEventListener('animationend', () => { el.style.animation = ''; }, {once:true});
        });
        setTimeout(() => {
          el.style.transition = 'background 0.4s, color 0.2s, opacity 0.4s';
          el.style.background = lockColor;
          el.style.color      = '#fff';
          el.style.opacity    = '0.72';
          el.style.boxShadow  = '0 1px 4px rgba(0,0,0,0.25)';
          el.dataset.zuCorrect = '1';
          el.classList.add('zu-correct-locked');
        }, 350);
      } else {
        // Red flash + shake + reset to unmarked
        el.style.transition = 'background 0.05s, color 0.05s';
        el.style.background = '#f87171';
        el.style.color = '#fff';
        pzBeep(220, 'sawtooth', 0.18, 0.18, 0);
        el.style.animation = 'none';
        requestAnimationFrame(() => {
          el.style.animation = 'zu-shake 0.35s ease-out both';
          el.addEventListener('animationend', () => {
            el.style.animation  = '';
            el.style.transition = '';
            el.dataset.zuMarked = '';
            el.classList.remove('zu-marked');
            el.style.background = '#fff';
            el.style.color      = '#111';
            el.style.boxShadow  = '0 2px 6px rgba(0,0,0,0.35)';
          }, {once:true});
        });
      }
    }, idx * DELAY);
  });

  const total = words.length;
  const afterAllMs = marked.length * DELAY + 500;

  if(wrong === 0 && unmarked === 0 && correct === total){
    // All correct — win after flash sequence
    setTimeout(() => {
      st.phase = 'won';
      pzPlayWin();
      const tf = document.getElementById(`zu-textfield-${uid}`);
      if(tf){
        // Restore all locked words to full saturated colors (remove dimming)
        tf.querySelectorAll('.zu-word.zu-correct-locked').forEach(w => {
          const lockColor = ZU_COLORS[parseInt(w.dataset.zuMarked) % ZU_COLORS.length];
          w.style.transition = 'background 0.4s, opacity 0.4s, box-shadow 0.4s';
          w.style.opacity    = '1';
          w.style.background = lockColor;
          w.style.color      = '#fff';
          w.style.boxShadow  = '0 3px 12px rgba(0,0,0,0.45)';
        });
        // Restore all title chips to full opacity
        const titlesRow = document.getElementById(`zu-titles-${uid}`);
        if(titlesRow) titlesRow.querySelectorAll('.zu-title').forEach(t => {
          t.style.transition = 'opacity 0.4s, box-shadow 0.4s, transform 0.4s';
          t.style.opacity    = '1';
          t.style.transform  = 'scale(1)';
          t.style.boxShadow  = '0 4px 16px rgba(0,0,0,0.35)';
        });
        tf.classList.remove('zu-flash');
        void tf.offsetWidth;
        tf.classList.add('zu-flash');
        tf.addEventListener('animationend', () => tf.classList.remove('zu-flash'), {once:true});
      }
    }, afterAllMs);
  }
}

// ════════════════════════════════════════════════
// ZUMPAD
// ════════════════════════════════════════════════
// ── ZUMpad Import-Logik ──────────────────────────────────────────────
// Format im Pad:
//   !FunktionName
//   Inhalt Zeile 1
//   Inhalt Zeile 2
//   ...
//   !NächsteFunktion
//   ...
// Unterstützte Funktionsnamen (Groß-/Kleinschreibung egal):
//   textpad, namen, namenliste, satzbau, rad, wheel, slot

function _zumpadParseBlocks(text){
  // Gibt Array von {name, content} zurück
  const blocks = [];
  let cur = null;
  for(const rawLine of text.split(/\r?\n/)){
    const line = rawLine.trimEnd();
    if(line.startsWith('!')){
      if(cur) blocks.push(cur);
      cur = {name: line.slice(1).trim().toLowerCase(), lines: []};
    } else if(cur){
      cur.lines.push(rawLine);
    }
  }
  if(cur) blocks.push(cur);
  return blocks;
}

const _ZUMPAD_FUNC_ALIASES = {
  textpad:['textpad','text','notiz','note'],
  namen:['namen','namenliste','names','namensliste'],
  satzbau:['satzbau','sb'],
  wheel:['rad','wheel','glücksrad','dreh'],
  slot:['slot','einarmiger','slotmaschine','slots'],
  puzzle:['puzzle','wortpuzzle','satzpuzzle'],
  zuordnen:['zuordnen','zuordnung','kategorien'],
};

function _zumpadDetectType(name){
  for(const [key, aliases] of Object.entries(_ZUMPAD_FUNC_ALIASES)){
    if(aliases.includes(name)) return key;
  }
  return null;
}

function _zumpadImportBlocks(blocks, onDone){
  // uid als Integer aus Widget-Element extrahieren
  function _elUid(el){
    if(!el) return null;
    const raw = (el.id||'').match(/(\d+)$/)?.[1];
    return raw != null ? parseInt(raw) : null;
  }

  // Gibt uid eines vorhandenen Widgets zurück, oder spawnt es neu
  function _ensureWidget(domType){
    let w = document.querySelector(`.widget[data-type="${domType}"]`);
    if(!w) w = spawnWidget(domType);
    return _elUid(w);
  }

  // Vorab alle benötigten Widgets spawnen, damit das DOM vollständig aufgebaut ist
  const needsSpiele = blocks.some(b => ['wheel','slot','puzzle','zuordnen'].includes(_zumpadDetectType(b.name)));
  const needsNames  = blocks.some(b => _zumpadDetectType(b.name) === 'namen');
  const needsDice   = blocks.some(b => _zumpadDetectType(b.name) === 'satzbau');
  const needsText   = blocks.some(b => _zumpadDetectType(b.name) === 'textpad');

  let spieleUid = null;
  if(needsSpiele) spieleUid = _ensureWidget('spiele');
  if(needsNames)  _ensureWidget('names');
  if(needsDice)   _ensureWidget('dice');
  if(needsText)   _ensureWidget('textpad');

  // Nach einem Frame importieren — DOM ist dann vollständig gerendert
  requestAnimationFrame(() => setTimeout(() => {
    const handled = [];

    for(const block of blocks){
      const type = _zumpadDetectType(block.name);
      if(!type) continue;
      const content = block.lines.join('\n').trim();
      if(!content) continue;

      if(type === 'textpad'){
        const uid = _elUid(document.querySelector('.widget[data-type="textpad"]'));
        if(uid != null){
          const el = document.getElementById('textpad-'+uid);
          if(el){ el.innerText = content; typeof updateTPCounter==='function' && updateTPCounter(uid); }
          handled.push('Textpad');
        }

      } else if(type === 'namen'){
        const uid = _elUid(document.querySelector('.widget[data-type="names"]'));
        if(uid != null){
          const ta = document.getElementById('namelist-'+uid);
          if(ta) ta.value = content;
          if(typeof _nameFontCache !== 'undefined') _nameFontCache[uid] = null;
          handled.push('Namen');
        }

      } else if(type === 'satzbau'){
        const uid = _elUid(document.querySelector('.widget[data-type="dice"]'));
        if(uid != null){
          if(!satzbauWords[uid]) satzbauWords[uid]={};
          satzbauWords[uid]._draftText = content;
          const parsed = parseSatzbauText(content);
          Object.assign(satzbauWords[uid], parsed);
          satzbauWords[uid]._bags = {};
          handled.push('Satzbau');
        }

      } else if(type === 'wheel'){
        if(spieleUid != null){
          const uid = spieleUid * 1000 + 1;
          if(typeof wheelStates !== 'undefined' && wheelStates[uid]){
            const qs = content.split(/\n+/).map(s=>s.trim()).filter(Boolean);
            if(qs.length >= 1){
              wheelStates[uid].questions = qs;
              wheelStates[uid].selected  = -1;
              wheelStates[uid].bag       = [];
              const ta = document.getElementById('wheel-text-'+uid);
              if(ta) ta.value = content;
              typeof drawQuestionWheel==='function' && drawQuestionWheel(uid);
              const res = document.getElementById('wheel-result-'+uid);
              if(res) res.textContent = T('wheelUebernommen');
            }
            handled.push('Rad');
          }
        }

      } else if(type === 'slot'){
        if(spieleUid != null){
          const uid = spieleUid * 1000 + 2;
          const ta = document.getElementById('slot-textarea-'+uid);
          if(ta){
            ta.value = content;
            typeof slotApplyTextarea==='function' && slotApplyTextarea(uid);
          }
          handled.push('Slot');
        }

      } else if(type === 'puzzle'){
        if(spieleUid != null && typeof pzState !== 'undefined' && pzState[spieleUid]){
          pzState[spieleUid].lastData = content;
          typeof pzProcessData==='function' && pzProcessData(spieleUid, content);
          // Direkt auf Puzzle-Tab wechseln (löst Auto-Vollbild aus)
          typeof spieleShowTab==='function' && spieleShowTab('puzzle', spieleUid);
          handled.push('Puzzle');
        }

      } else if(type === 'zuordnen'){
        if(spieleUid != null && typeof zuState !== 'undefined' && zuState[spieleUid]){
          typeof zuStartGame==='function' && zuStartGame(spieleUid, content);
          // Direkt auf Zuordnen-Tab wechseln (löst Auto-Vollbild aus)
          typeof spieleShowTab==='function' && spieleShowTab('zuordnen', spieleUid);
          handled.push('Zuordnen');
        }
      }
    }

    if(onDone) onDone(handled);
  }, 0));
}

function _zumpadFindUidByType(type){
  // Suche im DOM nach einem Widget des Typs, gib uid zurück
  const w = document.querySelector(`.widget[data-type="${type}"]`);
  if(!w) return null;
  // uid steht als data-uid oder lässt sich aus id ableiten
  if(w.dataset.uid) return w.dataset.uid;
  const id = w.id || '';
  const m = id.match(/(\d+)$/);
  return m ? m[1] : null;
}

function _zumpadShowImportToast(handled){
  // Kurze Statusmeldung
  let toast = document.getElementById('_zumpad-toast');
  if(!toast){
    toast = document.createElement('div');
    toast.id = '_zumpad-toast';
    toast.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:99999;'
      +'background:rgba(36,44,86,0.97);border:1px solid rgba(108,143,255,0.4);border-radius:12px;'
      +'color:#eef0ff;padding:10px 22px;font-size:14px;font-weight:700;pointer-events:none;'
      +'box-shadow:0 4px 24px rgba(0,0,0,0.5);transition:opacity .4s;white-space:nowrap;';
    document.body.appendChild(toast);
  }
  toast.style.opacity='1';
  if(handled.length > 0){
    toast.textContent = '✅ Importiert: ' + handled.join(', ');
  } else {
    toast.textContent = '⚠️ Keine bekannten Funktionsdaten gefunden';
  }
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ toast.style.opacity='0'; }, 3200);
}

async function _zumpadSubmit(){
  const val = document.getElementById('zumpad-input')?.value || '';
  const handled = await _checkStickyCode(val);
  if(!handled) openZumpad();
}

async function openZumpad(){
  const val = (document.getElementById('zumpad-input')?.value||'').trim();
  if(!val){document.getElementById('zumpad-input')?.focus();return;}

  // ZUMpad Plaintext-Export URL
  const exportUrl = 'https://zumpad.zum.de/p/' + encodeURIComponent(val) + '/export/txt';
  const padUrl    = 'https://zumpad.zum.de/p/' + encodeURIComponent(val);

  // Versuche den Textinhalt abzurufen
  let text = null;
  try{
    const resp = await fetch(exportUrl, {signal: AbortSignal.timeout(6000)});
    if(resp.ok) text = await resp.text();
  } catch(e){ text = null; }

  if(text == null){
    // Netzwerkfehler oder kein Zugriff → normales Tab-Öffnen
    const w = window.open(padUrl, '_blank');
    if(!w){ window.location.href = padUrl; }
    return;
  }

  // Enthält das Pad Funktionsdaten (mind. eine !-Zeile)?
  const blocks = _zumpadParseBlocks(text);
  const hasBlocks = blocks.some(b => _zumpadDetectType(b.name) !== null);

  if(!hasBlocks){
    // Kein bekanntes Schema → in neuem Tab öffnen wie bisher
    const w = window.open(padUrl, '_blank');
    if(!w){ window.location.href = padUrl; }
    return;
  }

  // Import durchführen (async: wartet auf DOM-Frame)
  _zumpadImportBlocks(blocks, handled => _zumpadShowImportToast(handled));
}

function toggleFullscreen(){
  if(!document.fullscreenElement){
    // Use element fullscreen on the app wrapper so the browser respects
    // the OS taskbar — visualViewport reports the actually visible area.
    const el = document.getElementById('bg-layer')?.parentElement || document.body;
    (document.getElementById('topbar')?.closest('body') || document.documentElement)
      .requestFullscreen?.().catch(()=>{});
  } else {
    document.exitFullscreen?.();
  }
}

// When entering/leaving fullscreen, re-run setDesktopTop so the desktop
// area uses the visible viewport (which already excludes the taskbar on
// systems where the taskbar stays visible).
document.addEventListener('fullscreenchange', ()=>{
  // Small delay so the viewport has settled after the transition
  setTimeout(setDesktopTop, 80);
  setTimeout(setDesktopTop, 300);
  // Overlay-Fullscreen-Button aktualisieren
  const fsBtn = document.getElementById('spiel-overlay-fs');
  if(fsBtn) fsBtn.textContent = document.fullscreenElement ? '⧉' : '⛶';
});

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  if(e.target.isContentEditable)return;
  if(e.key===' '){e.preventDefault();timerRunning?pauseTimer():startTimer();}
  if(e.key==='Escape'){document.getElementById('bg-panel').classList.remove('open');document.getElementById('sound-menu').classList.remove('open');document.exitFullscreen?.();}
});

  "Name?",

];

const wheelStates = {};

function buildWheel(body, uid){
  body.innerHTML = `
<div class="wheel-tabbar">
  <button class="pz-file-label" id="wheel-tab-edit-${uid}" onclick="wheelShowEintraegeModal(${uid})">${T('spieleEintraege')}</button>
  <button class="wbtn wheel-fragen-btn" id="wheel-zufall-btn-${uid}" onclick="toggleWheelZufall(${uid})" title="Zufall an/aus" style="font-size:.82em;padding:.3em .75em;white-space:nowrap;" data-i18n="diceZufallAn"></button>
</div>

<div id="wheel-play-${uid}" class="wheel-box">
  <div class="wheel-stage">
    <div class="wheel-pointer" id="wheel-pointer-${uid}" onclick="stopQuestionWheel(${uid})" title="Stoppen"><svg viewBox="0 0 28 36" width="40" height="52" xmlns="http://www.w3.org/2000/svg"><polygon points="14,36 0,0 28,0" fill="#ffffff" filter="url(#ps)"/><defs><filter id="ps" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="rgba(0,0,0,0.55)"/></filter></defs></svg></div>
    <canvas id="wheel-canvas-${uid}" class="wheel-canvas" onclick="spinQuestionWheel(${uid})" style="cursor:pointer;" data-i18n-title="ttKlickenDrehen" title="" data-i18n-title="ttKlickenDrehen"></canvas>
  </div>
</div>`;

  wheelStates[uid] = {
    questions: [...WHEEL_QUESTIONS_DEFAULT],
    angle: 0,
    spinning: false,
    selected: -1,
    raf: null,
    zufallAus: false,
    bag: []
  };

  const cv = document.getElementById('wheel-canvas-'+uid);
  function resize(){
    const stage = cv.closest('.wheel-stage');
    if(!stage) return;
    const sw = stage.clientWidth  || 300;
    const sh = stage.clientHeight || 300;
    const size = Math.max(120, Math.min(sw, sh, 680));
    const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    cv.width  = Math.round(size * dpr);
    cv.height = Math.round(size * dpr);
    cv.style.width  = size + 'px';
    cv.style.height = size + 'px';
    const pointer = document.getElementById('wheel-pointer-'+uid);
    if(pointer){
      const scale = size / 560;
      const pw = Math.max(18, Math.round(40 * scale));
      const ph = Math.max(24, Math.round(52 * scale));
      const pt = Math.round(-14 * scale);
      const svg = pointer.querySelector('svg');
      if(svg){ svg.setAttribute('width', pw); svg.setAttribute('height', ph); }
      pointer.style.top = pt + 'px';
    }
    drawQuestionWheel(uid);
  }
  setTimeout(resize, 0);
  if(window.ResizeObserver){ new ResizeObserver(resize).observe(cv.closest('.wheel-stage')); }
}

function saveWheelQuestions(uid){
  const txt = document.getElementById('wheel-text-'+uid)?.value || '';
  const qs = txt.split(/\n+/).map(s=>s.trim()).filter(Boolean);

  wheelStates[uid].questions = qs;
  wheelStates[uid].selected = -1;
  wheelStates[uid].bag = []; // reset bag after new entries
  const _r = document.getElementById('wheel-result-'+uid); if(_r) _r.textContent = T('wheelUebernommen');
  drawQuestionWheel(uid);
  wheelShowTab('play', uid);
}

function drawQuestionWheel(uid){
  const st = wheelStates[uid];
  const cv = document.getElementById('wheel-canvas-'+uid);
  if(!st || !cv) return;
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  if(!W || !H) return;
  const cx = W/2, cy = H/2;
  const R = Math.min(W,H)*0.47;
  const inner = R*0.17;
  const qs = st.questions;
  const n = qs.length;
  const colors = ['#0ea5e9','#dc2626','#16a34a','#9333ea','#1d4ed8','#ea580c'];
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(st.angle);
  const seg = Math.PI*2/n;

  for(let i=0;i<n;i++){
    const a0 = i*seg - seg/2;
    const a1 = a0 + seg;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0,0,R,a0,a1);
    ctx.closePath();
    ctx.fillStyle = colors[i%colors.length];
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,215,0,.95)';
    ctx.lineWidth = Math.max(2, W*0.003);
    ctx.stroke();

    // Beschriftung: Schriftgröße passt sich der Segmentbreite an
    const mid = (a0+a1)/2;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0,0,R,a0+0.012,a1-0.012);
    ctx.closePath();
    ctx.clip();
    ctx.rotate(mid);
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.shadowColor='rgba(0,0,0,.55)';
    ctx.shadowBlur=3;

    // Verfügbare Bogenhöhe und radiale Breite
    // Einzeilige Darstellung: Schriftgröße so groß wie möglich, Text passt in maxW
    const maxW = R * 0.62;
    const arcH = seg * R * 0.72;
    const fullText = String(qs[i] || '').replace(/\s+/g,' ').trim();
    let fs = Math.min(Math.round(arcH * 0.72), Math.round(R * 0.13));
    fs = Math.max(fs, 9);
    ctx.font = `900 ${fs}px Arial, sans-serif`;
    // Schriftgröße verkleinern bis Text in einer Zeile passt
    while(fs > 7 && ctx.measureText(fullText).width > maxW){
      fs -= 1;
      ctx.font = `900 ${fs}px Arial, sans-serif`;
    }
    ctx.fillText(fullText, R * 0.91, 0, maxW);
    ctx.restore();  }

  // outer rim
  ctx.beginPath(); ctx.arc(0,0,R,0,Math.PI*2);
  ctx.strokeStyle='rgba(255,215,0,.95)'; ctx.lineWidth=Math.max(8,W*.01); ctx.stroke();
  // center hole
  const g = ctx.createRadialGradient(0,0,inner*0.1,0,0,inner);
  g.addColorStop(0,'#fff9c0'); g.addColorStop(0.45,'#FFD700'); g.addColorStop(1,'#b8860b');
  ctx.beginPath(); ctx.arc(0,0,inner,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.lineWidth=Math.max(3,W*.004); ctx.stroke();
  ctx.restore();
}

function shortWheelLabel(text){
  let t = String(text || "").replace(/\s+/g," ").trim();
  if(t.length <= 16) return t;
  const key = t.match(/^(Woher|Wohin|Welche|Warum|Wann|Wie lange|Wie oft|Wie|Was|Wer|Wo|Haben|Sport|Geschwister|studieren)/i);
  if(key) return key[0] + " … ?";
  return t.slice(0,14).trim() + "…";
}

function wrapWheelText(ctx, text, x, y, maxWidth, lineHeight){
  const words = text.split(' ');
  const lines=[]; let line='';
  for(const w of words){
    const test = line ? line+' '+w : w;
    if(ctx.measureText(test).width > maxWidth && line){ lines.push(line); line=w; }
    else line=test;
  }
  if(line) lines.push(line);
  const start = y - (lines.length-1)*lineHeight/2;
  lines.slice(0,2).forEach((ln,i)=>ctx.fillText(ln,x,start+i*lineHeight));
}


function wheelSelectedFromAngle(uid){
  const st = wheelStates[uid];
  if(!st || !st.questions || !st.questions.length) return -1;
  const n = st.questions.length;
  const seg = Math.PI*2/n;
  let a = st.angle % (Math.PI*2);
  if(a < 0) a += Math.PI*2;
  // Pfeil steht oben (−π/2). Das Segment unter dem oberen Zeiger ist die Auswahl.
  let idx = Math.round((-Math.PI/2 - a) / seg) % n;
  if(idx < 0) idx += n;
  return idx;
}

function finishQuestionWheel(uid, forced=false){
  const st = wheelStates[uid];
  if(!st) return;
  const result = document.getElementById('wheel-result-'+uid);
  const pointer = document.getElementById('wheel-pointer-'+uid);
  const idx = wheelSelectedFromAngle(uid);
  st.spinning = false;
  st.selected = idx;
  if(pointer) pointer.classList.remove('active');
  if(result && idx >= 0) result.textContent = st.questions[idx];
  try{ playCurrentSound(forced ? 0.45 : 0.6); }catch(_){ }
  if(idx >= 0 && st.questions[idx]){
    const colors = ['#0ea5e9','#dc2626','#16a34a','#9333ea','#1d4ed8','#ea580c'];
    const segColor = colors[idx % colors.length];
    showWheelResultOverlay(uid, st.questions[idx], segColor);
  }
}

function stopQuestionWheel(uid){
  const st = wheelStates[uid];
  if(!st || !st.spinning) return;
  st.spinning = false;
  if(st.raf) cancelAnimationFrame(st.raf);
  finishQuestionWheel(uid, true);
}

function spinQuestionWheel(uid){
  const st = wheelStates[uid];
  if(!st || st.spinning) return;
  const result = document.getElementById('wheel-result-'+uid);
  const n = st.questions.length;

  // Bag-shuffle: cycle through all entries before repeating
  let selected;
  if(st.zufallAus){
    if(!st.bag || st.bag.length === 0){
      const arr = Array.from({length:n},(_,i)=>i);
      for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
      st.bag = arr;
    }
    selected = st.bag.pop();
  } else {
    selected = Math.floor(Math.random()*n);
  }

  const seg = Math.PI*2/n;
  const current = st.angle;
  const targetAngle = -Math.PI/2 - selected*seg;
  const extra = Math.PI*2*(5 + Math.floor(Math.random()*3));
  let final = targetAngle + extra;
  while(final < current + Math.PI*2*4) final += Math.PI*2;
  const start = current;
  const delta = final - start;
  const duration = 3600;
  const t0 = performance.now();
  st.spinning = true;
  if(result) result.textContent = 'Dreht …';
  const pointer = document.getElementById('wheel-pointer-'+uid);
  if(pointer) pointer.classList.add('active');
  function easeOutCubic(t){ return 1 - Math.pow(1-t,3); }

  // Roulette pop sounds: schedule pops that slow down as wheel decelerates
  (function scheduleRoulettePops(){
    const popTimes = [];
    // Sample eased progress and find moments when wheel crosses a segment boundary
    let lastAngle = start;
    const steps = 2000;
    for(let i=1; i<=steps; i++){
      const p = i/steps;
      const angle = start + delta*easeOutCubic(p);
      // count how many segment boundaries crossed since last step
      const crossed = Math.floor(angle / (Math.PI*2/Math.max(n,8))) - Math.floor(lastAngle / (Math.PI*2/Math.max(n,8)));
      if(crossed > 0) popTimes.push(p * duration);
      lastAngle = angle;
    }
    popTimes.forEach(t => {
      setTimeout(() => {
        if(!st.spinning && t < duration * 0.99) return; // aborted
        try{ const ac=new (window.AudioContext||window.webkitAudioContext)(); playPop(ac, 0.45); }catch(e){}
      }, t);
    });
  })();

  function frame(now){
    if(!st.spinning) return;
    const p = Math.min(1,(now-t0)/duration);
    st.angle = start + delta*easeOutCubic(p);
    drawQuestionWheel(uid);
    if(p<1){ st.raf = requestAnimationFrame(frame); }
    else{
      finishQuestionWheel(uid, false);
    }
  }
  st.raf = requestAnimationFrame(frame);
}

  <!-- Text options (only when text tool active) -->
  <div class="ddt-text-opts" id="ddt-text-opts">
    <select class="ddt-text-sel" id="ddt-textfont" onchange="ddtUpdateTextCursor()" title="Schriftart" style="min-width:140px;">
      <option value="Arial">Arial</option>
      <option value="Verdana">Verdana</option>
      <option value="Tahoma">Tahoma</option>
      <option value="Trebuchet MS">Trebuchet MS</option>
      <option value="Georgia">Georgia</option>
      <option value="Garamond">Garamond</option>
      <option value="Palatino Linotype">Palatino Linotype</option>
      <option value="Century Gothic">Century Gothic</option>
      <option value="'Courier New'">Courier New</option>
      <option value="Impact">Impact</option>
      <option value="'Comic Sans MS'">Comic Sans MS</option>
    </select>
    <select class="ddt-text-sel" id="ddt-textsize" onchange="ddtUpdateTextCursor()" title="Schriftgröße">
      <option value="14">14</option>
      <option value="20" selected>20</option>
      <option value="28">28</option>
      <option value="40">40</option>
